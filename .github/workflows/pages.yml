# PKC3 GitHub Pages デプロイ(設計 doc §8)
#   /     = プロダクト版(最新 release tag。初回 release まで placeholder)
#   /dev/ = dev 版(main HEAD)
# CI artifact に private data を載せない規律(PKC2 2026-05-05 user direction)を継承:
# デプロイ対象はビルド生成物のみ。
name: Deploy Pages
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build dev (main HEAD)
        run: |
          npm ci
          VITE_PKC_KIND=dev npm run build
          node scripts/check-dist.mjs dev
          mkdir -p _site/dev
          cp -r dist/. _site/dev/
      - name: Deploy product (release の成果物そのもの / 初回 release まで placeholder)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 🔴 **release に添付した zip をそのまま配る**(P7 段⑧ round-2 review M-4)。
          # 以前は同じ tag を worktree で**もう一度ビルド**していたが、それだと
          # Pages に出る物と `release.yml` が attestation を付けた物が**別の成果物**に
          # なり、「配る物そのものに provenance を付ける」が Pages 経路で成立しない。
          # 展開してそのまま配れば、**user が触る物 = 検証できる物**になる。
          # ⚠ 副産物として product の再ビルド(npm ci + build)が丸ごと消える。
          #
          # 🔴 prerelease を product として配らない(round-2 review M-5)。git の既定
          # `v:refname` は prerelease を**上位に**並べるので、`v3.0.0` と `v3.0.0-rc1`
          # が在ると head -1 は **rc のほう**になる(実証済み)。⚠ 除外の綴りは
          # `release.yml` の判定と揃える(`tests/release-meta.test.ts` が一致を pin)
          TAG=$(git tag -l 'v*' --sort=-v:refname | grep -Ev -- '-(rc|beta|alpha)' | head -1)
          # 🔴 `[ -n "$TAG" ] && cmd || true` と書いてはいけない ── `&&` と `||` は
          # 同順位・左結合なので `((A && B) || true)` になり、**「無いとき」ではなく
          # 「失敗したとき」も飛ばす**(段① review H-1 で実証:検品が ✗ を出しても
          # step は exit 0 だった)。`if …; then …; fi` と書く
          if [ -n "$TAG" ] && gh release view "$TAG" --json assets \
               --jq '.assets[].name' | grep -qx 'pkc3-dist.zip'; then
            mkdir -p /tmp/product
            gh release download "$TAG" --pattern pkc3-dist.zip --dir /tmp/product
            unzip -q /tmp/product/pkc3-dist.zip -d _site
            # ⚠ 配る直前にもう一度検品する ── release 時に通っていても、
            # 展開の取り違え(空 / 別物)はここでしか捕まらない
            node scripts/check-dist.mjs product _site
          else
            echo "安定 release がまだ無いので placeholder を配る(tag='$TAG')"
            cp .github/pages-placeholder.html _site/index.html
          fi
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
