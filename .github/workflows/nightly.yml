# PKC3 nightly — 重い検証の受け皿(CLAUDE.md プロセス指示: PR gate は速い lane
# 限定、視覚全量・ベンチ・大規模 probe はここへ)。schedule + 手動 dispatch。
#
# 🔴 **1 つ落ちても、後ろを止めない**(#221、2026-08-17)。
#
# 直すまでは step の既定(前が落ちたら以降 skip)のままだったので、
# **sidebar probe が落ちた 13 晩、editor と kanban の probe は 1 度も走っていなかった**
# ── 赤の意味が「サイドバーが壊れた」なのか「夜の検査が止まった」なのか名前で
# 言えない状態で、CLAUDE.md「回すものの粒度: 1 job = 1 主張」に真正面から反していた。
# 🔑 検証の step には `if: ${{ !cancelled() }}` を付け、**全部走らせてから**まとめて
# 赤にする。揃わなかったものの名前は最後の job(`ledger`)が台帳(issue)へ出す。
#
# 🔴 **1 本の `heavy` を、主張ごとの job へ割った**(#695、2026-09-05)。
#
# ⚠ 直す前は `heavy` 1 本 / `timeout-minutes: 30` で、**8 日で 20 分 → 28 分**へ
#   伸びて門に当たり始めた。job が timeout で切られると job は **cancelled** に
#   なるので、末尾に置いていた台帳 step の `if: ${{ !cancelled() }}` が偽 =
#   **skip** される ── つまり **赤い晩ほど台帳に出ない**。実測: run #40
#   (2026-09-03)は全部緑のまま時間切れ、run #38(2026-09-01)は smoke 3 本が
#   赤のまま時間切れで、**`nightly-red` label の issue は 1 本も立っていない**。
#   #221 で直した「赤いまま放置される導線」が、timeout の形で戻っていた。
#
# 🔑 直しは 2 つで 1 組:
#   ① **1 job = 1 主張**(user 指示 2026-08-10)へ割って**並列**に走らせる ──
#      壁時計が縮むので `timeout-minutes: 15` でも収まる。
#      🚫 **timeout を上げない**(30 → 45)── 「CI を長くしない」(user 指示
#      2026-07-30)と逆向きで、しかも tripwire が鈍る(次に本当に遅くなった晩に
#      鳴らない)。⚠ smoke も **1 件も減らさない**(3 本はそれぞれ別の主張)。
#   ② 台帳を**別の job** にして `needs` + `if: always()` で受ける ──
#      `needs.<job>.result` は timeout で切られた job を **`cancelled`** として
#      持ち、`always()` は cancel の回でも走るので、**時間切れの晩こそ記録が残る**。
#      判定(何を赤と数えるか)は今までどおり `scripts/nightly-red.mjs` の
#      `unmetSteps` 側にある ── workflow に判定を書かない。
name: Nightly
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
  # 赤い夜を issue に出す(下の `ledger` job。#221 の 3 つ目 ──
  # 「夜が赤いまま放置される導線」を直すのが目的で、書くのは issue 1 本だけ)
  issues: write
jobs:
  # ── smoke は 2 つのブラウザ両方で回す ────────────────────────────────
  # 🔴 CLAUDE.md「実ブラウザ依存の spec は両方で通してから push する」。PR gate は
  # 速さのため headless_shell 片方だけなので、**両方を突き合わせる場所は nightly
  # しかない**。だから 2 つを別 job に割った ── 落ちたとき、どちらのブラウザで
  # 壊れたのかが **job の名前で分かる**。
  #
  # 🔑 **全 step に id を付ける**(2026-08-17 のレビュー 🔴-1)。台帳が読むのは
  #   job の結果になったが、id は今も 2 つの役に立つ ── ① `setup_ok` の gate は
  #   `steps` context を読むので、id が無いと成立しない ② run を開いた人が
  #   step を名前で指せる。`tests/workflow-steps.test.ts` が pin する。
  smoke_headless_shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: npm_ci
      # ⚠ smoke は `vite preview` で **`dist/` を配信する**ので build が要る
      #   (source を書き換えただけでは smoke に一切届かない ── CLAUDE.md §3)
      - run: npm run build
        id: build
      - run: npx playwright install chromium --with-deps
        id: pw_install
      - name: Visual smoke (headless_shell ── PR gate と同じ)
        id: smoke
        run: npm run test:smoke

  smoke_chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: npm_ci
      - run: npm run build
        id: build
      - run: npx playwright install chromium --with-deps
        id: pw_install
      # 🔴 **path を `$GITHUB_ENV` へ書かない**(2026-08-07)。
      #
      # かつてここで `PKC3_CHROMIUM` を `$GITHUB_ENV` へ書いていた ── これは
      # **以降の全 step に効く**ので、無関係な step の**検査対象まで変える**
      # (当時は smoke まで巻き添えでフル chromium になり、「両方で通している」
      #  つもりのまま片方しか検査していなかった)。
      # ⚠ この job は smoke に**わざと**フル chromium を渡すが、渡す先は step の
      #   `env:` で名指しする(下の「図の全数」は headless_shell のまま)。
      # 🔴 **`echo "$(…)"` は「取れなかった」を食べる**(2026-08-17 のレビュー ⚠-5。
      #   CLAUDE.md §6 の顔違い)── `node` が死んでも `echo` の終了コードが勝つので
      #   step は緑で、`path=` が空のまま渡る。受け側は空文字を素通りする =
      #   「どのブラウザで測ったか分からない回」が緑になる。
      - name: Resolve chromium path
        id: pw
        run: |
          P=$(node -e "const {chromium}=require('@playwright/test'); console.log(chromium.executablePath())")
          if [ -z "$P" ]; then
            echo "::error::chromium の path が取れない ── smoke がどのブラウザで走るか決まらない"
            exit 1
          fi
          echo "path=$P" >> "$GITHUB_OUTPUT"
      # 🔴 **仕込みと検証の間では止める**(2026-08-17 のレビュー ⚠-4)。
      #   検証 step は `!cancelled()` を持つので、仕込みが落ちた晩でも**全部走って
      #   全部落ちる** ── 赤が並び、**本当の原因(npm ci)が名前で出ない**。
      # 🔑 この step は guard を持たない = 手前が落ちれば **skip** される。だから
      #   `outputs.ok` が空になり、下の検証 step は 1 つも走らない。
      - name: 仕込みが揃った
        id: setup_ok
        run: echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Visual smoke (フル chromium ── 実挙動が違う箇所を突き合わせる)
        id: smoke_chromium
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        env:
          PKC3_CHROMIUM: ${{ steps.pw.outputs.path }}
        run: npm run test:smoke
      # 🔴 **重い検査は夜だけ**(#528、2026-08-29)。マニュアルは 22 種を
      #    「そのまま書けます」と言うのに、焼けることを見ていたのは 5 種だけだった。
      #    ⚠ 22 枚を焼くのは重いので PR gate には入れない(smoke lane は 2026-08-28 に
      #    10 分の門へ実際にぶつかっている)。**名前が揃っているか**は unit が PR gate で見る。
      # ⚠ **ここは headless_shell のまま**(`PKC3_CHROMIUM` を渡していない)──
      #    #695 で job を割ったとき置き場としてここへ入れただけで、**何で焼いているかは
      #    変えていない**(変えれば別の主張になる)。だから step の名前に書いておく。
      - name: 図の全数 ── マニュアルの 22 種が焼けるか (headless_shell)
        id: smoke_diagrams_all
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        env:
          PKC3_HEAVY: '1'
        run: npm run test:smoke -- tests/smoke/mermaid-all.smoke.spec.ts

  # 🔴 product bundle は **PR gate が一度もビルドしない別成果物**である
  # (`BUILD_KIND` が焼き込まれるので entry chunk の中身も content hash も
  #  dev とは違う ── P7 段① レビュー M-1)。Pages の `/` に出るのはこちらなので、
  # nightly で**ビルド → 検品 → smoke** まで通す。PR gate には足さない
  # (CI を長くしない・user 指示 2026-07-30)
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: npm_ci
      - run: npx playwright install chromium --with-deps
        id: pw_install
      # ⚠ **この 3 つには `!cancelled()` を付けない** ── 上の 2 job と違い、ここは
      #   **順番に依存している**(検品は焼きたての dist を読み、smoke はその dist を
      #   配る)。ビルドが落ちた回の「検品」は確かめたことにならないので、skip される
      #   のが正しい。step を割ってあるのは、落ちたときに**ビルド / 検品 / smoke の
      #   どれが壊れたか名前で分かる**ようにするためである。
      - name: Product ビルド (PR gate が触らない成果物)
        id: product_build
        run: VITE_PKC_KIND=product npm run build
      # 🔴 焼きたてなので manual.html の実在も要求する(#648 💭)
      - name: Product 検品 (map の有無 / 参照の実在 / 配る量 / manual.html)
        id: product_check
        run: node scripts/check-dist.mjs product --require-manual
      - name: Product smoke
        id: product_smoke
        run: npm run test:smoke

  rust_and_probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: npm_ci
      # ⚠ probe は `vite`(dev)から読むので dist は要らないが、**外して壊れないことを
      #   確かめる場が夜しかない**ので #695 の割り直しでは落とさなかった(実測 3 秒)。
      - run: npm run build
        id: build
      - run: npx playwright install chromium --with-deps
        id: pw_install
      # ⚠ probe(`tests/probe/run-*.mjs`)は GitHub runner に `/opt/pw-browsers` が
      #   無いので path を要る。だから **probe の step にだけ** `env:` で渡す
      #   (`$GITHUB_ENV` へ書かない ── 上の job の注記と同じ理由)。
      - name: Resolve chromium path for probes
        id: pw
        run: |
          P=$(node -e "const {chromium}=require('@playwright/test'); console.log(chromium.executablePath())")
          if [ -z "$P" ]; then
            echo "::error::chromium の path が取れない ── probe がどのブラウザで走るか決まらない"
            exit 1
          fi
          echo "path=$P" >> "$GITHUB_OUTPUT"
      # 🔑 仕込みと検証の境目(上の job と同じ)。この job は検証 step を 9 本
      #   持っており、1 本落ちても残りを走らせたいので `!cancelled()` で回す。
      - name: 仕込みが揃った
        id: setup_ok
        run: echo "ok=1" >> "$GITHUB_OUTPUT"
      # Rust core: **出荷 .wasm を source から再ビルドして一致を見る**
      # (PR gate では cargo を走らせない ── 再ビルド漏れをここで捕まえる。
      #  rust-toolchain.toml が rustc を pin しているのでバイト一致が期待値)
      - name: Rust wasm — 再ビルドして出荷物と一致するか
        id: rust_rebuild
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        run: |
          BEFORE=$(sha256sum src/adapter/platform/wasm/pkc_core.wasm | cut -d' ' -f1)
          ./scripts/build-wasm.sh
          AFTER=$(sha256sum src/adapter/platform/wasm/pkc_core.wasm | cut -d' ' -f1)
          echo "committed=$BEFORE rebuilt=$AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::出荷 .wasm が source と一致しない ── scripts/build-wasm.sh を実行して commit すること"
            exit 1
          fi
      - name: Rust wasm — TS との等価性(再ビルド後の成果物で)
        id: rust_parity
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        run: npx vitest run tests/adapter/wasm-parity.test.ts
      - name: Start vite dev server (probe pages)
        id: vite_server
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        run: |
          npx vite --port 45731 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:45731/ > /dev/null && break
            sleep 1
          done
          # 起動失敗をここで fail-fast(loop は timeout しても exit 0 のため)
          curl -sf http://localhost:45731/ > /dev/null
      - name: Probe — store (sqlite ops / orphan cascade)
        id: probe_store
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        env:
          PKC3_CHROMIUM: ${{ steps.pw.outputs.path }}
        run: node tests/probe/run-sahpool-probe.mjs http://localhost:45731/tests/probe/store-probe.html
      - name: Probe — sahpool (VFS / journal)
        id: probe_sahpool
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        env:
          PKC3_CHROMIUM: ${{ steps.pw.outputs.path }}
        run: node tests/probe/run-sahpool-probe.mjs http://localhost:45731/tests/probe/sahpool-probe.html
      - name: Probe — sidebar (15k 行の DOM 同一性)
        id: probe_sidebar
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        env:
          PKC3_CHROMIUM: ${{ steps.pw.outputs.path }}
        run: node tests/probe/run-sidebar-probe.mjs
      # 🔴 編集の面は **2 つある**(#172 で既定が live になった)。腕ごとに
      #   主張が違う(live は打鍵で state へ届かないのが設計値)ので step を割る
      #   ── CLAUDE.md「1 job = 1 主張」の step 版。
      - name: Probe — editor / live (既定の面。打鍵は state へ届かない)
        id: probe_editor_live
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        env:
          PKC3_CHROMIUM: ${{ steps.pw.outputs.path }}
        run: node tests/probe/run-editor-probe.mjs --arm=live
      - name: Probe — editor / split (設定で選べる面。1 打鍵 = 1 dispatch)
        id: probe_editor_split
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        env:
          PKC3_CHROMIUM: ${{ steps.pw.outputs.path }}
        run: node tests/probe/run-editor-probe.mjs --arm=split
      # ⚠ **面が引っ越した**(#292 段⑤)── カレンダー / やることの板は
      #   左の列の「予定」タブになったので、probe も名前ごと張り替えた
      - name: Probe — schedule (トグル往復 / 札の同一性)
        id: probe_schedule
        if: ${{ !cancelled() && steps.setup_ok.outputs.ok == '1' }}
        env:
          PKC3_CHROMIUM: ${{ steps.pw.outputs.path }}
        run: node tests/probe/run-schedule-probe.mjs
      # lease-probe(多重タブの writer 昇格)は SAH 解放待ちが最も flake しやすい
      # ため nightly には入れない ── リース周りを触る PR で手動実行する運用

  # 🔴 **夜の結果を台帳へ出す**(#221 の 3 つ目)。赤いまま 13 晩放置されたのは、
  # 気づく導線が「たまたま Actions を開く」しか無かったからである。
  # ⚠ ここは**通知だけ**で、赤緑そのものは上の job が決める(この job が落ちても、
  #   落ちた job の赤は消えない)。
  #
  # 🔴 **step ではなく job にした**(#695)。step だった頃は、`heavy` が timeout で
  #   切られた晩に **job ごと cancelled** になって `if: ${{ !cancelled() }}` が偽 =
  #   **skip** ── **いちばん記録が要る晩に、何も書かなかった**。
  # 🔑 `if: always()` は cancel の回でも走り、`needs.<job>.result` は timeout で
  #   切られた job を `cancelled` として持つ。
  # 🔴 **検証 job を足したら `needs` にも足す** ── 足し忘れた job の赤は
  #   **永久に台帳へ出ない**(step 版の「台帳は最後に置く」と同じ罠)。
  #   `tests/workflow-steps.test.ts` が「ledger 以外の全 job が needs に在る」を pin する。
  # 🔴 **判定は workflow に書かない**(2026-08-17 のレビュー 🔴-1)── 何を赤と
  #   数えるかは `scripts/nightly-red.mjs` の `unmetSteps` に置き、test が全経路を通す。
  #   かつてここに `node -e '…outcome==="failure"…'` と書いていたので、
  #   **`skipped` を緑と読む**うえ、その 1 行は**どの test からも実行されなかった**。
  ledger:
    needs: [smoke_headless_shell, smoke_chromium, product, rust_and_probes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        id: checkout
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
      - name: 夜の結果を台帳へ出す(赤なら issue、緑に戻ったら閉じる)
        id: ledger
        env:
          # `needs` の各 job は `result`(success / failure / cancelled / skipped)を
          # 持つ。⚠ **`cancelled` が要る** ── job の timeout はこの値で来る。
          PKC3_NIGHTLY_STEPS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        # ⚠ **`| tee` に通さない**(CLAUDE.md §6)── パイプの終了コードは最後の命令の
        #   ものなので、script が例外で死んでも step が緑になる(通知が届かないのが
        #   直したい症状なのだから、ここを食べさせてはいけない)。file に落として読む。
        run: |
          node scripts/nightly-red.mjs > /tmp/ledger.log 2>&1; code=$?
          cat /tmp/ledger.log
          {
            echo "### 夜の検査"
            echo ""
            echo '```'
            cat /tmp/ledger.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
