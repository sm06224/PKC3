# 🔴 LibreOffice を **Qt6 + WebAssembly** で焼く(#88。user 指示 2026-08-09
# 「qt6 のブラウザ版を先取りする方針で閲覧優先で実装 / 可能なら独自ビルドしてしまえ」)。
#
# ⚠ **PR gate には絶対に載せない**(プロセス指示「CI を長くしない」)。`workflow_dispatch` のみ。
#
# 🔑 **なぜ CI で焼くのか**: 開発コンテナからは `dev-www.libreoffice.org` へ到達できず
# (egress ポリシー、2026-08-09 実測: CONNECT が 403)、LibreOffice が要求する外部
# tarball 約 100 件を取得できない。**コンテナ側の詰まりはそこだけ**で、その手前 ──
# emsdk / Qt6 host / Qt6 wasm / LibreOffice の configure ── は**全部通っている**。
#
# ⚠ **この workflow はまだ通し切っていない**(コンテナではコンパイル段に到達できないため)。
#   手前の各段は手で通した実績があるが、`make` 以降は**未検証**である。
#
# 🔴 **残る最大の未知はリンク時のメモリ**。`static/README.wasm.md` が
#   「This way the LO WASM possibly needs 64GB RAM」と書いている。GitHub の標準 runner は
#   16GB なので、落ちたら (a) 同 README の回避策(`-s WASM_BIGINT=1` / `ASSERTIONS=1` /
#   `-g3` で WASM の書き直しを避ける)を当てる (b) larger runner へ移す、の順で試す。
name: office-wasm-build

on:
  workflow_dispatch:
    inputs:
      qt_ref:
        # 🔴 **6.9 でなければならない**(2026-08-10、run 31353996894 の実測で確定)。
        #    LO は `-sJSPI_EXPORTS` と `EXPORTED_FUNCTIONS` で **Qt の embind シンボル**
        #    `…MethodInvoker…qstdweb::EventListener…invoke…` を名指しする
        #    (`desktop/CustomTarget_soffice_bin-emscripten-exports.mk:25` /
        #    `EMSCRIPTEN_INTEL_GCC.mk:36`)。このシンボルを生む
        #    `class_<EventListener>("QtEventListener").function("handleEvent", …)` は
        #    **Qt 6.9 の `qstdweb.cpp:754-758` にしか無い** ── 6.10 で
        #    `QWasmSuspendResumeControl` へ置き換えられて消えた(6.9/6.10/6.11/6.12 を
        #    実際に fetch して数えた: 6.9 のみ 7 箇所、他は 0)。
        #    6.11 で建てると `wasm-ld: symbol exported via --export not found` で落ちる。
        #
        # 🔑 **6.9 は上下から挟まれて一意に決まる**(2026-08-10、下限を追加で確認):
        #    上限 ≤ 6.9 ── `qstdweb::EventListener` の embind 登録が 6.10 で消えた(上記)
        #    下限 ≥ 6.9 ── `-feature-wasm-jspi` が **Qt 6.9 で新設**された
        #      (`configure.cmake` の `qt_feature("wasm-jspi"` は 6.8 に **0 件**、6.9 に 1 件。
        #       両ブランチを fetch して実測)。LO の Qt6 モードは JSPI を要求するので、
        #       6.8 以下では**そもそも建てられない**。
        #    ⚠ つまり **6.9 以外に選択肢が無い**。上げ下げする前にこの 2 つを確かめること。
        description: 'qtbase の ref(⚠ LO の JSPI export が要求するため 6.9 固定)'
        default: '6.9'
      emsdk:
        description: 'emsdk の版(LibreOffice の README.wasm.md が指定する版に合わせる)。⚠ promise_await の門(#1344)の錨は 4.0.10 の字 ── 上げたら錨も更新'
        default: '4.0.10'
      lo_ref:
        # 🔴 **既定は安定メジャーの枝**(2026-09-12 に `master` から変えた)。
        #    ⚠ 直す前の既定は `master` = **未リリースの 27.2 alpha** だった ──
        #    user 裁定 2026-08-29 で**配るのは 26.8** と決まり #511 を閉じたのに、
        #    既定はそのまま残っていた。つまり**何も渡さずに焼くと alpha へ静かに逆戻り**し、
        #    その一式が `lo-wasm-dev`(tag 使い回し)を上書きするので、
        #    office-pack を回した日に **user が alpha を受け取る**形だった。
        #    🔑 2026-08-30 の 2 本は実際にこの既定で焼かれている(配られてはいない)。
        # ⚠ **建てるたびに別物**になるので、解決した SHA を必ず出力し
        #    release notes にも書く ── 再現したいときはここへ渡す(#117)。
        # 🔑 alpha を測りたいときは `master` と**明示して**渡す(既定に戻さない)。
        description: 'LibreOffice core の ref(既定 = 安定メジャーの枝。alpha を測るときは master と明示する)'
        default: 'libreoffice-26-8'
      safe_heap:
        # 🔴 **調査用**(#134)。`-sSAFE_HEAP=1` を足して焼く ── 範囲外アクセスが
        #    起きた瞬間に**どのポインタか**が出る。⚠ 実行が数倍遅くなるので配布向きでない。
        #    🔑 **配布 tag を汚さない仕掛けは下の `tag=` に在る**(入力ではなく導出)。
        description: '調査用: SAFE_HEAP を有効にする(遅い。別 tag へ出る)'
        type: boolean
        default: false
      profiling_funcs:
        # 🔴 **調査用**(#134)。`--profiling-funcs` で wasm に **name section** を残す。
        #    ⚠ SAFE_HEAP とは目的が違う ── あちらは load/store の検査、こちらは
        #    **スタックに関数名を出す**ためのもの。手元で #134 を再現できたのに、
        #    出荷 wasm には名前が無いので **10 段のスタックが全部ただの整数**だった。
        #    🔑 実行は遅くならない(増えるのは配る量だけ = 気にしない側)。
        description: '調査用: wasm に関数名を残す(スタックが読める。別 tag へ出る)'
        type: boolean
        default: false
      ime_trace:
        # 🔴 **調査用**(#156 段③)。LO 側の IME の配管に計装を当てて焼く ──
        #    `Window::ImplNewInputContext()` と `QtFrame::SetInputContext()` の
        #    **どこで途切れるか**を 1 行ずつ出す(`build/office-wasm/patch-lo-ime-trace.py`)。
        #    ⚠ 段② の実測は `accept0` まで来たが、それは「LO が立てていない」とも
        #    「立てたが Qt が取り直さない」とも読める ── **直す場所が正反対**なので、
        #    当てずっぽうで直しを焼く前にここで確定させる。
        #    🔑 出口は libc だけ(stderr + `/tmp/pkc3-ime.log`)── LO の文脈から
        #    embind / DOM を触ると `invalid handle` で abort する(2026-08-16 に実証)。
        description: '調査用: IME の配管に計装を当てる(#156。別 tag へ出る)'
        type: boolean
        default: false
      save_trace:
        # 🔴 **調査用**(#225)。保存の配管に計装を当てて焼く ──
        #    非 ODF(alien)の保存が **書き出しフィルタの中**で落ちているのか、
        #    **行き先へ移す段**で落ちているのかを割る(`build/office-wasm/patch-lo-save-trace.py`)。
        #    ⚠ ここまでに分かっているのは「ODF 3/3 が通り、非 ODF 5/5 が落ちる」
        #    (3 モジュールとも)まで。⚠ `SAL_WARN` は焼かれておらず、`--convert-to` は
        #    対照群ごと動かず、`/tmp` の走査も答えにならなかった ── **既存の口が全部死んでいる**。
        #    🔑 出口は libc だけ(stderr + `/tmp/pkc3-save.log`)── LO の文脈から
        #    embind / DOM を触ると `invalid handle` で abort する(2026-08-16 に実証)。
        description: '調査用: 保存の配管に計装を当てる(#225。別 tag へ出る)'
        type: boolean
        default: false
      idles_trace:
        # 🔴 **調査用**(#199)。`Scheduler::IdlesLockGuard` の待ちが**なぜ返らないか**を測る
        #    (`build/office-wasm/patch-lo-idles-trace.py`)。
        #    ⚠ ここは 1 度「直し」を焼いて **no-op だった**場所である ──
        #    `IsUseSystemEventLoop()` が真だと決めつけたが、JSPI を有効にしている
        #    こちらの焼きでは **false** で、guard が常に真だった。
        #    🔑 だから今度は**前提そのものを log に出す**(a=IsUseSystemEventLoop)。
        description: '調査用: idle 錠の待ちに計装を当てる(#199。別 tag へ出る)'
        type: boolean
        default: false
      scheduler_trace:
        # 🔴 **調査用**(#117)。`Scheduler::CallbackTaskScheduling()` の中で
        #    `null function or function signature mismatch` が出る理由を**数で言う**
        #    (`build/office-wasm/patch-lo-scheduler-trace.py`)。
        #    ⚠ 文書を閉じる(Ctrl+W)と 6 回中 6 回、この関数の中の vtable 経由の呼び出しで落ちる。
        #    仮説は 2 つ ── A: 破棄後の `ImplSchedulerData::mpTask` が残っている /
        #    B: `Invoke()` の中で JSPI が中断し、Qt の timer が再入する。
        #    🔑 **直しは入れない**(計装だけ)。出口は libc だけ(stderr + `/tmp/pkc3-sched.log`)。
        description: '調査用: scheduler の再入・破棄後参照に計装を当てる(#117。別 tag へ出る)'
        type: boolean
        default: false
      clip_trace:
        # 🔴 **調査用**(#121)。Office の窓の `Ctrl+C` / 右クリックの「コピー」が、どの層で外へ届かなく
        #    なるかを**数で言う**(`build/office-wasm/patch-lo-clip-trace.py`)。
        #    ⚠ 画像の `Ctrl+C` は host へ `x-openoffice-svxb` の 1 つだけが渡り、右クリックの
        #    「コピー」は host への依頼が 0 件だった。メニュー経由で `QtClipboard::setContents` が
        #    呼ばれるか / Qt が何の型で中身を求めるか、を印で言う。
        #    🔑 **直しは入れない**(計装だけ)。直し(PNG を一覧へ入れる)は
        #    `patch-lo-clipboard-png.py` で、こちらは**既定で当たる**。出口は libc だけ
        #    (stderr + `/tmp/pkc3-clip.log`)。
        description: '調査用: クリップボードの受け渡し(コピー)に計装を当てる(#121。別 tag へ出る)'
        type: boolean
        default: false
      menu_trace:
        # 🔴 **調査用**(#121)。Writer の右クリック popup で「コピー」を選んでも、LO の中で `.uno:Copy` が
        #    実行されない理由を**thread と順番で言う**(`build/office-wasm/patch-lo-menu-trace.py`)。
        #    ⚠ 仮説: `QMenu::exec()` の中で選んでも `triggered` が exec の戻りの**後**に届き、
        #    `PopupMenu::ImplFlushPendingSelect` の時点で Select が積まれていない。
        #    🔑 **直しは入れない**(計装だけ)。出口は libc だけ(stderr + `/tmp/pkc3-menu.log`)。
        description: '調査用: popup メニューの選択が命令になるまでに計装を当てる(#121。別 tag へ出る)'
        type: boolean
        default: false
      uev_trace:
        # 🔴 **調査用**(#121)。popup の「コピー」をマウスで選んだ回だけ、約 10.2 秒後に
        #    `libc++abi: terminating`(型名の無い = JS 例外)が `SalUserEventList::DispatchUserEvents` の
        #    `noexcept` lambda から出る。**どの user event が落ちているか・誰が積んだか**を印で言う
        #    (`build/office-wasm/patch-lo-uev-trace.py`。`post` / `dispatch` / `done` と、積んだ側・処理する側の C stack)。
        #    🔑 **直しは入れない**(計装だけ)。出口は libc + `emscripten_log`(stderr + `/tmp/pkc3-uev.log`)。
        description: '調査用: user event の積んだ側と処理する側に計装を当てる(#121。別 tag へ出る)'
        type: boolean
        default: false

# ⚠ 既定の 6 時間で足りない可能性が高い。足りなければ段を分けて artifact で繋ぐ
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # 🔑 成果物を **prerelease** として出すために要る(下の「手元で回せるようにする」)
    permissions:
      contents: write
    # 🔴 **step ごとに別シェル**なので、configure step で export しても `make` へ届かない。
    #    `make` は config_host.mk が古いと **autogen を再実行する**ので、そこで QT6DIR が
    #    無いと「Qmake not found」で落ちる(2026-08-09 に実際に踏んだ)。job 単位で渡す。
    #    ⚠ `~` は YAML の env では展開されない。絶対パスで書く
    env:
      QT6DIR: /home/runner/qt-wasm/install
      LC_ALL: C.UTF-8
      # 🔴 **マクロ(Basic)を開ける合図**(#431)。`patch-lo-scripting.py` が
      #    configure.ac へ植えた `test "$PKC3_WASM_SCRIPTING" = yes || enable_scripting=no`
      #    を、ここで満たす。⚠ 上流はこの名前を 1 度も読まないので、
      #    **渡さなければ既定(scripting なし)のまま**である。
      # 🔑 **job 単位で渡す理由は QT6DIR と同じ** ── configure step で export しても
      #    `make` へ届かず、`make` は config_host.mk が古いと autogen を再実行するので、
      #    そこで合図が消えると **scripting が黙って落ちる**(気づけるのは焼き上がりの後)。
      PKC3_WASM_SCRIPTING: 'yes'
      # 🔑 **ccache は既に効いている**(run 31307638176 のログに
      #    `/usr/bin/ccache .../em++` が出ている)が、**残していなかった**ので
      #    毎回ゼロから 2h40m 掛かっていた。置き場を固定して cache に載せる。
      #    ⚠ GitHub の cache は **repo 全体で 10GB** が上限(超えると古い順に消える)
      #    ので、Qt(約 1.5GB)と同居できる大きさに抑える
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPRESS: '1'
    steps:
      # ⚠ この workflow は外部リポジトリしか触らないので checkout が無かったが、
      #    パッチを**実ファイル**に出した以上、PKC3 側も取る必要がある
      - uses: actions/checkout@v4

      # runner は / の空きが 14GB 前後しかない。LibreOffice には全く足りないので先に空ける
      - name: ディスクを空ける
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: ビルド道具
        run: |
          set -eux
          sudo apt-get update -qq
          # ⚠ この 6 つは開発コンテナで実際に不足していた(2026-08-09)
          sudo apt-get install -y -qq \
            flex gperf nasm xsltproc ccache libarchive-zip-perl \
            autoconf automake bison zip unzip pkg-config build-essential \
            gettext
          # 🔴 **gettext は日本語 UI に要る**(#158)。⚠ 無いと configure が
          #    `msgfmt not found. Install GNU gettext, or re-run without languages.`
          #    で落ちる ── **翻訳の .po を .mo へ焼くのが msgfmt** である。
          # ⚠ 在ることを確かめる(apt が黙って失敗しても気づけるように)
          msgfmt --version | head -1

      # ── ここから途中成果物の再利用 ────────────────────────────────
      # ⚠ **`cache` ではなく `cache/restore` + `cache/save` を使う** ── 素の `cache`
      #    は job が失敗すると保存しないことがある。**いま欲しいのは「失敗した回の
      #    途中成果物」**(リンクを何度も試す局面)なので、保存を `if: always()` で
      #    明示的に回す。
      - name: emsdk を復元
        id: c_emsdk
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/emsdk
          key: emsdk-${{ inputs.emsdk }}-v1

      # 🔴 **構成フラグを鍵に含める**(2026-08-09)。含めないと、構成を変えたのに
      #    **古い Qt が復元されて同じリンクエラーが再現する**(= 直したのに直らない)。
      #    ⚠ 手で `-v2` に上げる運用は忘れるので、**file の内容から導出**させる。
      - name: Qt6(host / wasm)を復元
        id: c_qt
        uses: actions/cache/restore@v6
        with:
          path: |
            /home/runner/qt-host/install
            /home/runner/qt-wasm/install
          key: qt-${{ inputs.qt_ref }}-emsdk-${{ inputs.emsdk }}-${{ hashFiles('build/office-wasm/qt-wasm-configure.args', 'build/office-wasm/qtbase-patch-*.py') }}

      # 🔴 **LO の ccache は depend mode を切って(`--enable-ccache=nodepend`)、
      #    鍵では Qt の patch を分けない**(2026-10-05、#1344)。
      #    ⚠ 経緯(2026-08-10 の事故): Qt を 6.11 → 6.9 に替えたのに `make` が
      #    `undefined symbol: QObject::doSetProperty(char const*, QVariant const&, QVariant*)`
      #    で落ちた。この**参照版のシグネチャは 6.11 にしか無い**(6.9 はポインタ版のみ。
      #    qobject.h を両方読んで確認)── つまり `QtBuilder.o` が
      #    **6.11 のヘッダでコンパイルされた古い ccache** から出ていた。
      #    原因: LO は **depend mode の ccache**(`config_host.mk` の `CCACHE_DEPEND_MODE=1`
      #    → `gbuild.mk:382` が `CCACHE_DEPEND=1`)で、**同じパスで中身だけ変わった
      #    ヘッダ**(`-isystem` の `$QT6DIR`)を取りこぼす。
      #    そのときは**鍵で名前空間を分けて**しのいだ(Qt の patch の hash を鍵に入れた)。
      #    ⚠ その代償: **`qtbase-patch-*.py` を 1 行触るたびに LO の cache が 1 つも
      #    復元されず、LO が全量 compile になる**(run 37267668276: 復元 1 秒 = 0 件、
      #    LO make 3 時間 37 分)。
      #    🔑 **直しは鍵ではなく原因の側**: depend mode を切った
      #    (distro conf の `--enable-ccache=nodepend`)。direct / preprocessor mode は
      #    **include された header の中身を全部 hash する**ので、鍵で分けなくてよい。
      #    ⚠ **`-nd-` は depend mode 時代の cache を復元しないための接頭**
      #    (その manifest は system header を持っていない可能性がある。#1344 の v1 → v2 で
      #    4 時間 15 分を 2 回払って判明)。**外さない**。
      #    ⚠ Qt 自身の cache(`qt-…`)は別物で、**patch の hash で分けるのが正しい**
      #    (Qt の build 自体が patch で変わる)。
      - name: ccache を復元
        id: c_ccache
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.ccache
          # ⚠ 完全一致は狙わない ── 前回の続きから始められればよいので
          #    `restore-keys` で**同じ Qt 版の**直近のものを拾う
          #    (Qt の patch の hash は入れない ── 上の注釈。direct mode なので不要)
          key: ccache-lo-qt6-nd-${{ inputs.qt_ref }}-${{ github.sha }}
          restore-keys: |
            ccache-lo-qt6-nd-${{ inputs.qt_ref }}-

      - name: emsdk
        if: steps.c_emsdk.outputs.cache-hit != 'true'
        run: |
          set -eux
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install "${{ inputs.emsdk }}"
          ./emsdk activate "${{ inputs.emsdk }}"
          . ./emsdk_env.sh
          emcc --version | head -1

      - name: qtbase を取る
        if: steps.c_qt.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "${{ inputs.qt_ref }}" https://github.com/qt/qtbase.git ~/qtbase

      # 🔴 **Qt をビルドする前に当てる**(#134)。`QWasmInputContext::setFocusObject` が
      #    破棄中の focus 変更で `sendEvent(null, …)` を撃ち、`memory access out of bounds`
      #    で止まる ── 上流 6.10 はこの送信ごと消しているので、それを 6.9 へ移植する。
      # ⚠ **鍵に本パッチを含めてある**(上の `hashFiles`)── 含めないと
      #    **パッチ前の Qt が cache から復元されて、当てたのに効かない**。
      # ⚠ 名前が `patch-*.py` でないのは、下の LO 用ループに巻き込まないため
      #    (あちらは `~/lo-core` を渡す)。
      - name: qtbase に PKC3 のパッチを当てる
        if: steps.c_qt.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          n=0
          for p in "$GITHUB_WORKSPACE"/build/office-wasm/qtbase-patch-*.py; do
            python3 "$p" ~/qtbase
            n=$((n + 1))
          done
          echo "applied $n qtbase patches"
          # ⚠ 下限は実数で置く(足したらここも直す ── 直さないと落ちるので忘れない)
          # 🔴 2 → 3(2026-08-28)。`qtbase-patch-backspace.py`(#433 の**直し**)。
          #    user が実機の console を採ってくれたので、二重配送が**確定した**:
          #      Key callback "Backspace" 9 → processKey as KeyEvent
          #        → processKeyForInputContext          ← ① LO へ 1 回目
          #      inputCallback inputType : "deleteContentBackward"
          #                                             ← ② LO へ 2 回目
          #    🔑 `input` が飛んでいる = ①が `preventDefault()` を呼んでいない
          #    (= `processKeyForInputContext` が false)。それでも①は既に
          #    `handleKeyEvent` を撃っているので、②の合成と合わせて **2 文字**消える。
          #    ⚠ 直しは「②を消す」でも「①を早期 return させる」でもない ── どちらも
          #    退行する(同じログの 2 打鍵目に `inputCallback` が無い = 隠し input が
          #    空の回が在る)。**①が届けた回だけ②を黙らせる**形にしてある。
          # ⚠ **Qt の cache 鍵は `qtbase-patch-*.py` の hash** なので、この 1 本を
          #    足した時点で **Qt を host + wasm から焼き直す**(数時間)。
          # 🔴 3 → 4(2026-10-05)。`qtbase-patch-asyncify-nested.py`(#1344 の直し)。
          #    JSPI の入れ子 suspend で、resume を予約していた外側の frame の起こしが
          #    `qtSuspendId` の照合で捨てられ、外側の `processEvents` が二度と戻らない ──
          #    resolver の 1 枠・`g_is_asyncify_suspended` の 1 bit を、suspend の stack・
          #    深さの数へ替え、**LIFO で起こす**(v2。C の shadow stack は JSPI でも 1 本なので、
          #    外側を内側より先に起こすと内側の frame を踏む)。`qeventdispatcher_wasm.cpp` だけを触る。
          #    ⚠ 3 → 4 でも Qt の cache 鍵が変わるので Qt を焼き直す(数時間)。
          # 🔴 4 → 5(2026-10-07)。`qtbase-patch-ecmastring-threadsafe.py`(#1394 の直し)。
          #    外から貼った後の Ctrl+C で窓が止まる(`invalid handle`)── `qcore_wasm.cpp` の
          #    `fromEcmaString` / `toEcmaString` が持つ**関数内 static の `emscripten::val`** は、
          #    emval の handle が作ったスレッドでしか有効でないのに main(copy event)と
          #    pthread(LO のコピー)の両方から呼ばれる。static をやめて毎回 `module_property` を取る。
          #    ⚠ 4 → 5 でも Qt の cache 鍵が変わるので Qt を焼き直す(数時間)。
          # 🔴 5 → 6(2026-10-07)。`qtbase-patch-wake-async.py`(#1408 の直し)。
          #    main が SolarMutex を futex の busy-wait で待つ間に、持ち主(別スレッド)が
          #    `wakeEventDispatcherThread()` の同期 proxy(`runOnMainThread` = main の mailbox 待ち)へ入ると
          #    双方が永久に待つ。別スレッドからは `runOnMainThreadAsync` にする(Qt 6.10 も別スレッドからの起こしは非同期。
          #    main からも非同期だが、ここでは main は従来どおり同期のまま)。
          #    ⚠ 「数時間」は古い ── 実測は host 13m49s + wasm 10m44s = 約 24.5 分(run 37586026030)。
          #    ⚠ 5 → 6 でも Qt の cache 鍵が変わるので Qt を焼き直す(上の実測のとおり約 25 分)。
          test "$n" -eq 6

      # 🔑 Qt6 は **host build が別に要る**(Qt5 には無かった要件)。
      # ⚠ `-no-gui` で建ててはいけない ── wasm 側で Gui/Widgets を建てるとき、host の
      #    `Qt6GuiTools` / `Qt6WidgetsTools` を参照するので、host にも同じモジュールが要る。
      # ⚠ `-xcb` を強制しない ── xcb の dev が揃っていないと condition 違反で落ちる。
      #    host は道具とモジュールを配るだけで、画面を出す必要は無い。
      - name: Qt6 host ビルド
        if: steps.c_qt.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p ~/qt-host && cd ~/qt-host
          ~/qtbase/configure -prefix ~/qt-host/install -release \
            -nomake examples -nomake tests -no-dbus -no-icu -no-opengl
          cmake --build . --parallel "$(nproc)"
          cmake --install .
          ls ~/qt-host/install/libexec/moc

      # 🔑 構成フラグは **build/office-wasm/qt-wasm-configure.args** に在る(理由もそこ)。
      #    ここに直書きしないのは、**キャッシュ鍵をその file から導出している**ため ──
      #    フラグと鍵が 1 か所で連動し、「構成を変えたのに古い Qt が戻る」事故が起きない。
      # ⚠ emsdk の版ズレは**警告止まり**(Qt 6.10/6.11 推奨 4.0.7 / こちら 4.0.10)。実測済み。
      - name: Qt6 wasm ビルド
        if: steps.c_qt.outputs.cache-hit != 'true'
        run: |
          set -eux
          . ~/emsdk/emsdk_env.sh
          mkdir -p ~/qt-wasm && cd ~/qt-wasm
          # コメントを落として**語で**分割する。
          # ⚠ 行で分割してはいけない ── `-nomake examples` が**空白込みの 1 引数**になり、
          #    configure が受け取れない(手元で引数境界を印字して確認した)
          # shellcheck disable=SC2207
          QTARGS=( $(sed -e 's/#.*//' "$GITHUB_WORKSPACE/build/office-wasm/qt-wasm-configure.args") )
          # ⚠ **当たったことを確かめる**(空振りを合格と読まない)── 読めていないのに
          #    「既定で建った」を成功と読むと、また 3 時間かけて同じエラーに戻る
          printf '[%s]\n' "${QTARGS[@]}"
          test "${#QTARGS[@]}" -ge 8
          printf '%s\n' "${QTARGS[@]}" | grep -qx -- -feature-wasm-exceptions
          printf '%s\n' "${QTARGS[@]}" | grep -qx -- -feature-wasm-jspi
          ~/qtbase/configure -qt-host-path ~/qt-host/install -platform wasm-emscripten \
            -prefix ~/qt-wasm/install -release "${QTARGS[@]}"
          cmake --build . --parallel "$(nproc)"
          cmake --install .
          # LibreOffice の configure.ac:14296 が探す 2 つの実体
          test -f ~/qt-wasm/install/plugins/platforms/libqwasm.a
          test -f ~/qt-wasm/install/plugins/platforms/wasm_shell.html
          # 🔴 **例外モデルが LO と一致したことを、建った実物で確かめる。**
          #    ⚠ 「configure に渡した」ではなく「**生成物がそう建っている**」を見る。
          #    ⚠ 当て先を 1 度間違えた ── `QT_WASM_EXCEPTIONS` は install のどこにも
          #    現れない(**正しく建っても落ちる検査**だった)。実物に在る印はこれ:
          #    無効なら `-1`、有効なら `1`(手元の install で `-1` を実見して確認)
          grep -qx '#define QT_FEATURE_wasm_exceptions 1' \
            ~/qt-wasm/install/include/QtCore/qconfig.h
          grep -qx '#define QT_FEATURE_wasm_jspi 1' \
            ~/qt-wasm/install/include/QtCore/qconfig.h

      - name: Qt6 を保存
        if: always() && steps.c_qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /home/runner/qt-host/install
            /home/runner/qt-wasm/install
          key: qt-${{ inputs.qt_ref }}-emsdk-${{ inputs.emsdk }}-${{ hashFiles('build/office-wasm/qt-wasm-configure.args', 'build/office-wasm/qtbase-patch-*.py') }}

      - name: emsdk を保存
        if: always() && steps.c_emsdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /home/runner/emsdk
          key: emsdk-${{ inputs.emsdk }}-v1

      # 🔴 **moc / rcc / uic は host の道具**なので cross build の install には入らない。
      #    LibreOffice の configure は `$QT6DIR/libexec` と `$QT6DIR/bin` しか見ないので、
      #    ここで繋がないと「Qt Meta Object Compiler not found」で落ちる(実際に踏んだ)。
      - name: host の道具を wasm install から見えるようにする
        run: |
          set -eux
          mkdir -p ~/qt-wasm/install/libexec
          for t in moc rcc uic qlalr cmake_automoc_parser; do
            [ -f ~/qt-host/install/libexec/$t ] && ln -sf ~/qt-host/install/libexec/$t ~/qt-wasm/install/libexec/$t
          done
          ~/qt-wasm/install/libexec/moc -v

      # 🔴 **どの版を建てたのかを残す**(#117 で困った)。`--depth 1` の master は
      #    **建てるたびに別物**なので、「直った / 壊れた」を比べられない。
      #    ⚠ 既定は **安定メジャーの枝**(2026-09-12 に `master` から変えた。上の入力を見よ)。
      #    **解決した SHA を必ず出力し、成果物にも同梱する** ──
      #    再現したいときは `lo_ref` にその SHA を渡せば同じ版が建つ。
      #    🔴 **頼んだ枝の名前も残す**(2026-09-14)── SHA だけだと
      #    「その SHA は 26.8 の枝か」を後から言えない(#431 で上流を clone して
      #    `git merge-base --is-ancestor` を打つ羽目になった)。
      - name: LibreOffice を取る
        run: |
          set -euxo pipefail
          ref='${{ github.event.inputs.lo_ref }}'
          # 🔴 **渡されなかったときの落ち先を alpha にしない**(2026-09-14)。
          #    ⚠ 上の入力の既定は 2026-09-12 に `libreoffice-26-8` へ直したのに、
          #    **この行だけ `master` のまま**だった ── 同じ問いに答える口が 2 つ在り、
          #    片方しか直していない形である(CLAUDE.md §7)。
          #    🔑 2 つが揃っていることは `tests/workflow-steps.test.ts` が見る。
          ref="${ref:-libreoffice-26-8}"
          git clone --depth 1 --branch "$ref" https://github.com/LibreOffice/core.git ~/lo-core \
            || git clone https://github.com/LibreOffice/core.git ~/lo-core
          cd ~/lo-core
          if [ "$ref" != master ]; then git checkout -q "$ref"; fi
          sha=$(git rev-parse HEAD)
          echo "LO_SHA=$sha" >> "$GITHUB_ENV"
          # ⚠ **頼んだ枝の名前**も渡す(成果物の `build-info.json` に載せる)
          echo "LO_REF=$ref" >> "$GITHUB_ENV"
          echo "建てる LibreOffice: $ref ($sha)"
          # 🔴 **翻訳の実体を取る**(#158)。`--with-lang` を渡すと configure は
          #    `translations/` を要求するが、**`git clone` では付いてこない**
          #    (LO は translations / dictionaries / helpcontent2 を submodule で持つ)。
          # ⚠ ここを飛ばすと configure が落ちる ── 実際 1 度落とした。
          # ⚠ **浅く取る**(全履歴は要らない)。取れなければ**そこで落とす** ──
          #    黙って英語だけを配らない(#158 の検品と同じ向き)。
          git submodule update --init --depth 1 translations
          test -d translations/source/ja

      # ⚠ 復元は **clone のあと** ── `git clone` は空でないディレクトリを嫌う
      - name: 外部 tarball を復元
        id: c_tar
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/lo-core/external/tarballs
          key: lo-tarballs-v1

      # 🔴 **上流 Qt6 経路の取りこぼしを当てる**(#88、2026-08-09)。
      # 理由と根拠は build/office-wasm/patch-qt6-freetype.py の docstring に書いてある。
      # ⚠ パッチを**実ファイル**に出しているのは、手元の LibreOffice checkout に当てて
      #    動作を確かめられるからである(当たる / 2 回目は already patched で素通り)。
      #    ⚠ 一度「入れ子ヒアドキュメントが原因で GitHub が解析できない」と**推測して**
      #    ここを書き換えたが、**外れ**だった ── 真因はこの step と復元 step が
      #    **3 組貼り付いていて `id: c_tar` が重複**していたこと。
      #    再発は tests/workflow-steps.test.ts が止める。
      - name: 上流 Qt6 経路の取りこぼしを当てる
        run: |
          set -euxo pipefail
          # ⚠ **file 名指しで書かない** ── パッチを 1 本足したときに、ここへ書き足すのを
          #    忘れると黙って当たらない。全部拾い、**拾った本数を主張する**
          #    (glob が壊れて 0 本になったら落ちる)。
          n=0
          # ⚠ 調査ビルドのときだけ SAFE_HEAP を足す(patch script が両方向で検める)
          # ⚠ `[ … ] && echo 1 || echo 0` と書かない ── shell の `&&`/`||` は同順位・
          #    左結合で、「偽のとき」と「失敗したとき」が同じ枝に落ちる(CLAUDE.md)
          if [ "${{ inputs.safe_heap }}" = "true" ]; then
            export PKC3_SAFE_HEAP=1
          else
            export PKC3_SAFE_HEAP=0
          fi
          if [ "${{ inputs.profiling_funcs }}" = "true" ]; then
            export PKC3_PROFILING_FUNCS=1
          else
            export PKC3_PROFILING_FUNCS=0
          fi
          # ⚠ 既定は 0 ── 配る一式に計装を混ぜない(patch は錨だけ確かめて抜ける)
          if [ "${{ inputs.ime_trace }}" = "true" ]; then
            export PKC3_IME_TRACE=1
          else
            export PKC3_IME_TRACE=0
          fi
          if [ "${{ inputs.save_trace }}" = "true" ]; then
            export PKC3_SAVE_TRACE=1
          else
            export PKC3_SAVE_TRACE=0
          fi
          if [ "${{ inputs.idles_trace }}" = "true" ]; then
            export PKC3_IDLES_TRACE=1
          else
            export PKC3_IDLES_TRACE=0
          fi
          if [ "${{ inputs.scheduler_trace }}" = "true" ]; then
            export PKC3_SCHEDULER_TRACE=1
          else
            export PKC3_SCHEDULER_TRACE=0
          fi
          if [ "${{ inputs.clip_trace }}" = "true" ]; then
            export PKC3_CLIP_TRACE=1
          else
            export PKC3_CLIP_TRACE=0
          fi
          if [ "${{ inputs.menu_trace }}" = "true" ]; then
            export PKC3_MENU_TRACE=1
          else
            export PKC3_MENU_TRACE=0
          fi
          if [ "${{ inputs.uev_trace }}" = "true" ]; then
            export PKC3_UEV_TRACE=1
          else
            export PKC3_UEV_TRACE=0
          fi
          for p in "$GITHUB_WORKSPACE"/build/office-wasm/patch-*.py; do
            python3 "$p" ~/lo-core
            n=$((n + 1))
          done
          echo "applied $n patches"
          # ⚠ **下限は実数で置く**(「2 本以上」だと 1 本落としても気づけない)。
          #    パッチを足したらここも直す ── 直さないと落ちるので忘れない
          # 🔴 8 → 7(2026-08-15)。IME を LO 側から `QInputMethod::show()` で
          #    要求する patch は**文書を開いた瞬間に wasm を abort させた**ので外した
          #    (対照 3 一式で確定。代わりに `qtbase-patch-ime-panel.py` で Qt 側を直す)
          # 🔴 7 → 8(2026-08-23)。`patch-lo-ime-trace.py`(#156 段③ の計装)。
          #    ⚠ **既定では 1 バイトも書き換えない**(`PKC3_IME_TRACE=1` の回だけ)が、
          #    錨の検査は毎回する ── 門の下に隠すと上流の変形に誰も気づけない
          # 🔴 8 → 9(2026-08-24)。`patch-lo-ime-update.py`(#156 の**直し**)。
          #    段③ の計装で (b) が確定した ── LO は `WA_InputMethodEnabled` を
          #    立てているのに Qt が受付可否を取り直さない。直しは LO 側の 1 行
          #    (`QGuiApplication::inputMethod()->update(Qt::ImEnabled)`)で、
          #    ⚠ **こちらは既定で当たる**(計装と違って配る一式にも入る)
          # 🔴 9 → 10(2026-08-24)。`patch-lo-idles-trace.py`(#199 の**計装**)。
          #    名前入りの一式で stack を撮り、画像入り docx が
          #    `GraphicImport` → `SwXShape::dispose()` → `DelLayoutFormat` →
          #    `Scheduler::IdlesLockGuard` の ctor で**永久に待つ**ことは確定した。
          #    ⚠ **ただし機構の説明は外した。** 同じ枠に「直し」を置いて焼いたが
          #    **no-op だった** ── `IsUseSystemEventLoop()` が真だと決めつけたのに、
          #    `--enable-emscripten-jspi` を渡すこちらの焼きでは
          #    `#elif !HAVE_EMSCRIPTEN_JSPI` が効かず **false** だったためである
          #    (run 32712089791 で実測。対照群の `.odt` は開くので読める回)。
          #    🔑 だから直しを取り下げ、**前提そのものを log に出す計装**へ置き換えた。
          #    ⚠ **既定では 1 バイトも書き換えない**
          # 🔴 10 → 11(2026-08-24)。`patch-lo-save-trace.py`(#225 の**計装**)。
          #    ⚠ **既定では 1 バイトも書き換えない**(`PKC3_SAVE_TRACE=1` の回だけ)が、
          #    錨の検査は毎回する ── 門の下に隠すと上流の変形に誰も気づけない
          # 🔴 11 → 12(2026-08-24)。`patch-lo-uifiles.py`(#225 の**直し**)。
          #    非 ODF の保存が落ちていたのは、**「この形式のままにしますか」の
          #    ダイアログの `.ui` が一式に入っていない**ためだった(計装が例外の
          #    message を拾って確定 ── `cui/ui/querydialog.ui`)。
          #    🔴 **1 稿目は「上流に在る」を数え方から間違えてビルドを止めた**
          #    (run 32734107620。`gb_Deliver_deliver: file does not exist in
          #    instdir` で make ごと停止)── `<mod>/uiconfig/**` の**実在**で
          #    数えたが、instdir へ配られるのは `<mod>/UIConfig_*.mk` が
          #    `gb_UIConfig_add_uifiles` で**登録したものだけ**である
          #    (`fileextcheckdialog` は `ifeq ($(OS),WNT)` の中 = Windows 限定)。
          #    🔑 いまは**登録を読む** ── 第 1 引数がそのまま cfg 上の綴りなので、
          #    モジュール名の対応表(推測)も要らない。実測で欠けは **37 件**。
          #    🔑 **件数を焼き込まない** ── patch 自身が毎回登録と突き合わせ、
          #    差分を埋め、**埋め残しがあれば名前を挙げて落ちる**(tripwire)。
          #    ⚠ **こちらも既定で当たる**(配る一式に入る)。
          #    検査は `tests/office-uifiles-patch.test.ts`(実物の木に当てて、
          #    **どれを足しどれを足さなかったか**を名指しで見る)
          # 🔴 12 → 13(2026-08-25)。`patch-lo-idles-deadlock.py`(#199 の**直し**)。
          #    9 巡分の計装で輪が確定した ── メインは proxy した user event の Link の
          #    戻りを待ち、その Link(docx の取込)は `IdlesLockGuard` でメインが
          #    `Application::Execute` へ戻るのを待つ。互いに相手の前進を待っていた。
          #    🔑 直しは 2 つ:①走っているタスクが無ければ待たない
          #    (`mpSchedulerStack == nullptr` ── 欲しい保証は既に成り立っている)
          #    ②待つ場合も 100ms で切る。⚠ **こちらは既定で当たる**(配る一式に入る)。
          #    実測(自作の対照群):画像 20 枚の .docx が **51 秒 → 10 秒**。
          #    ⚠ 計装(`patch-lo-idles-trace.py`)からは**同じ行を外した** ──
          #    2 つの patch が同じ行を触ると、当てる順で錨が壊れる。
          # 🔴 13 → 14(2026-08-28)。`patch-lo-scripting.py`(#431 の**直し**)。
          #    ⚠ #431 は「上流の conf に `--disable-scripting` が在るから」と書いて
          #    いたが、**それは表面だった** ── 外して焼いても
          #    `BUILD_TYPE` に `SCRIPTING` は入らない(run 33136349872 で実測)。
          #    真因は 2 段:`configure.ac:1301` が Emscripten で `enable_wasm_strip=yes`
          #    を無条件に立て、`configure.ac:3485` がその中で
          #    **`enable_scripting=no` を無条件に上書き**する。
          #    🔑 だから option では開かない。上流が読まない名前
          #    (`PKC3_WASM_SCRIPTING`)を条件にして、**渡した回だけ**開ける。
          #    ⚠ **既定は 1 バイトも変わらない**(job の env で渡している)。
          # 🔴 14 → 15(2026-08-30)。`patch-lo-templates.py`(#591 の**直し**)。
          #    ⚠ #591 は PR #601 で `--with-templates=yes` を渡して閉じたつもりだったが、
          #    **届いていなかった** ── `configure.ac:3495` が `enable_wasm_strip` の
          #    ブロックの中で `with_templates=no` を**無条件に上書き**する
          #    (`patch-lo-scripting.py` と同じ 2 段。1301 行が Emscripten で
          #    `enable_wasm_strip=yes` を無条件に立てるので逃げられない)。
          #    🔑 直しは上流自身の書き方へ揃えるだけ ──
          #    `test "${with_templates+set}" = set || with_templates=no`。
