      # 🔴 **Qt と LO の「握手」を、リンクの 16 分前に確かめる**(2026-08-10)。
      #    LO は Qt の embind シンボルを名指しで export する。無いと
      #    `wasm-ld: symbol exported via --export not found` で**最後に**落ちる。
      #    ⚠ **cache から復元した Qt にも効かせたい**ので、Qt ビルド step の中ではなく
      #    独立の step に置く(古い Qt が戻ったときこそ鳴ってほしい)。
      #    ⚠ 名前を**ここに直書きしない** ── LO 側の定義から取り出し、
      #    2 か所が食い違わないようにする(判定は 1 か所へ寄せる)。
      - name: LO が要求する Qt シンボルが在ることを確かめる
        run: |
          set -euo pipefail
          sym=$(grep -o '_ZN10emscripten[A-Za-z0-9_]*' \
            ~/lo-core/solenv/gbuild/platform/EMSCRIPTEN_INTEL_GCC.mk | head -1)
          # 空振り防止 ── LO 側から名前が取れていること
          test -n "$sym"
          echo "LO が要求するシンボル: $sym"

          nm=~/emsdk/upstream/bin/llvm-nm
          # ⚠ 道具が無いのを「シンボルが無い」と読み違えない
          test -x "$nm" || { echo "ERROR: $nm が無い" >&2; exit 1; }

          # ⚠ **archive を file 名指しで探さない**(1 度 libQt6Core.a 決め打ちで書いた)。
          #    LO は $QT6DIR/lib の archive 群を丸ごとリンクするので、全部見る。
          #
          # 🔴 **`nm | grep -q` と書いてはいけない**(2026-08-10 に実測で判明)。
          #    `grep -q` は最初の一致で打ち切るので **nm が SIGPIPE で死に、
          #    `pipefail` がそれを拾って pipeline が失敗する** ── 記号が
          #    **在るときほど失敗する**(実測: 在る記号で exit=74 / pipefail 無しなら 0)。
          #    この形の gate は「常に無い」と言い続ける。**一度ファイルへ落としてから見る。**
          total=0
          found=''
          for a in ~/qt-wasm/install/lib/*.a; do
            "$nm" "$a" > /tmp/nm-out.txt 2>/dev/null || true
            total=$((total + $(wc -l < /tmp/nm-out.txt)))
            if grep -q -- "$sym" /tmp/nm-out.txt; then
              found="$a"
              break
            fi
          done
          # 正の対照 ── 本物の archive 群を読めていること(空 archive に「無い」と言わない)
          echo "走査した記号の総数: $total"
          test "$total" -gt 1000

          if [ -z "$found" ]; then
            echo "ERROR: $QT6DIR/lib のどの archive にも $sym が無い" >&2
            echo '--- 診断: qstdweb 由来の記号がどれだけ在るか ---' >&2
            "$nm" ~/qt-wasm/install/lib/libQt6Core.a > /tmp/nm-core.txt 2>/dev/null || true
            grep -c 'qstdweb' /tmp/nm-core.txt >&2 || true
            grep 'EventListener' /tmp/nm-core.txt >&2 | head -5 || true
            echo '  → qstdweb::EventListener の embind 登録は Qt 6.9 の' >&2
            echo '    qstdweb.cpp:754-758 にしか無い(6.10 で削除)' >&2
            exit 1
          fi
          echo "見つかった: $found"

      # ⚠ 上流の `LibreOfficeWASM32.conf` は `--enable-qt5` を含む。そこへ `--enable-qt6` を
      #    足すだけだと VCL プラグインが 2 個になり、`configure.ac:12691` の
      #    「動的読込が無効なら GUI 付きはプラグイン 1 個」で落ちる。**自前の config を持つ。**
      #
      # 🔴 **JSPI + 非 PROXY_TO_PTHREAD が「Qt6 のモード」である**(2026-08-10 に判明)。
      #    それまで既定(JSPI off / PROXY_TO_PTHREAD on = **Qt5 用の組み合わせ**)で
      #    建てていたため、Qt6 のコードを**書かれていないモードで走らせていた**。
      #    症状: `main()` は動くが `qwasmclipboard.cpp:168` の
      #    `val::global("window")["chrome"]` で落ちる ── **worker に `window` は無い**。
      #    根拠: LO 側の Qt6 対応は
      #    `ENABLE_QT6 && HAVE_EMSCRIPTEN_JSPI && !HAVE_EMSCRIPTEN_PROXY_TO_PTHREAD`
      #    という条件で書かれており(`QtInstance.cxx` に 7 箇所ほか計 8 file)、
      #    このモード専用の並行機構 `comphelper/emscriptenthreading` まで在る。
      #    ⚠ **個別のバグを 1 つずつ潰す前に、組み合わせが正しいかを疑うこと。**
      - name: configure(Qt6)
        run: |
          set -eux
          cd ~/lo-core
          cat > distro-configs/PKC3WASM-Qt6.conf <<'CONF'
          --host=wasm32-local-emscripten
          --disable-qt5
          --enable-qt6
          --disable-gen
          # 🔴 **ccache は depend mode を切る**(#1344、2026-10-05)。⚠ depend mode は
          #    `-isystem` の Qt header の変更を取りこぼす(2026-08-10 の事故)。
          #    nodepend = direct / preprocessor mode で、**header の中身を全部 hash する**
          #    (`configure.ac:2090` / `:3731`)── 鍵で Qt の patch を分けなくてよくなる。
          --enable-ccache=nodepend
          # 🔴 **`--disable-scripting` を外した**(#431 段①。user 指示 2026-08-27
          #    「いまだに動かないマクロ機能なども全部完璧で動かせるように」)。
          #
          # ⚠ これは**上流の既定**だった(`LibreOfficeWASM32.conf` の 4 行目)ので、
          #    外すのは**上流と違う道を行く**ことである。だから ref(master)も
          #    他の option も動かさない ── 変える主張は 1 つだけにする
          #    (CLAUDE.md「1 度の実験が 2 つを主張していた」= #158 で 7 回転溶かした型)。
          #
          # 🔑 配った一式を数えた結果(#431):**登録も実体も 0 件**だった ──
          #    `services.rdb` に `ScriptProviderForBasic` が無く、`soffice.wasm` に
          #    `SbModule` / `SbiRuntime` が無い。⚠ 対話の口(`.ui`)だけ在るので、
          #    **メニューは出るのに動かない**(無言の dead click)。
          #
          # 🔴 **この 1 行だけでは開かない**(2026-08-28 に焼いて判明。
          #    run 33136349872 ── configure は成功したのに `BUILD_TYPE` に
          #    `SCRIPTING` が入らなかった)。上流は `configure.ac:3485` で
          #    **`enable_scripting=no` を無条件に上書き**するので、option では届かない。
          #    🔑 実際に開けているのは `build/office-wasm/patch-lo-scripting.py` +
          #    job の env `PKC3_WASM_SCRIPTING` である。⚠ **それでもこの行は要る** ──
          #    patch は「無条件の上書き」を外すだけなので、conf に
          #    `--disable-scripting` が残っていれば option 側で `no` のままになる。
          #    **2 つ揃って初めて開く。**
          #
          # 🔴 **下の 3 行は「他を変えないため」に足している**(2026-08-28、焼く前に
          #    `configure.ac` を読んで判明)。⚠ `--disable-scripting` は
          #    **Java / .NET / Python を道連れに切っていた**:
          #      - `configure.ac:3836` java  → `DISABLE_SCRIPTING` なら `with_java=no`
          #      - `configure.ac:5937` .NET  → 同上
          #      - `configure.ac:10682` python → 同上(無いと cross では **system python**)
          #    つまり外すだけだと**3 つが既定で有効になり**、wasm には無い物を探しに行く。
          #    🔑 明示して切るのは**変数を増やす**のではなく、**scripting 以外を
          #    これまでどおりに保つ**ためである。
          --without-java
          --without-dotnet
          --disable-python
          --with-package-format=emscripten
          --enable-emscripten-jspi
          --disable-emscripten-proxy-to-pthread
          --with-wasm-module=calc writer impress
          --with-lang=en-US ja
          # 🔴 **テンプレートを建てる**(#591)。⚠ 渡さないと、上流の `configure.ac` が
          #    iOS / Android / **Emscripten** で `WITH_TEMPLATES` を空にするので
          #    (`configure.ac:3634-3639`)、`extras/Package_tplpresnt.mk` は
          #    `else` 側の `gb_Package_add_empty_directory` だけを走らせる ──
          #    🔑 **フォルダは作られて中身が 0 件**になり、Impress の
          #    「Select a Template」が**空の一覧**を出していた。
          #    ⚠ 「上流にテンプレートが無い」ではない(.otp 23 件 / .ott .otg 11 件)。
          # 🔴 **2026-08-30: ここに書いてあったことは誤りだった。**
          #    1 稿目は「`=yes` は `configure.ac:3622` の `WITH_TEMPLATES=TRUE` を
          #    **保つ**枝である(実装を読んで確かめた ── **別の所で弾かれない**)」と
          #    書いていたが、**弾かれる**。run 33279050889 の一式を落として目録を
          #    数えたら **`.otp` 0 件 / `.ott` 0 件**(拡張子 5 種のどれも 1 件も無い)。
          #    真因は `patch-lo-scripting.py`(#431)と**同じ 2 段**である:
          #    `configure.ac:1301` が Emscripten で `enable_wasm_strip=yes` を
          #    無条件に立て、`configure.ac:3495` がその中で
          #    **`with_templates=no` を無条件に上書き**する
          #    (option 解析は 2458 行 ── **後から来るほうが勝つ**)。
          #    🔑 だからこの行は**単独では効かない**。届かせているのは
          #    `patch-lo-templates.py` で、この行はその patch が尊重する**指示**である
          #    ── ⚠ **片方だけ消すと静かに空へ戻る**ので、下の後条件で両方を留める。
          --with-templates=yes
          CONF
          . ~/emsdk/emsdk_env.sh
          # 🔴 **出力を残す**(2026-08-14)。⚠ `make` には `tee` が在るのに
          #    configure には無く、**落ちた回のエラーがジョブの末尾から読めなかった**
          #    ── 「エラー行はジョブの最後に出す」を configure に適用していなかった。
          #    ⚠ `tee` は早期終了しないので SIGPIPE の罠は無い(`pipefail` は立ててある)。
          ./autogen.sh --with-distro=PKC3WASM-Qt6 2>&1 | tee /tmp/configure.log
          # 空振り防止 ── 本当に qt6 単独で構成されたか
          grep -q '^export ENABLE_QT6=TRUE' config_host.mk
          grep -q '^export ENABLE_QT5=$' config_host.mk
          grep -q '^export VCL_PLUGIN_INFO= qt6$' config_host.mk
          # 🔴 **テンプレートの指示が届いたか、ここで見る**(#591、2026-08-30)。
          #    ⚠ 1 稿目は「渡したから入っているはず」で 2 時間の make を回し、
          #    **焼き上がってから目録が 0 件**と分かった(run 33279050889)。
          #    🔑 `WITH_TEMPLATES` は `config_host.mk.in:794` に在るので、
          #    **configure の直後(27 分)に読める** ── 落ちるなら早く落とす。
          #    ⚠ これは `--with-templates=yes`(上)と `patch-lo-templates.py` の
          #    **両方**が生きていないと真にならない = 片方を消せばここで鳴る。
          grep -q '^export WITH_TEMPLATES=TRUE$' config_host.mk
          # 🔴 **日本語 UI を建てる**(#158)。⚠ 渡すまで **`--with-lang` は 1 件も無く、
          #    en-US だけを建てていた** ── 日本語フォントは入れてあるので
          #    「描画は日本語・UI は英語」という食い違いになっていた(user が実機で発見)。
          # ⚠ 「渡した」ではなく **構成に入った**ことを見る(#145 と同じ空振り防止)。
          #    値に空白が入るが、autogen.sh は行をそのまま 1 引数にする
          #    (`--with-wasm-module=calc writer impress` で通っている前例)。
          # 🔴 **2026-08-14: ここに書いてあったことは 3 つとも誤りだった**(上流の実物を
          #    落として確定 ── `LibreOffice/core@4a810c46` を checkout して全数 grep)。
          #    ① `ENABLE_WASM_STRIP_LOCALES` は **死に変数**。上流全体で一致するのは
          #       `config_host.mk.in:265` の 1 行だけで、**makefile も C++ も誰も読まない**
          #       (`config_wasm_strip.h.in` にも無い)。剥がしの実体ではなかった。
          #    ② `--disable-wasm-strip` は **Emscripten では効かない**。
          #       `configure.ac:1301` が host case で `enable_wasm_strip=yes` を
          #       **無条件に上書き**する(option 解析はその前に終わっている)。
          #       ⚠ 当時「WRITER / CALC / CANVAS が空になったから効いた」と読んだが、
          #       あれは `--with-wasm-module`(#145)と、`config_host.mk.in` の
          #       **右辺が空リテラル**の行(CHART / HUNSPELL / RECENT)によるものだった。
          #       ⚠ 仮に本当に無効化できたら `configure.ac:3457-3505` が発火せず
          #       `enable_dynamic_loading` まで戻るので、**wasm はリンクしない**。
          #    ③ `WITH_LANG` が出ないのではなく、**出る file が違う** ──
          #       `config_host_lang.mk`(`config_host.mk.in:831` が include する)。
          #       ⚠ `export` が付かないのは意図的(shell で source する file ではない)
          #       ので、`grep '^export WITH_LANG'` は**永久に一致しない**。
          #
          # 🔴 **未確認のものは assert にせず、診断で出す**(この節で 3 回続けて踏んだ)。
          #    `WITH_LANG=en-US ja` になる「はず」だが**まだ 1 度も見ていない**ので、
          #    ここでは**印字するだけ**にする。通ったのを見てから後条件へ昇格させる。
          #    🔑 本当に守りたい後条件は下の「配る物に `/ja/` が在るか」であって、
          #    構成の途中経過ではない。
          echo '--- config_host_lang.mk(WITH_LANG の実体はこちら)---'
          if [ -f config_host_lang.mk ]; then
            cat config_host_lang.mk
          else
            echo '(config_host_lang.mk が無い ── AC_CONFIG_FILES を確かめる)'
          fi
          # 🔴 **Impress(と Draw / Math / Basic)が落とされていないことを確かめる**(#145)。
          #    上流 configure.ac の `--with-wasm-module` 既定は **'calc writer'** なので、
          #    渡さないと Impress は**一式に 1 file も入らない**(実測: simpress 0 / sdraw 0)。
          #    ⚠ 値に空白が入るが、autogen.sh は**行をそのまま 1 引数**にし
          #    `system(@args)` で渡すので保たれる(上流にも `--with-vendor=The Document
          #    Foundation` の前例が在る)。⚠ それでも**渡ったかは自明でない**ので、
          #    「空になったか」を config_host.mk で直接見る ── 落ちるべきときに落ちる形。
          grep -q '^export ENABLE_WASM_STRIP_BASIC_DRAW_MATH_IMPRESS=$' config_host.mk
          grep -q '^export ENABLE_WASM_STRIP_WRITER=$' config_host.mk
          grep -q '^export ENABLE_WASM_STRIP_CALC=$' config_host.mk
          # 🔴 **Qt6 のモードが立っていることを確かめる**(下のコメント参照)。
          #    ⚠ 既定のままだと Qt5 用の組み合わせで建ち、走らせるまで気づけない
          grep -q '^export ENABLE_EMSCRIPTEN_JSPI=TRUE' config_host.mk
          grep -q '^export ENABLE_EMSCRIPTEN_PROXY_TO_PTHREAD=$' config_host.mk
          # 🔴 **マクロ(Basic)が構成に入ったことを確かめる**(#431 段①、2026-08-28)。
          #
          # ⚠ 見るのは `DISABLE_SCRIPTING` **ではない** ── その名前は
          #    `config_host.mk.in` に **1 行も無い**(実物を引いて確かめた。
          #    configure は `SCPDEFS` と `BUILD_TYPE` にしか書かない)。
          #    🔑 実体は **`BUILD_TYPE` に `SCRIPTING` が入ること**である
          #    (`configure.ac:3540-3542`)。
          #    ⚠ 在らない変数を grep すると「常に一致しない」検査になる(#158 の
          #    `WITH_LANG` と同じ型)ので、**在る変数だけを見る**。
          # 🔴 **落ちる前に、突き合わせる相手を印字する**(2026-08-28)。
          #    ⚠ 前の回(run 33136349872)はこの grep だけが `exit 1` を返し、
          #    **何と食い違ったのか 1 行も読めなかった** ── configure は成功していた
          #    ので「ビルドが壊れた」にしか見えない。CLAUDE.md §6「失敗した事実を
          #    食べない」の逆側:**落とすのはよいが、落ちた理由を残す**。
          echo '--- BUILD_TYPE / scripting の実体 ---'
          grep -E '^export BUILD_TYPE=' config_host.mk || echo '(BUILD_TYPE が無い)'
          grep -E '^export (DISABLE_SCRIPTING|ENABLE_JAVA|DISABLE_PYTHON)=' config_host.mk \
            || echo '(scripting 系の変数が 1 つも無い)'
          grep -qE '^export BUILD_TYPE=.*\bSCRIPTING\b' config_host.mk
          # 🔴 **道連れの 3 つが、これまでどおり切れていること**(変数を増やさない)。
          #    ⚠ ここが立つと wasm に無い物を探しに行く ── 落ちるべき所で落とす。
          grep -q '^export ENABLE_JAVA=$' config_host.mk
          grep -q '^export DISABLE_PYTHON=TRUE' config_host.mk
          grep -q '^ENABLE_DOTNET=$' config_host.mk

      # 🔴 **emsdk の `proxying.c` の順序を直す**(#1408)。emscripten 4.0.10 の `emscripten_proxy_finish` は
      #    `pthread_mutex_unlock` の**後**に `pthread_cond_signal` する ── 待つ側が先に起きて stack 上の ctx を
      #    捨て、完了側が捨てた condvar を signal しに行って固まる(5.0.5 の #26582 で修正済み。起動中の固まり y4-IDm-14)。
      #    🔑 当てる先は **emsdk(cache から復元した物)** ── 毎回当てる(patch は冪等で、当たっていれば SKIP)。
      #    ⚠ 名前が `patch-*.py` / `qtbase-patch-*.py` の glob に当たらない(`emsdk-patch-proxying.py`)のは、
      #       どちらのループにも巻き込まず、qtbase patch の本数の pin(上)を動かさないため。
      #    🔴 **libc の archive は cache の物を消す**: `proxying.c` は libc(`libc-mt*.a` と、その子 class の `libc_optz-mt*.a`。
      #       `libc++-mt` / `libc++abi-mt` / `libcompiler_rt-mt` には入っていないので消さない)に入っており、
      #       emscripten は `cache/sysroot/lib/wasm32-emscripten/` に**出来上がった .a があれば作り直さない**。
      #       消せば**最終 link(下の make)が file の無い物を build する**(emscripten の cache の作法)。
      #    🔑 この step は消した物と残った物を `ls -l` で出すだけ。make の後の step
      #       「libc が patch の後に作り直されたことを確かめる」が、作り直されたかを主張する(落とす)。
      - name: emsdk の proxying.c の順序を直す(#1408)
        run: |
          set -euxo pipefail
          python3 "$GITHUB_WORKSPACE"/build/office-wasm/emsdk-patch-proxying.py ~/emsdk/upstream/emscripten
          touch ~/.pkc3-proxying-patched
          libdir=~/emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten
          echo '--- 消す前の libc-mt*.a / libc_optz-mt*.a ---'
          ls -l "$libdir"/libc-mt*.a "$libdir"/libc_optz-mt*.a || echo '(無い ── 最終 link が初めて作る)'
          rm -fv "$libdir"/libc-mt*.a "$libdir"/libc_optz-mt*.a
          echo '--- 消した後 ---'
          ls -l "$libdir"/libc-mt*.a "$libdir"/libc_optz-mt*.a || echo '(無い ── 最終 link が作り直す)'

      # 🔴 **`| tail` を噛ませない**(2026-08-09 に踏んだ)。bash のパイプの終了コードは
      #    最後のコマンドのものなので、`make | tail` は **make が落ちても step が緑**になる。
      #    CLAUDE.md の「検品が ✗ を出したのに job は green」と同じ型。
      #    `pipefail` を立てたうえで、そもそもパイプしない。
      - name: make
        run: |
          set -euxo pipefail
          cd ~/lo-core
          . ~/emsdk/emsdk_env.sh
          ccache -z   # 統計をゼロに(この run 分だけを測る)
          # `-v` の最大常駐(Maximum resident set size)がリンクのメモリ実測値になる
          # ⚠ **`tee` は早期終了しない**ので SIGPIPE の罠は無い。`pipefail` を立てて
          #    あるので make の失敗はそのまま pipeline の失敗になる(`| tail` とは違う)。
          #    控えを残すのは、**API 経由のログが 16KB で切れてエラー行に届かない**ため。
          /usr/bin/time -v make -j"$(nproc)" 2>&1 | tee /tmp/make.log


      # 📏 **効いたかを数で出す**(印象で語らない)。hit 率が低いままなら
      #    cache が実は当たっていないということ
      - name: ccache の効き
        if: always()
        run: ccache -s

      # 📏 **libc の `-mt` archive が patch の後に作り直されたことを主張する**(#1408)。
      #    patch(`~/.pkc3-proxying-patched` の mtime)より新しければ、直した `proxying.c` で作り直された。
      # 🔴 3 つ全部が真でなければ赤: ① stamp が在る(patch step が走った)② 当てた `proxying.c` に印
      #    (`PKC3-PROXYFINISH`)が 1 行以上在る ③ `libc-mt*.a` / `libc_optz-mt*.a` に **patch より古い物が無く**、
      #    **新しい物が 1 つ以上**在る。
      #    ⚠ どの変種(`libc-mt.a` / `libc-mt-debug.a` / `libc_optz-mt.a` …)が link に使われるかは焼くまで分からないので、
      #       名指しせず「古い物が 1 つも残らない + 作り直された物が在る」で見る(古い物が残れば、直す前の libc が link されうる)。
      #    🔑 2 回の焼き(run 37695070751 / 37703782078)で step は走り、固まり(startup hang 形 A)は 0/150 になっていたので、
      #       診断から昇格した(2026-10-08。CLAUDE.md §1「通ったのを見てから昇格」)。印字は落ちたときに読むために残す。
      - name: libc が patch の後に作り直されたことを確かめる(#1408)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          stamp=~/.pkc3-proxying-patched
          src=~/emsdk/upstream/emscripten/system/lib/pthread/proxying.c
          libdir=~/emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten
          bad=0
          if [ -f "$stamp" ]; then
            ls -l --time-style=full-iso "$stamp"
          else
            echo "::error::stamp が無い(emsdk の proxying.c を直す step が走っていない)"
            bad=1
          fi
          marks=0
          if [ -f "$src" ]; then
            marks=$(grep -c 'PKC3-PROXYFINISH' "$src" || true)
            marks=${marks:-0} # grep が読めずに落ちた回は空文字になり、[ "" -lt 1 ] が偽で素通りする ── 0 に倒す
          fi
          echo "proxying.c の印(PKC3-PROXYFINISH)の行数: $marks"
          if [ "$marks" -lt 1 ]; then
            echo "::error::$src に印(PKC3-PROXYFINISH)が 1 行も無い(patch が当たっていない)"
            bad=1
          fi
          mt=("$libdir"/libc-mt*.a)
          optz=("$libdir"/libc_optz-mt*.a)
          echo "libc-mt*.a: ${#mt[@]} 件 / libc_optz-mt*.a: ${#optz[@]} 件"
          fresh=0
          stale=0
          for f in "${mt[@]}" "${optz[@]}"; do
            ls -l --time-style=full-iso "$f"
            if [ -f "$stamp" ] && [ "$f" -nt "$stamp" ]; then
              echo "作り直された: $f"
              fresh=$((fresh + 1))
            else
              echo "⚠ patch より古い: $f"
              stale=$((stale + 1))
            fi
          done
          echo "作り直された $fresh 件 / patch より古い $stale 件"
          if [ "$stale" -gt 0 ]; then
            echo "::error::patch より古い libc が $stale 件残っている(直す前の proxying.c で作られた物が link されうる)"
            bad=1
          fi
          if [ "$fresh" -lt 1 ]; then
            echo "::error::patch の後に作り直された libc が 1 つも無い(最終 link が libc を作り直していない)"
            bad=1
          fi
          exit "$bad"

      # ⚠ **生成物が在ることを step として主張する** ── 無ければここで赤にする
      #    (artifact の `if-no-files-found: warn` は黙って通してしまう)
      - name: 生成物が在ることを確かめる
        run: |
          set -eux
          test -f ~/lo-core/instdir/program/soffice.wasm
          test -f ~/lo-core/instdir/program/soffice.js
          ls -la ~/lo-core/instdir/program/soffice.*

      # 🔴 **リンクフラグが効いたことを「生成物」で確かめる**(2026-08-10)。
      #    ⚠ `make -n` では検証できない ── tarball の段で止まってリンク行に到達せず、
      #    **パッチの有無どちらでも 0 件**になる(対照群を取って空振りだと分かった)。
      #    ⚠ `qtcanvas` が残っていると `pthread_create` が EINVAL で失敗し、
      #    `-sPROXY_TO_PTHREAD=1` では**それが main() 本体**なので LO が起動しない
      #    (emscripten `libpthread.js:730` が `error = EINVAL; break;`)。
      - name: qtcanvas が焼き込まれていないことを確かめる
        run: |
          set -euxo pipefail
          cd ~/lo-core
          # 正の対照 ── この grep が**本物の soffice.js**を見ていることを先に示す
          # (空の file を相手に「無い」と言わないため)
          grep -q 'soffice_entry' instdir/program/soffice.js
          if grep -q 'qtcanvas' instdir/program/soffice.js; then
            echo 'ERROR: soffice.js に qtcanvas が残っている' >&2
            echo '  → pthread_create が EINVAL で失敗し、main() が走らない' >&2
            exit 1
          fi

      # 🔑 **実行に要る file 一式は上流の list に従う**(自分で並べない)。
      #    `instsetoo_native/CustomTarget_emscripten-install.mk` が
      #    workdir/installation/LibreOffice/emscripten へ必要物を集める ──
      #    ⚠ `soffice.data.js.metadata` / `qt_soffice.html` / `qtloader.js` /
      #    `qtlogo.svg` が要ることは、この list を読むまで気づかなかった。
      #    手で並べていたら**起動できない一式**を配るところだった。
      - name: 実行一式を集める(上流の install list)
        run: |
          set -euxo pipefail
          cd ~/lo-core
          . ~/emsdk/emsdk_env.sh
          make instsetoo_native
          ls -la workdir/installation/LibreOffice/emscripten/
          # ⚠ 起動に不可欠な 4 つを名指しで主張する(在ることを step として言う)
          for f in soffice.js soffice.wasm soffice.data soffice.data.js.metadata \
                   qt_soffice.html qtloader.js; do
            test -f "workdir/installation/LibreOffice/emscripten/$f"
          done
          # 🔴 **日本語 UI が一式に入ったことを、配る物で確かめる**(#158)。
          # ⚠ configure に渡っただけでは足りない ── #145 で「渡していないから
          #    Impress が 1 file も入っていなかった」を踏んでいる。**中身を数える。**
          # ⚠ 0 件なら落とす(黙って英語だけを配らない)。
          # 🔑 **代替物で満たせない条件にする**(2026-08-14 に絞り込んだ)。
          #    `/ja/` だけだと、無関係な path(フォントや fixture)に満たされうる ──
          #    見るのは**翻訳の実体**(`.mo`)と**言語の登録**(Langpack)である。
          #    ⚠ この 2 つは別の機構なので、**両方**数える(片方だけでも UI は英語のまま)。
          meta=workdir/installation/LibreOffice/emscripten/soffice.data.js.metadata
          # ⚠ `pipefail` の下では、0 件のとき grep の exit 1 が代入ごと殺し、
          #    **いちばん読みたい「0 件」の行が出ない**(レビュー指摘)──
          #    `|| true` を grep の側に置き、数える・報せる・落とす、を分ける
          mo=$( (grep -o 'program/resource/ja/LC_MESSAGES/[A-Za-z0-9_]*\.mo' "$meta" || true) | wc -l)
          pack=$( (grep -o 'Langpack-ja\.xcd' "$meta" || true) | wc -l)
          echo "日本語 翻訳(.mo): $mo 件 / 言語の登録(Langpack-ja.xcd): $pack 件"
          test "$mo" -gt 0
          test "$pack" -gt 0

      # 🔴 **`emscripten_promise_await` の起こしに shadow stack の門を置く**(#1344、2026-10-05)。
      #    LO の main thread は user event を handler thread へ proxy して `emscripten_promise_await` で待つ。
      #    その間に来た右クリックが別の promising な計算としてメニューの loop を止めると、proxy の戻りで
      #    main が門なしで起こされ、生きているメニューの frame を踏む(trace: `pa-mismatch dir=above` →
      #    `js-inverted` → `QEventLoop::exit` の unaligned trap)。Qt 側の LIFO / sp の門は Qt の起こししか
      #    見ないので、ここは Emscripten の library JS(焼けた `soffice.js`)を置換して止める。
      #    🔑 当てる先は **配る一式**(`workdir/installation/…/soffice.js` ── zip はここから作る)。
      #       `instdir` を直しても `make instsetoo_native` が集め直すので、**集めた後**に当てる。
      #    ⚠ 錨は Emscripten **4.0.10** の minify 後の字(上の `emsdk` 入力の既定)── 版を上げて字が
      #       変わったら **ここで落ちる**(黙って素通りしない)。`stackSave` の定義が無い一式にも当てない。
      #    🔑 印 `pkc3PaGuard` を**同じ file**で数える(置換が 1 度だけ入ったこと)。
      - name: emscripten_promise_await の起こしに門を置く(配る一式の soffice.js を置換。#1344)
        run: |
          set -euxo pipefail
          target=~/lo-core/workdir/installation/LibreOffice/emscripten/soffice.js
          node "$GITHUB_WORKSPACE"/build/office-wasm/patch-soffice-js-promise-await.mjs "$target"
          # ⚠ minify 後は 1 行なので `grep -c`(行数)では数えられない ── 出現回数で数える
          test "$(grep -o 'pkc3PaGuard' "$target" | wc -l)" -eq 1

      # 🔴 **テンプレートが実際に詰め込まれたか**(#591)。
      #    ⚠ 入力(`*.mk` に足したか)を守る検査は `patch-lo-fsimage.py` の後条件が持つ。
      #    こちらは**出力**(目録に在るか)── **別物**である(#225 の教訓:
      #    入力だけ守ると「直した」が自己証明されて固定される)。
      #    ⚠ **下限を置く** ── 0 件でも「grep が 0 を返した」だけでは落ちない書き方に
      #    すると、空フォルダに戻った日に**静かに元の症状へ帰る**。
      # ⚠ **引用符で囲む** ── YAML は空白の後の `#` から先を**コメントとして捨てる**ので、
      #    裸で書くと step の名前が「検品(テンプレートが配られたか /」で切れ、
      #    **issue 番号が読み手に届かない**(2026-08-29 に実際にそうなった)
      - name: '検品(テンプレートが配られたか / #591)'
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # ⚠ **`working-directory: ~/lo-core` と書かない** ── Actions は `~` を展開せず、
          #    そのままの綴りの dir を探して落ちる(この repo の他の step は全部 `cd`)
          meta=~/lo-core/workdir/installation/LibreOffice/emscripten/soffice.data.js.metadata
          otp=$( (grep -o 'template/common/presnt/[A-Za-z0-9_]*\.otp' "$meta" || true) | wc -l)
          ott=$( (grep -o 'template/common/[a-z0-9]*/[A-Za-z0-9_-]*\.\(ott\|otg\)' "$meta" || true) | wc -l)
          echo "Impress のテンプレート(.otp): $otp 件 / その他(.ott/.otg): $ott 件"
          # ⚠ 上流の実数は 23 / 11。取りこぼしを見たいので**実数より少し下**に置く
          test "$otp" -ge 20
          test "$ott" -ge 8

      # 🔴 **配る物そのものを検める**(#225。2026-08-24)。
      #    非 ODF の保存が「一般的な I/O エラー」で落ちていた原因は、確認ダイアログの
      #    `cui/ui/querydialog.ui` が**一式に入っていなかった**ことだった。
      #    ⚠ **このとき鳴った計器は 1 つも無い** ── `patch-lo-uifiles.py` の tripwire は
      #    **一覧(mk)の側**しか見ず、上の検品は**日本語の翻訳しか数えていない**。
      #    🔑 だから目録(= 実際に詰め込まれた物)と一覧を **1 件ずつ**突き合わせる。
      #    ⚠ **件数ではなく集合**で見る(同じ数だけ取り違えても件数は合う)。
      #    ⚠ **両方向を見る** ── 「配られていない」は詰め込みの取りこぼし、
      #    「一覧に無いのに配られた」は**こちらの読み方が上流に追随できていない**合図。
      #    実測(2026-08-24、LO 770ef72c): 1,090 対 1,090 で両方向とも 0 件。
      # 🔴 **2026-08-28: この検品が実際に鳴った ── そして製品の欠陥を 1 件釣った。**
      #    上流が `cui/uiconfig/ui/querydialog.ui` を消し、実体を `svtools` へ移した
      #    (cfg 上の綴りは `svt/ui/querydialog.ui`)。集合は 1,090 対 1,090 で一致した
      #    ので、鳴ったのは**名指しの錨のほうだけ**である ── 錨を置いていなければ
      #    **緑のまま通っていた**。
      #    ⚠ 実害は焼きではなく**アプリ側**に在った:`public/office/office-format.js` の
      #    `packSavesAlien` が古い綴りだけを見ており、新しい一式では
      #    「この一式では .docx を保存できません」と**嘘の断り**を出すところだった。
      #    🔑 いまは**両方の綴りを受ける**(一式は IDB に取り置かれるので、
      #    配り直しても入れ替わるまでは古いままである)。
      - name: 検品(ダイアログの .ui が一覧どおり配られたか)
        if: ${{ !cancelled() }}
        run: |
          python3 "$GITHUB_WORKSPACE"/build/office-wasm/check-fs-image-uifiles.py \
            ~/lo-core/static/CustomTarget_emscripten_fs_image.mk \
            ~/lo-core/workdir/installation/LibreOffice/emscripten/soffice.data.js.metadata

      # 🔴 **マクロが配った物に入っているか**(#431。2026-08-29 に足した)。
      #    ⚠ 入力側(`PKC3_WASM_SCRIPTING` / `BUILD_TYPE`)は `:125` で見ているのに、
      #    **出力側は 1 度も見ていなかった** ── `check-macro-wiring.py` は
      #    在るのに、呼んでいたのは自分の test だけ(`grep` で 0 件)。
      #    🔑 CLAUDE.md §8「**入力を守る検査と、出力が届いたかを見る検査は別物**」──
      #    前者だけだと「直した」が**自己証明されて固定**される。
      #    ⚠ 上の `.ui` は既に出力側を見ている ── **対称の反対側**がこれである。
      - name: 検品(マクロが配った一式に入っているか)
        if: ${{ !cancelled() }}
        run: |
          python3 "$GITHUB_WORKSPACE"/build/office-wasm/check-macro-wiring.py \
            ~/lo-core/workdir/installation/LibreOffice/emscripten

      # 🔴 **手元で回せるようにする**(user 指示 2026-08-10
      #    「ビルド通ってるんだから、あなたの環境に落として試せばいいんじゃない?」)。
      #    ⚠ **artifact は API 経由でしか落とせず、この箱からは api.github.com が 403**。
      #    一方 **in-scope repo の github.com は 200** なので、**prerelease の資産**
      #    なら手元へ届く(実測: /releases が 200)。
      #    🔑 これは検証用の抜け道ではなく、**`wasm-pack-store` の配布経路そのもの**
      #    (巨大 wasm を release に置き、初回だけ取得してローカルへ保存する設計)。
      #    ⚠ tag は**使い回す** ── run ごとに 80MB を積み上げない。
      #    ⚠ probe が失敗しても出す(`if: always()`)── **落ちた回の成果物こそ要る**。
      - name: 手元で回せるように prerelease へ出す
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=~/lo-core/workdir/installation/LibreOffice/emscripten
          if [ ! -d "$d" ]; then echo '(実行一式が無い ── publish しない)'; exit 0; fi
          cd "$d"
          # 🔴 **どのビルドかを一式の中に残す**(#125)。tag は使い回すので、
          #    tag では版にならない ── **中身が入れ替わっても名前が同じ**である。
          #    ⚠ 版が無いせいで、検証のたびに「本当に新しい一式か」で 1 往復消えていた
          #    (実際に `soffice.js` のバイト数差で見分ける羽目になった)。
          # ⚠ `set -u` の下で `LO_SHA` を裸で使わない ── この step は `if: always()` なので
          #    **clone が失敗した回にも走る**。そこで落ちると、いちばん欲しい
          #    「落ちた回の成果物」が publish されない
          sha="${LO_SHA:-unknown}"
          # ⚠ 同じ理由で裸で使わない(clone が落ちた回にも走る step である)
          lo_ref="${LO_REF:-unknown}"
          # ⚠ 調査ビルドは**版の字面で見分けが付く**ようにする(設定画面に出る)。
          #    🔑 **tag も版も、この 1 つの接尾辞から導く** ── 2 か所で組み立てると
          #    「版は素なのに tag は調査用」がいつか起きる
          SAFE_SUFFIX=""
          if [ "${{ inputs.safe_heap }}" = "true" ]; then SAFE_SUFFIX="${SAFE_SUFFIX}-safeheap"; fi
          if [ "${{ inputs.profiling_funcs }}" = "true" ]; then SAFE_SUFFIX="${SAFE_SUFFIX}-names"; fi
          if [ "${{ inputs.ime_trace }}" = "true" ]; then SAFE_SUFFIX="${SAFE_SUFFIX}-imetrace"; fi
          if [ "${{ inputs.save_trace }}" = "true" ]; then SAFE_SUFFIX="${SAFE_SUFFIX}-savetrace"; fi
          if [ "${{ inputs.idles_trace }}" = "true" ]; then SAFE_SUFFIX="${SAFE_SUFFIX}-idlestrace"; fi
          if [ "${{ inputs.scheduler_trace }}" = "true" ]; then SAFE_SUFFIX="${SAFE_SUFFIX}-schedtrace"; fi
          if [ "${{ inputs.clip_trace }}" = "true" ]; then SAFE_SUFFIX="${SAFE_SUFFIX}-cliptrace"; fi
          if [ "${{ inputs.menu_trace }}" = "true" ]; then SAFE_SUFFIX="${SAFE_SUFFIX}-menutrace"; fi
          if [ "${{ inputs.uev_trace }}" = "true" ]; then SAFE_SUFFIX="${SAFE_SUFFIX}-uevtrace"; fi
          printf '%s\n' "{
            \"version\": \"lo-${sha:0:12}-run${GITHUB_RUN_ID}${SAFE_SUFFIX}\",
            \"lo_sha\": \"${sha}\",
            \"lo_ref\": \"${lo_ref}\",
            \"qt_ref\": \"${{ github.event.inputs.qt_ref || '6.9' }}\",
            \"emsdk\": \"${{ github.event.inputs.emsdk || '4.0.10' }}\",
            \"run_id\": \"${GITHUB_RUN_ID}\",
            \"pkc3_commit\": \"${GITHUB_SHA}\",
            \"safe_heap\": \"${{ inputs.safe_heap }}\",
            \"profiling_funcs\": \"${{ inputs.profiling_funcs }}\",
            \"ime_trace\": \"${{ inputs.ime_trace }}\",
            \"save_trace\": \"${{ inputs.save_trace }}\",
            \"idles_trace\": \"${{ inputs.idles_trace }}\",
            \"scheduler_trace\": \"${{ inputs.scheduler_trace }}\",
            \"clip_trace\": \"${{ inputs.clip_trace }}\",
            \"menu_trace\": \"${{ inputs.menu_trace }}\",
            \"uev_trace\": \"${{ inputs.uev_trace }}\",
            \"built_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
          }" > build-info.json
          cat build-info.json
          zip -q -r /tmp/lo-wasm-qt6.zip .
          ls -la /tmp/lo-wasm-qt6.zip
          # 🔴 **tag は入力させない。導出する。**
          #    調査ビルド(SAFE_HEAP)は実行が数倍遅いので、**配布 tag へ出したら
          #    user の Office が使い物にならなくなる**。⚠ 「間違えないよう気をつける」
          #    ではなく、**間違えられない形**にする ── 入力に tag を持たせない。
          #    🔑 上で組んだ接尾辞をそのまま使う ── `lo-wasm-safeheap` /
          #    `lo-wasm-names` / `lo-wasm-safeheap-names`、素なら `lo-wasm-dev`。
          if [ -n "$SAFE_SUFFIX" ]; then
            tag="lo-wasm${SAFE_SUFFIX}"
          else
            tag=lo-wasm-dev
          fi
          # 既存を消してから作り直す(tag を使い回して容量を積まない)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$tag" /tmp/lo-wasm-qt6.zip \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title 'LibreOffice wasm (Qt6) 開発ビルド ── 検証用' \
            --notes "自動生成。run ${GITHUB_RUN_ID} / commit ${GITHUB_SHA}。
            ⚠ 製品ではない。#88 の検証のために置いている。tag は使い回すので中身は入れ替わる。"
          echo "落とし先: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/lo-wasm-qt6.zip"

      # 🔴 **起動 probe は CI に置かない**(user 指示 2026-08-10)。
      #    「CI にスモークテストが入っているのはなぜ? あなたがテストすればいいのでは?
      #      遅いランナーでやる意味がわからない」
      #
      #    ⚠ 置いていた理由は「**artifact を手元へ落とせなかったから**」だけで、
      #    その理由は上の prerelease publish で**消えた**。理屈が残っていない。
      #
      #    🔑 もう 1 つ、置いてはいけない理由がある ── **1 つの job が 2 つのことを
      #    主張していた**。直前の run は「ビルドは完璧(undefined symbol 0 件)なのに
      #    job は赤」だった。**赤緑が「ビルドが通ったか」を意味しなくなる。**
      #    この job の主張は「**成果物ができた**」の 1 つに絞る。
      #
      #    起動の検証は手元で:  bash build/office-wasm/fetch-and-run.sh
      #    (CI の 1 回転 25 分に対し、手元は秒。フラグ・待ち・観測点を詰められる)

      - name: 生成物
        if: always()
        run: |
          set -eux
          cd ~/lo-core
          ls -la instdir/program/*.wasm instdir/program/*.js instdir/program/*.data 2>/dev/null || true
          df -h /

      # 🔴 **失敗しても保存する** ── 次の試行を数分にするための本体
      - name: ccache を保存
        if: always()
        uses: actions/cache/save@v6
        with:
          path: /home/runner/.ccache
          # ⚠ 復元側と**同じ形**でなければ、次の run が拾えない
          key: ccache-lo-qt6-nd-${{ inputs.qt_ref }}-${{ github.sha }}

      - name: 外部 tarball を保存
        if: always() && steps.c_tar.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /home/runner/lo-core/external/tarballs
          key: lo-tarballs-v1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lo-wasm-qt6
          # ⚠ **配るのは「上流の install list が集めた一式」**。手で並べた 3 つでは
          #    `soffice.data.js.metadata` / `qt_soffice.html` / `qtloader.js` が欠け、
          #    **落としても起動できない**(2026-08-10 に気づいた)。
          path: |
            ~/lo-core/workdir/installation/LibreOffice/emscripten
            ~/lo-core/config.log
          if-no-files-found: error

      # 🔴 **エラー行は「ジョブの最後」に出す**(2026-08-10)。
      #    GitHub API のログ取得は**末尾しか返さない**(実測 16KB 前後)ので、
      #    make の直後に置くと大量の出力に埋もれて**読めない**。
      #    ⚠ 1 度そこで失敗した ── 置き場所そのものが観測点である。
      #    ⚠ `| head` は使わない(SIGPIPE)── `grep -m` と `head < file`。
      # 🔴 **診断は「ジョブの最後」に 1 か所へまとめる**(2026-08-10)。
      #    ⚠ **同じ置き場所の失敗を 3 回やった** ── make のエラー / probe の結果 /
      #    JSPI の報告。どれも中間に置いたので、API のログ取得(末尾のみ、実測 16KB 前後)
      #    では読めず、そのたびに 1 回転を捨てた。注意書きでは 3 度目を止められなかったので、
      #    **出口を 1 つに統合する**(次に診断を足す人も、ここに足すしかない形にする)。
      #    ⚠ `| head` は使わない(SIGPIPE)── `grep -m` と `head < file`。
      - name: 診断まとめ(最後に出す)
        if: always()
        run: |
          set -euo pipefail

          echo '########## 1. 起動の検証は手元で ##########'
          echo '  bash build/office-wasm/fetch-and-run.sh'
          echo '  (CI では回さない ── この job の主張は「成果物ができた」の 1 つだけ)'

          echo '########## 2. JSPI が生成物に効いているか ##########'
          js=~/lo-core/instdir/program/soffice.js
          if [ -f "$js" ]; then
            sym=$(grep -o '_ZN10emscripten[A-Za-z0-9_]*' \
              ~/lo-core/solenv/gbuild/platform/EMSCRIPTEN_INTEL_GCC.mk | head -1)
            echo "LO が JSPI_EXPORTS で名指しする記号: ${sym:0:60}..."
            echo -n '  soffice.js に在るか: '
            if grep -q -- "$sym" "$js"; then echo 'あり'; else echo 'なし'; fi
            for marker in JSPI Asyncify asyncify WebAssembly.Suspending emscripten_check_mailbox; do
              echo -n "  '$marker' の出現数: "
              grep -c -- "$marker" "$js" || true
            done
          else
            echo '(soffice.js 無し)'
          fi

          echo '########## 3. 構成の実物(config_host.mk)##########'
          # 🔴 **検品の grep が落ちたとき、何と食い違ったのかを読めるようにする**
          #    (2026-08-14。ここが無くて「どの grep が落ちたか」すら分からなかった)。
          if [ -f ~/lo-core/config_host.mk ]; then
            grep -E '^export (WITH_LANG|ENABLE_QT|VCL_PLUGIN_INFO|ENABLE_WASM_STRIP|ENABLE_EMSCRIPTEN|CCACHE_DEPEND_MODE)' \
              ~/lo-core/config_host.mk || echo '(該当なし)'
          else
            echo '(config_host.mk 無し)'
          fi

          echo '########## 3b. 上流が持つ wasm-strip / lang の選択肢 ##########'
          # 🔴 **推測で option を当てない**(2026-08-14 に 2 度やった)。
          #    上流の configure.ac は runner に在るのだから、**名前を読む**。
          if [ -f ~/lo-core/configure.ac ]; then
            grep -nE 'wasm-strip|with-lang' ~/lo-core/configure.ac | head -20 || echo '(該当なし)'
          else
            echo '(configure.ac 無し)'
          fi

          echo '########## 4. configure のエラー ##########'
          if [ -f /tmp/configure.log ]; then
            grep -m 10 -nE 'Error|error:|not found|requires' /tmp/configure.log || echo '(該当なし)'
            echo '--- 末尾 20 行 ---'
            tail -20 < /tmp/configure.log
          else
            echo '(configure.log 無し)'
          fi

          echo '########## 5. make のエラー ##########'
          if [ -f /tmp/make.log ]; then
            grep -m 20 -nE 'wasm-ld: error|error:|^make.*\*\*\*' /tmp/make.log || echo '(該当なし)'
            grep -oE 'undefined symbol: [A-Za-z0-9_:]+' /tmp/make.log > /tmp/undef.txt || true
            sort -u /tmp/undef.txt > /tmp/undef-uniq.txt || true
            echo "undefined symbol 件数: $(wc -l < /tmp/undef-uniq.txt)"
            head -20 < /tmp/undef-uniq.txt
            # 🔴 **落ちた行の前後を出す**(2026-08-30)。
            #    ⚠ 上の grep は `wasm-ld: error` / `error:` / `make: ***` しか拾わない ──
            #    run 33285888070 は **`Error 127`(command not found)** で落ちたのに、
            #    **その 127 が何のコマンドだったのかが 1 行も読めなかった**。
            #    🔑 型に当たらないエラーこそ読みたいので、**落ちた行の手前をそのまま出す**
            #    (CLAUDE.md「未確認は assert ではなく診断で出す」)。
            # 🔴 **錨は「Error N を持つ `***`」に限る**(2026-08-30、入れた当日に踏んだ)。
            #    ⚠ 1 稿目は**最初の `***`** を採ったが、make は依存 file の掃除でも
            #    `make[1]: *** Deleting file '…libgcc3_uno.a.d'` を**先に**出す ──
            #    run 33287457649 では**そこに当たって**、手前 80 行が
            #    `[build DEP] LNK:…` の羅列になり、**肝心の `Error 127` が読めなかった**。
            #    🔑 落ちた行は必ず `*** [target] Error N` の形なので、そこで留める。
            first=$(grep -nE '^make(\[[0-9]+\])?: \*\*\* .*Error [0-9]' /tmp/make.log | head -1 | cut -d: -f1 || true)
            if [ -n "${first:-}" ]; then
              from=$(( first > 80 ? first - 80 : 1 ))
              echo "--- 落ちた行($first)の $from 行目から ---"
              sed -n "${from},${first}p" /tmp/make.log
            else
              echo '(make.log に「*** … Error N」の行が無い ── 落ち方が変わった)'
            fi
          else
            echo '(make.log 無し)'
          fi

