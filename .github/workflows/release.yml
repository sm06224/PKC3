# PKC3 Release — v* tag → build(kind:product)+ SBOM(CycloneDX)+ provenance
# attestation を GitHub Release に添付(設計 doc §7 / P7 段⑦)
name: Release
on:
  push:
    tags: ['v*']
  # 🔴 **手で押せる口**(2026-08-03)。tag push だけにしておくと、tag を push できない
  # 環境(git proxy が tag を 403 で拒む / 手元に clone が無い)から**出荷そのものが
  # できない**。⚠ Releases 画面から release を作る道は**罠** ── その tag で
  # この workflow が走り、`gh release create` が「もう在る」で落ちる。
  # だから **tag を作るのもこの workflow の仕事**にして、入口を 1 本にする。
  workflow_dispatch:
    inputs:
      version:
        description: '打つ版(package.json と一致すること。v は付けない。例: 3.0.0)'
        required: true
        type: string
permissions:
  contents: write
  # 🔴 provenance attestation に要る 2 つ。どちらか欠けると attest step が落ちる
  id-token: write
  attestations: write
  # 🔴 Pages を**明示的に起こす**のに要る(下記 round-3 review M-1)
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # 🔴 **build より前**に版を突合する(P7 段⑦)。後ろに置くと、食い違ったまま
      # ビルドして検品まで通り、最後の release 作成でようやく落ちる ── 時間の無駄で
      # あるうえ、「配ったものと名乗る版が違う」provenance を作りかけることになる。
      # ⚠ 突合の相手は package.json(SBOM が名乗る版)。画面の版は
      # `tests/release-meta.test.ts` が package.json と一致することを pin している
      # 🔴 **版はここで 1 回だけ決める**。tag push なら tag から、手動起動なら入力から。
      # ⚠ 入力を shell へ直接展開しない(`env:` 経由 ── script injection を作らない)
      - name: 版を決めて package.json と突き合わせる
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VER="$INPUT_VERSION"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          case "$VER" in
            v*) echo "::error::版に v を付けないでください(いま: $VER)"; exit 1 ;;
            '') echo "::error::版が空です"; exit 1 ;;
          esac
          PKG=$(node -p "require('./package.json').version")
          echo "version=$VER package.json=$PKG event=$GITHUB_EVENT_NAME"
          if [ "$VER" != "$PKG" ]; then
            echo "::error::v$VER と package.json の $PKG が食い違います"
            exit 1
          fi
          echo "TAG=v$VER" >> "$GITHUB_ENV"
      # ⚠ 手動起動は **main からだけ** ── ほかの branch から打つと、tag が指す commit と
      # `pages.yml` が焼く `/dev/`(main HEAD)がずれる。
      # ⚠ 既存 tag への打ち直しも塞ぐ(黙って別 commit を同じ版で出荷しない)
      - name: 手動起動の前提を確かめる
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::手動起動は main からのみ(いまは $GITHUB_REF)"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG は既にあります(打ち直すなら先に消してください)"
            exit 1
          fi
      - run: npm ci
      # 🔴 **tag push では `ci.yml` が走らない**(trigger は main への push と PR だけ)
      # ── ここで走らせないと、CI を通っていない commit に tag を打てば
      # `APP_VERSION` 不一致のまま出荷できる(round-2 review L-3)。
      # ⚠ 「CI を長くしない」は **PR gate** の話であり、release は稀なので載せてよい
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: VITE_PKC_KIND=product npm run build
      # 出荷物に map が混ざっていないか(P7 段①)。ここが release の最終関門
      - name: dist の検品(product に map が無いこと)
        run: node scripts/check-dist.mjs product
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx --omit=dev > pkc3-sbom.cdx.json
      - name: 可搬単一 HTML の雛形(#400 段④)
        run: |
          # 🔴 **検品の「後」に足す** ── build の中に入れると **SW の precache 一覧**
          # (build 時に作られる)に載り、**全 user が 7 MB を先に落とす**。
          # ⚠ **順番だけでは足りなかった**(2026-08-29、本番配布を止めて分かった)──
          # Pages 側は**この zip を展開して**検品するので、ここで足した雛形が
          # そのまま検品対象に混ざり、v3.2.0 の配布が
          # 「precache に載っていない生成物がある」+「cap を 6563.8 KB 超過」で
          # 落ちた(run 33256868235)。⚠ v3.1.0 にはこの step が無く、
          # **この経路は一度も通っていなかった**。
          # 🔑 いまは検品の規則(`scripts/dist-inspect.mjs`)が雛形を名前で知っていて、
          # 別立ての予算で見る ── 順番はこの step 自身のためだけに残す。
          # ⚠ ここで足さないと、本番の PKC3 から「持ち歩ける 1 枚」を押しても
          #   **雛形が 404 になって書き出せない**(dev だけ動く形を作らない)。
          VITE_PKC_KIND=product npm run build:portable
          cp dist-portable/pkc3.html dist/portable-template.html
      - name: Archive dist
        run: (cd dist && zip -r ../pkc3-dist.zip .)
      # 🔴 **配る物そのもの**に attestation を付ける(P7 段⑦ / 段⑧)。
      # ⚠ round-2 review M-4 の時点では嘘だった ── `pages.yml` が同じ tag を
      # **別 job で独立にビルドし直して**配っていたので、attestation が担保するのは
      # 「release zip の出所」だけで、user が触る物の出所ではなかった。
      # 段⑧ で `pages.yml` が**この zip を展開してそのまま配る**ようにしたので、
      # いまは **user が触る物 = attest した物**である
      # (`tests/release-meta.test.ts` が pages.yml 側の経路も pin している)。
      # ⚠ 対象を書き忘れても step は通る ── 「何も証明しない attestation」になるので、
      # `tests/release-meta.test.ts` が subject-path の存在まで pin している。
      # 検証: gh attestation verify pkc3-dist.zip --repo <owner>/<repo>
      - name: Provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            pkc3-dist.zip
            pkc3-sbom.cdx.json
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE="--prerelease" ;;
          esac
          # 🔴 **draft で作ってから公開する**(P7 段⑧)。`gh release create` は
          # **公開してから資産を上げる**ので、`release: published` を待っている
          # `pages.yml` が **zip が届く前に走りうる** ── その場合 asset が見つからず
          # placeholder を配って終わり、次に main へ push するまで `/` が空のままになる。
          # draft のうちに上げ切り、`--draft=false` で公開すれば published は
          # **資産が揃ってから**しか飛ばない(競合そのものを消す)。
          # ⚠ `--target` を渡す ── 手動起動では **tag がまだ無い**ので、
          # 公開の瞬間に**この commit**へ tag が作られる(draft のうちは ref を作らない)。
          # tag push 経路では既に tag が在るので無視される
          gh release create "$TAG" pkc3-sbom.cdx.json pkc3-dist.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes --draft $PRERELEASE
          gh release edit "$TAG" --draft=false
      # 🔴 **Pages を自分で起こす**(round-3 review M-1)。
      # GitHub Actions は **既定の `GITHUB_TOKEN` が起こしたイベントで新しい run を
      # 開始しない**ので、`pages.yml` の `release: types: [published]` は
      # **この workflow が作った release では一度も走らない**。
      # 気づかないと「tag を打ったのに `/` が placeholder のまま、次の main push まで
      # 製品が出ない」になる ── 明示 dispatch で経路を成立させる。
      # ⚠ `--ref main` にするのは、`pages.yml` が `/dev/` を main HEAD から焼き、
      # product は git tag から解決するため(tag を ref にすると dev が tag になる)。
      # ⚠ 上の draft → 公開の順序は**手で release を公開する経路**では効き続ける
      # (人が起こしたイベントなら `published` は飛ぶ)ので残す
      - name: Pages を起こす
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
