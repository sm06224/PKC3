# PKC3 全量 smoke ── 🔴 **任意起動だけ**(user 指示 2026-09-09。不可侵)
#
# > 「**自動CIにフルスモークテスト入ってない？/ 自動実行は禁止したはず /
# >   約束では全て任意起動のはず**」
#
# ⚠ 直す前は `ci.yml` の中に居て、**PR へ push するたび / main へ push するたび**に
#   全量が 3 shard で回っていた ── 同じ日に出た
#   「**改修一件で増えるテストが毎ターンの負荷に積み上がる / o(n2) のテストケース
#   広がりを回避しろ**」の、**CI 側の実体**である。手元は `scripts/pick-smoke.mjs` で
#   引く形に直したのに、**CI は毎 push でフルのまま**だった。
#
# 🔑 **禁止の目的は「押していないのに全量が走らないこと」**であって、全量を回さない
#   ことではない ── 回すときは Actions の「Run workflow」を押す。
#   ⚠ 着地の直前の 1 回(CLAUDE.md「フルは 1 PR に 1 回」)は、ここで押す。
# 🔑 夜の全量は `nightly.yml` に在る(2 つのブラウザで突き合わせる唯一の場所)──
#   こちらは「押したときだけ」の口であって、夜の検査を置き換えるものではない。
#
# ⚠ **`on:` に `push` / `pull_request` / `schedule` を足さない。**
#   足した瞬間に上の指示が破れるので、`tests/workflow-steps.test.ts` が機械で止める。
name: Smoke (手動)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # 🔴 **3 shard のまま移した** ── 割っても **1 件も減らない**(playwright の
  #   `--shard` は spec を分けるだけで、3 つ合わせれば全量である)。
  # ⚠ `timeout-minutes: 10` は速度予算の tripwire なので**上げない**
  #   (2026-08-28 に smoke 本体が 9 分 25 秒まで伸びて job ごと切られた ──
  #    上げると「次に本当に遅くなったとき」に鳴らなくなる)。
  # ⚠ `fail-fast: false` ── 1 つ落ちても残りを最後まで走らせる
  #   (走らなかった shard は「確かめていない」であって「緑」ではない)。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ⚠ smoke は `vite preview` で **`dist/` を配信する**ので、build が要る
      #   (source を書き換えただけでは smoke に一切届かない ── CLAUDE.md §3)
      # ⚠ kind を**明示**する(`ci.yml` の verify と同じ理由 ── 既定が変わると
      #   「検品した物」と「配る物」が静かに別物になる)
      - run: VITE_PKC_KIND=dev npm run build
      - run: npx playwright install chromium --with-deps
      # ⚠ 3 つ合わせて全量。1 つだけ緑でも**全量が通ったことにはならない**
      - name: Visual smoke (${{ matrix.shard }}/3 ── もう 1 つのブラウザは nightly)
        run: npm run test:smoke -- --shard=${{ matrix.shard }}/3
