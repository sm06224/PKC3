# PKC3 CI — verify(設計 doc §7・§11 P1)
# PR gate は速い lane に限定(CLAUDE.md プロセス指示、user 指示 2026-07-30
# 「PKC2 は CI 長すぎ問題があった」)。重い検証(視覚全量・ベンチ・matrix)は
# main push / nightly / 手動 dispatch へ。timeout 10 分は速度予算の tripwire。
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 下の差分 tripwire が merge-base を要る
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # rust/ を触ったのに出荷 .wasm を焼き直していない事故を 0 秒で止める
      # (再ビルド一致の検査自体は nightly ── PR gate で cargo は走らせない)
      - name: Rust を触ったなら .wasm も更新されているか
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)
          if echo "$CHANGED" | grep -q '^rust/' && ! echo "$CHANGED" | grep -q 'pkc_core\.wasm'; then
            echo "::error::rust/ を変更したのに出荷 .wasm が古い ── ./scripts/build-wasm.sh を実行して commit すること"
            exit 1
          fi
      - run: npm ci
      - name: Audit (prod deps, high+, blocking)
        run: npm audit --audit-level=high --omit=dev
      - name: Audit (full, informational)
        run: npm audit || true
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # 視覚 smoke は「数 spec・秒オーダー」のみ PR gate に載せる(CLAUDE.md
      # プロセス指示)。別 job にしない ── npm ci / build の二重払い(PKC2 の
      # セットアップ税)を避けるため verify に同居。全量・重い検証は nightly.yml
      - run: npx playwright install chromium --with-deps
      - name: Visual smoke (PR gate lane — 全量は nightly)
        run: npm run test:smoke
