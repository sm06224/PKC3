# PKC3 CI — PR gate(設計 doc §7・§11 P1)
# PR gate は速い lane に限定(CLAUDE.md プロセス指示、user 指示 2026-07-30
# 「PKC2 は CI 長すぎ問題があった」)。重い検証(視覚全量・ベンチ・matrix)は
# main push / nightly / 手動 dispatch へ。timeout 10 分は速度予算の tripwire。
#
# 🔴 **job は 2 つに割ってある**(2026-08-18)。
#
# ⚠ 直す前は smoke を `verify` に同居させており、その理由は
# 「`npm ci` / build の二重払い(PKC2 のセットアップ税)を避けるため」と
# 書いてあった。**実測すると、その理由は成り立っていなかった**:
#
# | step | 実測 |
# |---|---|
# | `npm ci` | 5〜7 秒 |
# | `npm run build` | 3 秒 |
# | **`playwright install --with-deps`** | **22 秒 / 291 秒 / 390 秒**(3 回測った) |
#
# つまり払っていた「税」は **10 秒**で、budget を溶かしていたのは**その隣**だった。
# ⚠ ブラウザの**ダウンロードは 114.7 MiB を 1 秒**で終えている(ログで確認)ので、
# ぶれているのは `--with-deps` の apt 側である。⚠ キャッシュしても効かない。
#
# 帰結: install が遅い回に **speed budget(10 分)を 2 度踏んで job ごと cancel** され、
# **緑だったはずの PR が赤に見えた**(smoke は 105/165 まで通っていた)。
# 🔑 割れば、速い lane は ~90 秒で確定し、smoke lane は最悪の install でも 10 分に収まる。
# 🔑 **1 job = 1 主張**(user 指示 2026-08-10)にも合う ── 落ちたとき、
#   「型 / lint / unit が壊れた」のか「実ブラウザで壊れた」のかが**名前で分かる**。
#
# ⚠ 2 つは**並列**に走らせる(`needs:` を張らない)── 直列にすると、速い lane が
#   緑でも smoke の結果が 90 秒遅れるだけで、budget の問題は何も解けない。
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# 🔴 **重ねて push したら、古い実行を畳む**(user 指示 2026-08-19「フルスモークを
# 乱発しない」)。この workflow は smoke を**全量**回すので **1 実行 4〜6 分**
# かかり、直して push し直すたびに**古い実行が最後まで走り続けていた**。
# ⚠ **畳むのは PR のときだけ** ── `main` への push は「配った物の検査」なので、
#   後続に追い越されて**検査そのものが消える**形にしない。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # ── 速い lane: 型 / lint / unit / build / 生成物の検品 ─────────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 下の差分 tripwire が merge-base を要る
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # rust/ を触ったのに出荷 .wasm を焼き直していない事故を 0 秒で止める
      # (再ビルド一致の検査自体は nightly ── PR gate で cargo は走らせない)
      - name: Rust を触ったなら .wasm も更新されているか
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)
          if echo "$CHANGED" | grep -q '^rust/' && ! echo "$CHANGED" | grep -q 'pkc_core\.wasm'; then
            echo "::error::rust/ を変更したのに出荷 .wasm が古い ── ./scripts/build-wasm.sh を実行して commit すること"
            exit 1
          fi
      - run: npm ci
      # 🔴 判定は script に置く(#675)── 素の `npm audit` は「脆弱がある」と
      #    「registry が答えない」を**同じ exit 1** で返すので、赤の意味が読めない。
      #    規則と全経路の test は scripts/audit-gate.mjs / tests/audit-gate.test.ts。
      - name: Audit (prod deps, high+, blocking)
        run: node scripts/audit-gate.mjs
      # ⚠ 上と同じ理由で**時間を区切る** ── registry が答えない日に、参考の 1 行の
      #    ために 5 分溶ける(job の timeout は 10 分しかない)。
      - name: Audit (full, informational)
        run: timeout 60 npm audit --fetch-retries=1 --fetch-retry-maxtimeout=10000 || true
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # ⚠ kind を**明示**する ── 既定(未指定)と `dev` が同じ生成物になるのは
      # `release-meta.ts` が両者を同じ定数へ畳んでいるからで、意図ではなく副作用
      # である(レビュー 2 巡目 L-4)。既定が変わると「CI が検品・smoke した物」と
      # 「Pages /dev/ に出る物」が静かに別物になる
      - run: VITE_PKC_KIND=dev npm run build
      # 生成物の検品(P7 段①)。product ビルドは PR gate に足さない ── 配る量は
      # kind でほぼ変わらない(実測 0.2 KB 差)ので cap の tripwire はこの 1 回で効く。
      # product 固有の検品は tests/build-config.test.ts(config)+ nightly / release(実物)
      - name: dist の検品(map の有無 / 参照の実在 / 配る量の tripwire)
        run: node scripts/check-dist.mjs dev

  # ── 実ブラウザ lane: smoke ────────────────────────────────────────────
  # ⚠ **2026-08-19 訂正**: ここは「最小 smoke(全量は nightly)」と書いてあったが
  #   **事実ではない** ── `npm run test:smoke` は `tests/smoke/**` を**全部**回す
  #   (35 spec / 181 test。手元の実測 3.9〜4.2 分)。nightly が足すのは
  #   「もう 1 つのブラウザで回す」ことであって、件数ではない。
  # ⚠ 2026-08-19: `playwright install --with-deps` が **10 分の job timeout に
  #   当たって cancel** された(smoke は 1 件も走っていない)。この step は
  #   上の注記どおり大きくぶれる ── **install 段で死んだ回は再実行が正しい対処**
  #   であって、test を疑う場面ではない(CLAUDE.md の flaky の扱い)。
  # 🔑 実態と食い違う注記は、次に読む人の判断を狂わせる(CLAUDE.md「実態と乖離した
  #   記述は見つけ次第その場で直す」)── 直すなら**注記ではなく job の中身**である。
  # ⚠ ここだけ `playwright install` を払う。上の注記のとおり、この step は
  #   22〜390 秒でぶれるので**速い lane と同じ budget に同居させない**。
  #
  # 🔴 **2026-08-28: 今度は install ではなく smoke 本体が budget を食い切った。**
  #   ⚠ 上の 2026-08-19 の注記は「install 段で死んだ回は再実行が正しい対処であって、
  #     test を疑う場面ではない」と書いているが、**この回には当てはまらない** ──
  #     実測(run 33192366507): install は **30 秒**で終わり、
  #     smoke 本体が **9 分 25 秒**走ったところで 10 分の job timeout に当たった。
  #   🔑 **再実行では 1 度も直らない**(毎回同じだけ掛かる)。注記のとおりに
  #     再実行していたら、runner を 2 回捨てて同じ赤を見ることになる。
  #   ⚠ 原因は spec が増えたことで、**どれかが遅いのではない**
  #     (手元のフル走行も 8.3 分 → **10.1 分**へ伸びていた)。
  #
  # 🔑 **だから timeout を上げるのではなく、2 つに割って並べる。**
  #   ⚠ 上げるのは「CI を長くしない」(user 指示 2026-07-30)と逆向きで、
  #     しかも **tripwire を鈍らせる**(次に本当に遅くなったとき鳴らない)。
  #   ⚠ 割っても**1 件も減らさない** ── playwright の `--shard` は
  #     spec を分けるだけで、2 つ合わせれば全量である。
  #   ⚠ shard ごとに**別の runner**なので、`vite preview` の port も
  #     `workers: 1` の直列も、そのまま安全に効く。
  #   ⚠ `fail-fast: false` ── 片方が落ちても**もう片方を最後まで走らせる**
  #     (走らなかった shard は「確かめていない」であって「緑」ではない。
  #      2026-08-17 に nightly で踏んだ形)。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ⚠ smoke は `vite preview` で **`dist/` を配信する**ので、build が要る
      #   (source を書き換えただけでは smoke に一切届かない ── CLAUDE.md §3)
      - run: VITE_PKC_KIND=dev npm run build
      - run: npx playwright install chromium --with-deps
      # ⚠ 名前も実態に合わせる(「最小」ではない ── 上の訂正を参照)
      # ⚠ 2 つ合わせて全量。どちらか片方だけ緑でも**全量が通ったことにはならない**
      - name: Visual smoke (${{ matrix.shard }}/2 ── もう 1 つのブラウザは nightly)
        run: npm run test:smoke -- --shard=${{ matrix.shard }}/2
