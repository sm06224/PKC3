# PKC3 CI — PR gate(設計 doc §7・§11 P1)
# PR gate は速い lane に限定(CLAUDE.md プロセス指示、user 指示 2026-07-30
# 「PKC2 は CI 長すぎ問題があった」)。重い検証(視覚全量・ベンチ・matrix)は
# main push / nightly / 手動 dispatch へ。timeout 10 分は速度予算の tripwire。
#
# 🔴 **job は 2 つに割ってある**(2026-08-18)。
#   ⚠ 2026-09-09 注記: いまは **`audit` / `verify`** の 2 job だけである ──
#     🔴 **全量 smoke は `smoke.yml`(任意起動)へ出した**(user 指示、下の
#     「実ブラウザ lane は、ここには無い」を参照)。下の経緯(verify と smoke を
#     割った理由)は「**smoke をここへ戻すなら、また同じ税を払う**」という
#     記録として残す。`audit` は #675。
#
# ⚠ 直す前は smoke を `verify` に同居させており、その理由は
# 「`npm ci` / build の二重払い(PKC2 のセットアップ税)を避けるため」と
# 書いてあった。**実測すると、その理由は成り立っていなかった**:
#
# | step | 実測 |
# |---|---|
# | `npm ci` | 5〜7 秒 |
# | `npm run build` | 3 秒 |
# | **`playwright install --with-deps`** | **22 秒 / 291 秒 / 390 秒**(3 回測った) |
#
# つまり払っていた「税」は **10 秒**で、budget を溶かしていたのは**その隣**だった。
# ⚠ ブラウザの**ダウンロードは 114.7 MiB を 1 秒**で終えている(ログで確認)ので、
# ぶれているのは `--with-deps` の apt 側である。⚠ キャッシュしても効かない。
#
# 帰結: install が遅い回に **speed budget(10 分)を 2 度踏んで job ごと cancel** され、
# **緑だったはずの PR が赤に見えた**(smoke は 105/165 まで通っていた)。
# 🔑 割れば、速い lane は ~90 秒で確定し、smoke lane は最悪の install でも 10 分に収まる。
# 🔑 **1 job = 1 主張**(user 指示 2026-08-10)にも合う ── 落ちたとき、
#   「型 / lint / unit が壊れた」のか「実ブラウザで壊れた」のかが**名前で分かる**。
#
# ⚠ 2 つは**並列**に走らせる(`needs:` を張らない)── 直列にすると、速い lane が
#   緑でも smoke の結果が 90 秒遅れるだけで、budget の問題は何も解けない。
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# 🔴 **重ねて push したら、古い実行を畳む**(user 指示 2026-08-19「フルスモークを
# 乱発しない」)。⚠ 2026-09-09 に smoke を出したので **1 実行は速い lane だけ**に
# なったが、畳むこと自体は残す ── 直して push し直すたびに古い実行が最後まで
# 走り続ける形は、runner を無駄に掴む(かつては smoke の 4〜6 分がそれだった)。
# ⚠ **畳むのは PR のときだけ** ── `main` への push は「配った物の検査」なので、
#   後続に追い越されて**検査そのものが消える**形にしない。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # ── 速い lane: 型 / lint / unit / build / 生成物の検品 ─────────────────
  # 🔴 **依存の検めは別の job にした**(2026-09-04)。
  #
  # ⚠ 直す前は `verify` の中に居たので、registry が遅い日に **2 分 05 秒**を食い、
  #    `npm ci` の 5 分と合わせて **10 分の予算を使い切った**(実測で打ち切られた)。
  # 🔑 **1 job = 1 主張**(CLAUDE.md「回すものの粒度」)── 分けると
  #    ①並列なので**壁時計は伸びない** ②赤が出たとき「依存の話か、コードの話か」が
  #    **job の名前で分かる**。⚠ 予算(10 分)は上げない。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 🔴 判定は script に置く(#675)── 素の `npm audit` は「脆弱がある」と
      #    「registry が答えない」を**同じ exit 1** で返すので、赤の意味が読めない。
      #    規則と全経路の test は scripts/audit-gate.mjs / tests/audit-gate.test.ts。
      - name: Audit (prod deps, high+, blocking)
        run: node scripts/audit-gate.mjs
      # ⚠ 上と同じ理由で**時間を区切る** ── registry が答えない日に、参考の 1 行の
      #    ために 5 分溶ける。
      - name: Audit (full, informational)
        run: timeout 60 npm audit --fetch-retries=1 --fetch-retry-maxtimeout=10000 || true

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 下の差分 tripwire が merge-base を要る
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # rust/ を触ったのに出荷 .wasm を焼き直していない事故を 0 秒で止める
      # (再ビルド一致の検査自体は nightly ── PR gate で cargo は走らせない)
      - name: Rust を触ったなら .wasm も更新されているか
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD || true)
          if echo "$CHANGED" | grep -q '^rust/' && ! echo "$CHANGED" | grep -q 'pkc_core\.wasm'; then
            echo "::error::rust/ を変更したのに出荷 .wasm が古い ── ./scripts/build-wasm.sh を実行して commit すること"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # ⚠ kind を**明示**する ── 既定(未指定)と `dev` が同じ生成物になるのは
      # `release-meta.ts` が両者を同じ定数へ畳んでいるからで、意図ではなく副作用
      # である(レビュー 2 巡目 L-4)。既定が変わると「CI が検品・smoke した物」と
      # 「Pages /dev/ に出る物」が静かに別物になる
      - run: VITE_PKC_KIND=dev npm run build
      # 生成物の検品(P7 段①)。product ビルドは PR gate に足さない ── 配る量は
      # kind でほぼ変わらない(実測 0.2 KB 差)ので cap の tripwire はこの 1 回で効く。
      # product 固有の検品は tests/build-config.test.ts(config)+ nightly / release(実物)
      - name: dist の検品(map の有無 / 参照の実在 / 配る量の tripwire)
        run: node scripts/check-dist.mjs dev --require-precache-list

  # ── 実ブラウザ lane は、ここには無い ──────────────────────────────────
  # 🔴 **全量 smoke を PR gate から外した**(user 指示 2026-09-09。不可侵):
  #
  # > 「**自動CIにフルスモークテスト入ってない？/ 自動実行は禁止したはず /
  # >   約束では全て任意起動のはず**」
  #
  # ⚠ ここには `smoke` job(3 shard で `npm run test:smoke` を全量)が居て、
  #   **PR へ push するたび / main へ push するたび**に回っていた ── 同じ日の
  #   「**改修一件で増えるテストが毎ターンの負荷に積み上がる**」の CI 側の実体である。
  # 🔑 移した先は 2 つ。**1 件も減らしていない ── 起動する条件だけを変えた**:
  #   ① `smoke.yml`(**手で押す**。Actions の Run workflow。着地の直前の 1 回はここ)
  #   ② `nightly.yml`(**夜**。2 つのブラウザで突き合わせる唯一の場所)
  # ⚠ **ここへ `test:smoke` を戻さない。** 戻すと user の指示が破れるので、
  #   `tests/workflow-steps.test.ts` が「ci.yml の実行する行に smoke が無い」を pin する。
