# PKC3 CI — verify(設計 doc §7・§11 P1)
# PR gate は速い lane に限定(CLAUDE.md プロセス指示、user 指示 2026-07-30
# 「PKC2 は CI 長すぎ問題があった」)。重い検証(視覚全量・ベンチ・matrix)は
# main push / nightly / 手動 dispatch へ。timeout 10 分は速度予算の tripwire。
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit (prod deps, high+, blocking)
        run: npm audit --audit-level=high --omit=dev
      - name: Audit (full, informational)
        run: npm audit || true
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
