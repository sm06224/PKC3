# LibreOffice wasm(#88)を配る nginx 設定。
# 使い方:
#   docker run --rm -p 8080:8080 \
#     -v "$PWD/dist-office-pages:/srv/office-wasm:ro" \
#     -v "$PWD/build/office-wasm/selfhost/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:alpine
server {
    listen 8080;
    root /srv/office-wasm;

    # 🔴 SharedArrayBuffer(= LO の -pthread)に必須。
    #    付けられるなら付ける ── coi-serviceworker に頼らずに済む
    add_header Cross-Origin-Opener-Policy   same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;

    types { application/wasm wasm; }
    default_type application/octet-stream;

    # ⚠ 一式の .gz は「中身が gzip のただのファイル」で、JS 側が
    #    DecompressionStream で解く。gzip_static を on にすると
    #    Content-Encoding: gzip が付いて **二重解凍で壊れる**
    gzip_static off;
    gzip on;
    gzip_types text/html text/javascript application/javascript application/json;
    gzip_min_length 1024;

    sendfile on;
    tcp_nopush on;
    location / { try_files $uri $uri/ =404; }
}
