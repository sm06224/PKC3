<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>PKC3 bench: edit session</title>
  </head>
  <body>
    <pre id="out">ready</pre>
    <script type="module">
      import { StoreClient } from '/src/adapter/platform/storage/store-client.ts';

      const store = new StoreClient();

      // 決定的な ~1KB の PKC-Markdown 本文(乱数不使用 ── 再現性のため)
      function makeBody(i, rev) {
        const para =
          `パラグラフ ${i}-${rev}: PKC-Markdown の本文。==ハイライト== と ` +
          '**強調** と `code` を含む行を繰り返して 1KB 級にする。\n';
        return `# entry ${i} (rev ${rev})\n\n${para.repeat(8)}`;
      }

      function entryFor(i, rev) {
        return {
          lid: 'e' + i,
          title: 'entry ' + i,
          archetype: i % 10 === 0 ? 'todo' : 'text',
          body: makeBody(i, rev),
          entryOrder: i,
          status: i % 10 === 0 ? 'open' : null,
          date: null,
          archived: false,
        };
      }

      window.__BENCH__ = {
        async init(dbName, journalMode) {
          return store.request({ op: 'init', dbName, journalMode });
        },
        /** batch=0: 1 entry = 1 request(暗黙 tx 毎)。batch>0: bulkUpsertEntries で 1 tx に束ねる。 */
        async seed(n, batch) {
          await store.request({ op: 'openContainer', cid: 'bench', title: 'bench' });
          const t0 = performance.now();
          if (batch > 0) {
            for (let at = 0; at < n; at += batch) {
              const entries = [];
              for (let i = at; i < Math.min(n, at + batch); i++)
                entries.push(entryFor(i, 0));
              await store.request({ op: 'bulkUpsertEntries', cid: 'bench', entries });
            }
          } else {
            for (let i = 0; i < n; i++) {
              await store.request({ op: 'upsertEntry', cid: 'bench', entry: entryFor(i, 0) });
            }
          }
          return { ms: Math.round(performance.now() - t0) };
        },
        async metas() {
          const t0 = performance.now();
          const rows = await store.request({ op: 'listEntryMetas', cid: 'bench' });
          return { count: rows.length, ms: Math.round(performance.now() - t0) };
        },
        /** 各 entry に perEntry 件の revision snapshot(~1KB)をバッチ投入。 */
        async seedRevisions(n, perEntry, batch) {
          const t0 = performance.now();
          let buf = [];
          let total = 0;
          for (let i = 0; i < n; i++) {
            for (let r = 0; r < perEntry; r++) {
              buf.push({
                id: `r-${i}-${r}`,
                entryLid: 'e' + i,
                revOrder: r,
                snapshot: makeBody(i, -1 - r),
              });
              total++;
              if (buf.length >= batch) {
                await store.request({ op: 'bulkAddRevisions', cid: 'bench', revisions: buf });
                buf = [];
              }
            }
          }
          if (buf.length > 0)
            await store.request({ op: 'bulkAddRevisions', cid: 'bench', revisions: buf });
          return { total, ms: Math.round(performance.now() - t0) };
        },
        /** revision 件数(snapshot 非読込)と、単発の要求時読みの実測。 */
        async revisionStats(sampleId) {
          const t0 = performance.now();
          const rows = await store.request({ op: 'revisionCounts', cid: 'bench' });
          const countsMs = Math.round(performance.now() - t0);
          const totalRevisions = rows.reduce((a, r) => a + r.n, 0);
          const t1 = performance.now();
          const snap = await store.request({ op: 'getRevision', cid: 'bench', id: sampleId });
          const getMs = +(performance.now() - t1).toFixed(1);
          return {
            entriesWithRevisions: rows.length,
            totalRevisions,
            countsMs,
            sampleGetMs: getMs,
            sampleFound: snap !== null,
          };
        },
        /**
         * 編集セッション腕(user 指示⑤: boot 窓だけで測らない)。
         * k 回の編集を intervalMs 間隔で行う。save=false は対照群(Y 腕):
         * body 生成まで同一で、保存 request だけを発行しない。
         */
        async editSession(k, n, intervalMs, save) {
          const perOpMs = [];
          for (let i = 0; i < k; i++) {
            const idx = (i * 37) % n;
            const body = makeBody(idx, i + 1);
            const t0 = performance.now();
            if (save) {
              await store.request({
                op: 'upsertEntry',
                cid: 'bench',
                entry: {
                  lid: 'e' + idx,
                  title: 'entry ' + idx,
                  archetype: idx % 10 === 0 ? 'todo' : 'text',
                  body,
                  entryOrder: idx,
                  status: idx % 10 === 0 ? 'open' : null,
                  date: null,
                  archived: false,
                },
              });
            }
            perOpMs.push(performance.now() - t0);
            if (intervalMs > 0) await new Promise((r) => setTimeout(r, intervalMs));
          }
          const sorted = [...perOpMs].sort((a, b) => a - b);
          const pick = (q) => sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))];
          return {
            k,
            p50: +pick(0.5).toFixed(2),
            p95: +pick(0.95).toFixed(2),
            max: +sorted[sorted.length - 1].toFixed(2),
          };
        },
        async close() {
          await store.request({ op: 'close' });
          store.terminate();
          return null;
        },
      };
      document.getElementById('out').textContent = 'bench api ready';
    </script>
  </body>
</html>
