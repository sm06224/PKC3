<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>PKC3 store probe</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      import { StoreClient } from '/src/adapter/platform/storage/store-client.ts';

      async function run() {
        const store = new StoreClient();
        const steps = {};
        steps.init = await store.request({ op: 'init', dbName: 'pkc3-store-probe' });
        await store.request({ op: 'openContainer', cid: 'c1', title: 'probe' });
        await store.request({
          op: 'upsertEntry',
          cid: 'c1',
          entry: {
            lid: 'e1', title: 'todo sample', archetype: 'todo',
            body: '---\nstatus: open\ndate: 2026-08-01\n---\n\n# やること\n',
            entryOrder: 1, status: 'open', date: '2026-08-01', archived: false,
          },
        });
        await store.request({
          op: 'upsertEntry',
          cid: 'c1',
          entry: {
            lid: 'e2', title: 'note', archetype: 'text',
            body: '# PKC-Markdown 本文\n\n==ハイライト==', entryOrder: 2,
            status: null, date: null, archived: false,
          },
        });
        steps.metas = await store.request({ op: 'listEntryMetas', cid: 'c1' });
        steps.metaHasNoBody = steps.metas.every((m) => !('body' in m));
        steps.body = await store.request({ op: 'getBody', cid: 'c1', lid: 'e2' });
        steps.counts = await store.request({ op: 'counts', cid: 'c1' });
        // P3-6b: relations 書込・読出と deleteEntry の orphan 掃除(review #8)
        await store.request({
          op: 'bulkUpsertRelations',
          cid: 'c1',
          relations: [
            { id: 'r1', fromLid: 'e1', toLid: 'e2', kind: 'structural' },
            { id: 'r2', fromLid: 'e2', toLid: 'e1', kind: 'semantic' },
            { id: 'r3', fromLid: 'e2', toLid: 'e2', kind: 'semantic' },
          ],
        });
        // P5c で `bulkAddRevisions` は廃止 ── 履歴は**鎖として**積む
        // (全文で積む経路は持たない)。⚠ tip = entries.body と**違う**本文を
        // 渡さないと「変化なし」で見送られ、下の revisions 件数が合わなくなる
        steps.chain = await store.request({
          op: 'importRevisionChains',
          cid: 'c1',
          chains: [
            {
              entryLid: 'e1',
              snapshots: [{ body: 'old', createdAt: '2026-01-01T00:00:00.000Z' }],
            },
          ],
        });
        steps.relations = await store.request({ op: 'listRelations', cid: 'c1' });
        await store.request({ op: 'deleteEntry', cid: 'c1', lid: 'e1' });
        steps.countsAfterDelete = await store.request({ op: 'counts', cid: 'c1' });
        steps.relationsAfterDelete = await store.request({ op: 'listRelations', cid: 'c1' });
        // 🔴 **relations は deleteEntry では消えない**(実装は 2026-08-05 の #73 で
        //    そう変わった)。消すと**ゴミ箱から戻しても居場所が戻らない** ── 子を
        //    消して復元すると root へ出て、フォルダを消して復元すると中身が空になる。
        //    残しても木は壊れない(親が metas に居ない辺は無視されるので、ゴミ箱の
        //    間は子が root に出る)。最終処分は下の purgeTrash。
        //    ⚠ **この検定は 2026-08-06 まで旧い意味論のままで nightly を赤くしていた** ──
        //      実装が変わったのに検定が追いつかず、2 晩「本物のエラー」がそこに紛れた。
        // revisions は P5 から消さない: 既存 v1 + 削除時の trash snapshot = 2 件
        steps.orphanCleanOk =
          steps.relations.length === 3 &&
          steps.relationsAfterDelete.length === 3 &&
          steps.relationsAfterDelete.map((r) => r.id).join(',') === 'r1,r2,r3' &&
          steps.countsAfterDelete.revisions === 2;
        // P5: trash = 「entries に居ない entry_lid の最新 revision」ビュー
        steps.trash = await store.request({ op: 'listTrash', cid: 'c1' });
        const trashRow = steps.trash[0];
        steps.trashSnap = trashRow
          ? await store.request({ op: 'getRevision', cid: 'c1', id: trashRow.id })
          : null;
        steps.trashOk =
          steps.trash.length === 1 &&
          trashRow.entry_lid === 'e1' &&
          trashRow.rev_order === 2 &&
          trashRow.title === 'todo sample' &&
          steps.trashSnap !== null &&
          steps.trashSnap.title === 'todo sample' &&
          steps.trashSnap.body.includes('# やること');
        // P5c: 逆向き差分チェーン(checkpoint / amend / prune / 復元)を実 sqlite で
        const writeE2 = (body, checkpoint) => store.request({
          op: 'upsertEntry', cid: 'c1', checkpoint, keepLatest: 3,
          entry: { lid: 'e2', title: 'note', archetype: 'text', body,
                   entryOrder: 2, status: null, date: null, archived: false },
        });
        const bigBody = (mark) =>
          Array.from({ length: 300 }, (_, i) => (i === 7 ? `行 ${i} ${mark}\n` : `行 ${i}\n`)).join('');
        await writeE2(bigBody('v0'), false);
        for (const m of ['v1', 'v2', 'v3', 'v4']) await writeE2(bigBody(m), true);
        await writeE2(bigBody('v4') + '追記(amend)\n', false); // 履歴を伸ばさない
        steps.revMetas = await store.request({ op: 'listRevisionMetas', cid: 'c1', entryLid: 'e2' });
        steps.restored = [];
        for (const m of steps.revMetas) {
          const got = await store.request({ op: 'getRevision', cid: 'c1', id: m.id });
          steps.restored.push(got.body === bigBody(`v${m.rev_order - 1}`));
        }
        steps.chainOk =
          steps.revMetas.length === 3 && // keepLatest 3 で古い側が prune される
          steps.revMetas[0].rev_order === 4 &&
          steps.restored.every(Boolean) && // 全世代が byte 一致で戻る
          !('snapshot' in steps.revMetas[0]); // 一覧は本文を運ばない
        // P4b: asset GC の keep-set 走査(scanAssetRefs = raw substring 規則)。
        // 本文 asset: 参照 / frontmatter asset_key の両源が同じ規則で keep される
        await store.request({
          op: 'putAssetMeta', cid: 'c1',
          meta: { key: 'ast-keep-body', mime: 'image/png', size: 10, hash: null },
        });
        await store.request({
          op: 'putAssetMeta', cid: 'c1',
          meta: { key: 'ast-keep-fm', mime: 'image/png', size: 10, hash: null },
        });
        await store.request({
          op: 'putAssetMeta', cid: 'c1',
          meta: { key: 'ast-orphan', mime: 'image/png', size: 20, hash: null },
        });
        await store.request({
          op: 'upsertEntry', cid: 'c1',
          entry: {
            lid: 'e3', title: 'ref', archetype: 'text',
            body: '![x](asset:ast-keep-body)', entryOrder: 3,
            status: null, date: null, archived: false,
          },
        });
        await store.request({
          op: 'upsertEntry', cid: 'c1',
          entry: {
            lid: 'e4', title: 'att', archetype: 'attachment',
            body: '---\nattachment.name: a.png\nattachment.asset_key: ast-keep-fm\n---\n',
            entryOrder: 4, status: null, date: null, archived: false,
          },
        });
        steps.scan = await store.request({
          op: 'scanAssetRefs', cid: 'c1',
          candidates: ['ast-keep-body', 'ast-keep-fm', 'ast-orphan'],
        });
        steps.scanOk =
          steps.scan.referenced.length === 2 &&
          steps.scan.referenced.includes('ast-keep-body') &&
          steps.scan.referenced.includes('ast-keep-fm');
        // review F2: markdown escape 済みの生きた参照(backslash / 数値実体)も
        // keep される(raw substring に現れないが hydrate は成功する形)
        await store.request({
          op: 'upsertEntry', cid: 'c1',
          entry: {
            lid: 'e5', title: 'esc', archetype: 'text',
            body: '![a](asset:ast\\-esc-bs) ![b](asset:ast&#45;esc-ent)',
            entryOrder: 5, status: null, date: null, archived: false,
          },
        });
        steps.scanEsc = await store.request({
          op: 'scanAssetRefs', cid: 'c1',
          candidates: ['ast-esc-bs', 'ast-esc-ent'],
        });
        steps.scanEscOk =
          steps.scanEsc.referenced.length === 2 &&
          steps.scanEsc.referenced.includes('ast-esc-bs') &&
          steps.scanEsc.referenced.includes('ast-esc-ent');
        // P5: revisions(履歴 / ゴミ箱)だけが参照する asset も keep される
        await store.request({
          op: 'upsertEntry', cid: 'c1', checkpoint: true,
          entry: { lid: 'e3', title: 'ref', archetype: 'text',
                   body: '参照を消した本文', entryOrder: 3,
                   status: null, date: null, archived: false },
        });
        // tip からは消えたが古い版が参照している key ── 差分でも走査に現れる
        steps.scanRev = await store.request({
          op: 'scanAssetRefs', cid: 'c1', candidates: ['ast-keep-body'],
        });
        steps.scanRevOk =
          steps.scanRev.referenced.length === 1 &&
          steps.scanRev.referenced[0] === 'ast-keep-body';
        // P5: ゴミ箱を空にする ── 削除済み lid の revision だけ消える
        steps.countsBeforePurge = await store.request({ op: 'counts', cid: 'c1' });
        steps.purgeTrash = await store.request({ op: 'purgeTrash', cid: 'c1' });
        steps.countsFinal = await store.request({ op: 'counts', cid: 'c1' });
        steps.trashAfterPurge = await store.request({ op: 'listTrash', cid: 'c1' });
        steps.liveRevsAfterPurge =
          (await store.request({ op: 'listRevisionMetas', cid: 'c1', entryLid: 'e2' })).length;
        // 🔴 **relations の最終処分場はここ**(deleteEntry ではない)。
        //    参照の切れた r1 / r2 がここで消え、生きている r3 だけ残る。
        //    ⚠ 上の `orphanCleanOk`(消えないこと)と**対**にして初めて意味論が
        //      閉じる ── 片側だけ検定すると「どこでも消えない」実装でも通る。
        steps.relationsAfterPurge = await store.request({ op: 'listRelations', cid: 'c1' });
        steps.trashPurgeOk =
          steps.purgeTrash.purged === 2 && // e1 の v1 + 削除時 snapshot
          steps.countsFinal.revisions ===
            steps.countsBeforePurge.revisions - steps.purgeTrash.purged &&
          steps.trashAfterPurge.length === 0 &&
          steps.countsBeforePurge.relations === 3 && // 掃除の前は 3 本残っている
          steps.relationsAfterPurge.length === 1 &&
          steps.relationsAfterPurge[0].id === 'r3' &&
          steps.liveRevsAfterPurge === 3; // 生存 entry の履歴は残る
        await store.request({ op: 'deleteAssetMeta', cid: 'c1', key: 'ast-orphan' });
        steps.assetMetasAfter = await store.request({ op: 'listAssetMetas', cid: 'c1' });
        steps.assetGcOk =
          steps.assetMetasAfter.length === 2 &&
          !steps.assetMetasAfter.some((m) => m.key === 'ast-orphan');
        await store.request({ op: 'close' });
        store.terminate();
        // ok は各 step の検定に従属させる(true 固定だと runner の exit code が
        // 何も守らない ── probe は「印字」ではなく「検定」)
        return {
          ok:
            steps.metaHasNoBody === true &&
            steps.orphanCleanOk === true &&
            steps.trashOk === true &&
            steps.chainOk === true &&
            steps.scanOk === true &&
            steps.scanEscOk === true &&
            steps.scanRevOk === true &&
            steps.trashPurgeOk === true &&
            steps.assetGcOk === true,
          steps,
        };
      }

      run().then(
        (r) => { window.__PROBE_RESULT__ = r; document.getElementById('out').textContent = JSON.stringify(r, null, 2); },
        (e) => { window.__PROBE_RESULT__ = { ok: false, error: String(e) }; document.getElementById('out').textContent = String(e); },
      );
    </script>
  </body>
</html>
