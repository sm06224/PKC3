<!doctype html>
<html lang="ja" data-pkc-app="pkc3">
  <head>
    <meta charset="utf-8" />
    <title>PKC3 place-embed probe</title>
  </head>
  <body>
    <div data-pkc-slot="root">booting…</div>
    <script type="module">
      /**
       * #529 W3-③ ── 板に N 枚置いた板の定常を測る台(`run-place-embed-probe.mjs` が駆動する)。
       *
       * 🔑 台の次元(ゼロ件にしない): 本文の長さ 3 通り(短い / 中 / **切る量を超える**)・図(mermaid)・
       *   本文の中の添付画像・**画像の添付ノート**を置く。N は URL の `n`(10 / 40 / 100 …)。
       *   これは**計器の台**で、アプリの設定ではない。
       * ⚠ 毎回新しい profile で起動する前提(seed は空の DB にだけ入れる)。
       */
      const q = new URLSearchParams(location.search);
      const N = Number(q.get('n') ?? 40);
      /** 台の中身の絞り込み(`all` / `text` = 文だけ / `fig` = 図を足す / `img` = 画像を足す)。原因の切り分け用。 */
      const MIX = q.get('mix') ?? 'all';
      const WITH_FIG = MIX === 'all' || MIX === 'fig';
      const WITH_IMG = MIX === 'all' || MIX === 'img';
      const { StoreClient } = await import('/src/adapter/platform/storage/store-client.ts');
      const { AssetBlobStore } = await import('/src/adapter/platform/storage/asset-blob-store.ts');
      const { attachmentBody } = await import('/src/features/flavor/attachment-flavor.ts');

      /** ノイズの PNG(圧縮が効かない = 実寸に近い bytes)。件ごとに違う。 */
      async function noisePng(seed, w = 240, h = 180) {
        const c = new OffscreenCanvas(w, h);
        const ctx = c.getContext('2d');
        const img = ctx.createImageData(w, h);
        let s = (seed * 2654435761 + 12345) >>> 0;
        for (let i = 0; i < img.data.length; i += 4) {
          s = (s * 1664525 + 1013904223) >>> 0;
          img.data[i] = s & 0xff;
          img.data[i + 1] = (s >>> 8) & 0xff;
          img.data[i + 2] = (s >>> 16) & 0xff;
          img.data[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        return await c.convertToBlob({ type: 'image/png' });
      }

      const para = (i, k) =>
        `パラグラフ ${i}-${k}: PKC-Markdown の本文。**強調** と \`code\` を含む行で、板に置いたときの読みやすさを見る。\n`;
      const DIAGRAM = '```mermaid\ngraph TD\n  A["始め"]-->B["途中"]\n  B-->C["終わり"]\n```\n';

      /** i 番目の置くノートの本文。短い / 中 / 長い(4000 字を超える)を回す。 */
      function bodyOf(i) {
        const size = i % 3; // 0 短い / 1 中 / 2 長い
        const reps = size === 0 ? 4 : size === 1 ? 18 : 80;
        let b = `# ノート ${i}\n\n`;
        if (WITH_FIG && i % 4 === 1) b += DIAGRAM + '\n';
        if (WITH_IMG && i % 5 === 2) b += '![写真](asset:imgref)\n\n';
        b += '| 品 | 数 |\n|---|---|\n| りんご | 120 |\n| みかん | 80 |\n\n- [ ] 買う\n- [x] 済み\n\n';
        for (let k = 0; k < reps; k++) b += para(i, k);
        return b;
      }

      const blobs = new AssetBlobStore();
      const seeder = new StoreClient();
      await seeder.request({ op: 'init', dbName: 'pkc3' });
      await seeder.request({ op: 'openContainer', cid: 'default', title: 'PKC3' });
      const counts = await seeder.request({ op: 'counts', cid: 'default' });
      if (counts.entries === 0) {
        await blobs.put('default', 'imgref', await noisePng(7, 200, 150));
        const entries = [];
        let block = '';
        for (let i = 0; i < N; i++) {
          const lid = `p${i}`;
          const isAtt = WITH_IMG && i % 8 === 7;
          if (isAtt) {
            await blobs.put('default', `att${i}`, await noisePng(100 + i));
            entries.push({
              lid,
              title: `写真 ${i}`,
              archetype: 'attachment',
              body: attachmentBody({ name: `写真${i}.png`, mime: 'image/png', size: 90000, assetKey: `att${i}` }) + '\n説明',
              entryOrder: i + 1,
              status: null,
              date: null,
              archived: false,
            });
          } else {
            entries.push({
              lid,
              title: `ノート ${i}`,
              archetype: 'text',
              body: bodyOf(i),
              entryOrder: i + 1,
              status: null,
              date: null,
              archived: false,
            });
          }
          const x = (i % 4) * 340 + 10;
          const y = Math.floor(i / 4) * 260 + 10;
          block += `:::format{#b${i} .pkc-place entry=${lid} x=${x} y=${y}}\n:::\n\n`;
        }
        entries.push({
          lid: 'board',
          title: 'ボード',
          archetype: 'text',
          body: block,
          entryOrder: 0,
          status: null,
          date: null,
          archived: false,
        });
        await seeder.request({ op: 'bulkUpsertEntries', cid: 'default', entries });
      }
      await seeder.request({ op: 'close' });
      seeder.terminate();
      blobs.close();
      window.__PROBE_N__ = N;
      window.__BOOT_T0__ = performance.now();
      await import('/src/main.ts');
    </script>
  </body>
</html>
