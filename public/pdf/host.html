<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF — PKC3</title>
<link rel="icon" href="data:,">
<!--
  PDF を **PKC3 の画面で読む別窓**(#275 段①。裁定: 設定で選んだ人だけ。既定はブラウザ内蔵の表示)。

  ## この file は bundle しない
  `public/` に置いた素の HTML である(Office の `public/office/host.html` と同じ作り)。
  ⚠ 窓の URL を固定したい(本体の hash 付き chunk 名に引きずられない)/ pdf.js の実体は
  `pdf/lib/` に**ビルド時に写される**(`build/pdf-assets-plugin.ts`。precache には載らない ──
  押したときだけ取りに行く)。
  ⚠ したがってここに書く JS は素の DOM API だけ(TypeScript も bundler の import も無し)。

  ## 窓の中の約束
  - **窓の生死 = 計算の生死**。解析は pdf.js の worker が窓の中で行い、窓を閉じれば worker も消える。
    使われない間(60 秒)も worker を畳む(`doc-lease.js`)── 描いた頁の絵は残り、まだ描いていない頁を描くときだけ開き直す。
  - **頁は PNG の `<img>` 1 枚**(描いたら焼く)。見えている頁の前後 2 頁だけ持ち、外れたら即 revoke。
  - **ページの一覧**(#275 段②-1a)は窓の左に固定幅(120px)。一覧の中で見えている頁の前後だけ、小さな PNG に焼き、外れたら即 revoke。
  - **ページの編集**(#275 段②-1b)は一覧の中で並べ替え・回す・外す。保存を押したときだけ、窓の中の使い捨ての worker
    (`edit-worker.js`。使われなければ畳む)が**新しい PDF**を作り、OPFS の棚へ置いて本体へ知らせる。元の PDF は書き換えない。
  - **ページの抜き出し**(#275 段②-1c)は、一覧で選んだページだけを新しい PDF にする(同じ worker・同じ棚・同じ門)。
  - **ハイライト**(#275 段②-2)は、字を選んで「ハイライト」+ 色(黄・緑・青・ピンク)で付け、付いたハイライト(他のアプリで付けた物も)を
    押して「ハイライトを外す」。保存はページの編集と**同じ 1 本**(同じ worker・同じ棚・同じ門)で、新しい PDF の添付になる。元の PDF は変わらない。
  - **付箋とペン**(#275)は、上のバーの「付箋」でページのどこかを押して字を入れ(Enter で付ける・Esc でやめる)、「ペン」でページの上をなぞる。
    付いた付箋は小さな印で、重ねると字が出て、押すと「直す / 外す」。保存はハイライトと**同じ 1 本**(PDF 本来の注釈 `/Text` と `/Ink` として新しい PDF に書く)。
  - **書くのは本体**。この窓は選んだ字と頁番号を**放送で送るだけ**(ノートへは触れない)。
  - 読めなかったら、ブラウザ内蔵の表示へ**自動で退避**する(断り文は出さない)。

  textLayer の規則は pdf.js の `web/pdf_viewer.css`(Apache-2.0)から必要な分だけ写した。
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1b1b1b; color: #ddd;
    font: 13px system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif; }
  /* 帯の高さは窓の中で測る(`--bar-h`)。ボタンが増えて 1 行に収まらないときは、2 行に折り返す
     (右端の「ノートへ引用する」が窓の外へ切れて押せなくならない)。1 行に収まる広さなら今までと同じ 38px */
  #bar { position: fixed; inset: 0 0 auto 0; min-height: 38px; box-sizing: border-box; display: flex; flex-wrap: wrap;
    gap: 4px 6px; align-items: center; padding: 4px 10px; background: #000c; z-index: 10; white-space: nowrap }
  #bar .sp { flex: 1 }
  #bar button { font: inherit; cursor: pointer; background: #333; color: #eee; border: 1px solid #555;
    border-radius: 3px; padding: 3px 9px }
  #bar button:disabled { opacity: .45; cursor: default }
  #bar input { font: inherit; background: #222; color: #eee; border: 1px solid #555; border-radius: 3px;
    padding: 3px 6px }
  #pageno { width: 3.4em; text-align: right }
  /* 帯が狭いときは、検索の欄が縮む(「別の PDF として保存」が出ても、右端の「ノートへ引用する」が切れない) */
  #query { width: 11em; min-width: 5em }
  /* 結果の一言は窓の下に出す(帯に置くと字が切れて「何頁へ引いたか」が読めない) */
  #status { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 12;
    max-width: 80%; padding: 6px 14px; border-radius: 4px; background: #000d; color: #eee;
    pointer-events: none }
  #status:empty { display: none }
  #bar button[aria-pressed="true"] { background: #3d5a80; border-color: #8ab4ff }
  /* ハイライトの色のボタン(#275 段②-2b)。背景の色は窓の JS が色の表から付ける。押された色は白い枠で見分ける
     (⚠ 上の `aria-pressed` の青は背景を塗るので、色のボタンには使わない) */
  #bar button.swatch { width: 22px; height: 22px; padding: 0; border: 2px solid #555; border-radius: 50% }
  #bar button.swatch[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px #000, 0 0 0 3px #fff }
  /* 付けたハイライトの層(絵の上・字の層の下。押せるかどうかは窓の JS が位置で調べる) */
  .hl-layer { position: absolute; inset: 0; pointer-events: none }
  .hl-layer > div { position: absolute; box-sizing: border-box }
  .hl-layer > [data-pkc-field="pdf-highlight-new"] { mix-blend-mode: multiply }
  /* 外すと決めた(元から付いていた)ハイライト: 薄く覆って破線で囲む */
  .hl-layer > [data-pkc-removed="true"] { outline: 2px dashed #d33; background: rgba(255, 255, 255, .55) }
  #hl-pop { position: fixed; z-index: 20; padding: 4px; background: #000e; border: 1px solid #555; border-radius: 4px }
  #hl-pop[hidden] { display: none }
  /* 付箋とペン(#275)。道具を選んでいる間だけ、ページの上に押さえの層を敷く(字の選びより優先)。付箋の印は層の上 */
  .tool-layer { position: absolute; inset: 0; z-index: 3; display: none; touch-action: none }
  body[data-pkc-pdf-tool="note"] .tool-layer { display: block; cursor: crosshair }
  body[data-pkc-pdf-tool="pen"] .tool-layer { display: block; cursor: crosshair }
  .ink-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: visible }
  .note-layer { position: absolute; inset: 0; z-index: 4; pointer-events: none }
  .note-layer > div { position: absolute; box-sizing: border-box; pointer-events: auto; cursor: pointer }
  /* 付けた付箋の印(薄い黄の紙。元から付いていた付箋は絵に焼かれているので透明で重ね、押せるだけにする) */
  .note-layer > [data-pkc-field="pdf-note-new"] { background: #fff5a0; border: 1px solid #5a4d1a; border-radius: 2px;
    background-image: linear-gradient(#5a4d1a, #5a4d1a), linear-gradient(#5a4d1a, #5a4d1a), linear-gradient(#5a4d1a, #5a4d1a);
    background-size: 60% 1px, 60% 1px, 60% 1px; background-position: 50% 30%, 50% 50%, 50% 70%; background-repeat: no-repeat }
  .note-layer > [data-pkc-removed="true"] { outline: 2px dashed #d33; background: rgba(255, 255, 255, .55) }
  #note-pop { position: fixed; z-index: 20; display: flex; gap: 4px; padding: 4px; background: #000e; border: 1px solid #555; border-radius: 4px }
  #note-pop[hidden] { display: none }
  #note-pop button { font: inherit; cursor: pointer; background: #333; color: #eee; border: 1px solid #555;
    border-radius: 3px; padding: 3px 9px }
  #note-input-wrap { position: fixed; z-index: 25; padding: 4px; background: #000e; border: 1px solid #555; border-radius: 4px }
  #note-input-wrap[hidden] { display: none }
  #note-input { font: inherit; width: 18em; max-width: 60vw; background: #222; color: #eee; border: 1px solid #555;
    border-radius: 3px; padding: 3px 6px }
  #note-tip { position: fixed; z-index: 22; max-width: 24em; padding: 4px 8px; background: #000e; color: #eee;
    border: 1px solid #555; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none }
  #note-tip[hidden] { display: none }
  #hl-pop button { font: inherit; cursor: pointer; background: #333; color: #eee; border: 1px solid #555;
    border-radius: 3px; padding: 3px 9px }
  /* 「PDF を足す」の足し方の選び(添付から / パソコンのファイルから)。押した位置の下に出す */
  #append-menu { position: fixed; z-index: 30; display: flex; flex-direction: column; gap: 2px; min-width: 14em; max-width: 24em;
    padding: 4px; background: #000e; border: 1px solid #555; border-radius: 4px }
  #append-menu[hidden], #append-pick[hidden] { display: none }
  #append-menu button { font: inherit; cursor: pointer; background: #333; color: #eee; border: 1px solid #555;
    border-radius: 3px; padding: 4px 9px; text-align: left }
  #append-menu button:hover { background: #3d5a80 }
  #append-pick { display: flex; flex-direction: column; gap: 2px; max-height: 50vh; overflow-y: auto; margin-top: 4px;
    padding-top: 4px; border-top: 1px solid #444 }
  #append-pick .append-item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  #append-pick .append-note { padding: 4px 6px; color: #bbb }
  #scroller { position: fixed; inset: var(--bar-h, 38px) 0 0 0; overflow: auto }
  /* 編集中の案内の 1 行(#275 段②-1b)。出ている間は、その分だけ下の面を下げる */
  #edit-bar { position: fixed; inset: var(--bar-h, 38px) 0 auto 0; min-height: 26px; box-sizing: border-box; display: flex;
    gap: 2px 8px; align-items: center; flex-wrap: wrap; padding: 3px 10px; background: #2b2a1c; border-bottom: 1px solid #5c5a2e;
    color: #e6e2b8; z-index: 9; line-height: 1.4 }
  #edit-bar[hidden] { display: none }
  #edit-note { flex: 1 }
  /* 引き継がれない物の行(元にあるときだけ。別の行に出す) */
  #edit-warn { flex: 0 0 100% }
  #edit-warn[hidden] { display: none }
  #edit-bar button, #edit-save { font: inherit; cursor: pointer; background: #333; color: #eee;
    border: 1px solid #555; border-radius: 3px; padding: 2px 9px }
  #edit-save[hidden] { display: none }
  /* ⚠ `#bar button` より強く書く(同じ強さだと後ろの規則に負けて、保存ボタンが他のボタンと見分けられない) */
  #bar #edit-save { background: #3d5a80; border-color: #8ab4ff }
  #edit-unpick[hidden], #edit-reset[hidden] { display: none }
  #extract:disabled { opacity: .45; cursor: default }
  #edit-save:disabled, #edit-bar button:disabled { opacity: .45; cursor: default }
  /* 案内の高さは窓の中で測る(`--edit-bar-h`。折り返しても重ならない) */
  body[data-pkc-pdf-edited="on"] #scroller, body[data-pkc-pdf-edited="on"] #plist, body[data-pkc-pdf-edited="on"] #msg {
    top: calc(var(--bar-h, 38px) + var(--edit-bar-h, 26px)) }
  /* ページの一覧(#275 段②-1a)。幅は固定の小ささ(読む幅を奪わない)。出し入れは帯のボタン */
  #plist { position: fixed; inset: var(--bar-h, 38px) auto 0 0; width: 120px; overflow-y: auto; overflow-x: hidden;
    box-sizing: border-box; padding: 8px 0 24px; background: #151515; border-right: 1px solid #333;
    display: none; flex-direction: column; align-items: center; gap: 8px }
  body[data-pkc-pdf-list="on"] #plist { display: flex }
  body[data-pkc-pdf-list="on"] #scroller, body[data-pkc-pdf-list="on"] #msg { left: 120px }
  /* 一覧の下に、使い方の 1 行を常に出す(触れないと出ない ↻ × の存在を、触れる前に知らせる) */
  #plist-hint { position: fixed; left: 0; bottom: 0; width: 120px; height: 112px; box-sizing: border-box;
    padding: 6px 8px; background: #151515; border-top: 1px solid #333; border-right: 1px solid #333;
    color: #9a9a9a; font-size: 11px; line-height: 1.45; display: none; z-index: 3 }
  body[data-pkc-pdf-list="on"] #plist-hint { display: block }
  body[data-pkc-pdf-list="on"] #plist { bottom: 112px }
  #plist { user-select: none; -webkit-user-select: none }
  /* 1 行 = 項目のボタン + ↻ と ×(ページの編集。#275 段②-1b)。↻ × は触れる間だけ出す */
  .thumb-cell { position: relative; flex: none; width: 104px; border-radius: 4px }
  .thumb-cell[hidden] { display: none }
  /* 外したページ(#1663)。一覧の最後に薄い枠で残し、1 ページずつ戻せる */
  .removed-list { flex: none; width: 104px; display: flex; flex-direction: column; gap: 6px; margin-top: 4px;
    padding-top: 8px; border-top: 1px dashed #444 }
  .removed-list[hidden] { display: none }
  .removed-head { font-size: 11px; color: #8a8a8a }
  .thumb-ghost { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center;
    justify-content: space-between; gap: 4px; width: 104px; padding: 6px 8px; border: 1px dashed #555;
    border-radius: 4px; color: #8a8a8a; font-size: 11px; opacity: .8 }
  .thumb-ghost:hover { opacity: 1; border-color: #8ab4ff; color: #cfe0ff }
  .thumb-ghost:focus-visible { outline: 2px solid #8ab4ff; opacity: 1 }
  .thumb-ghost-act { color: #8ab4ff }
  .thumb-act { all: unset; box-sizing: border-box; cursor: pointer; position: absolute; top: 6px; width: 22px;
    height: 22px; line-height: 22px; text-align: center; border-radius: 3px; background: #000b; color: #eee;
    font-size: 14px; opacity: .55; z-index: 2 }
  .thumb-turn { right: 32px }
  .thumb-drop { right: 8px }
  .thumb-up { left: 8px }
  .thumb-down { left: 32px }
  /* 選ぶチェック(#1626)。×の下。キーを押せない端末でも、ページを選べる */
  .thumb-pick { right: 8px; top: 32px }
  /* 足した PDF の見出し(その PDF の最初のページの前)と、足したページの絵の下の元の PDF の名前 */
  .src-head { flex: none; width: 104px; box-sizing: border-box; display: flex; align-items: center; gap: 2px; padding: 3px 4px;
    background: #26354d; border-radius: 3px; color: #cfe0ff; font-size: 11px; line-height: 1.3 }
  .src-head-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .src-head-drop { all: unset; box-sizing: border-box; cursor: pointer; flex: none; width: 18px; height: 18px; line-height: 18px;
    text-align: center; border-radius: 3px; background: #000b; color: #eee; font-size: 13px }
  .src-head-drop:hover { background: #8a2b2b }
  .src-head-drop:focus-visible { outline: 2px solid #8ab4ff }
  .thumb-src { display: block; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; color: #8fa6c8 }
  .thumb-cell:hover .thumb-act, .thumb-cell:focus-within .thumb-act { opacity: 1 }
  .thumb-act:hover { background: #3d5a80 }
  .thumb-act:focus-visible { outline: 2px solid #8ab4ff; opacity: 1 }
  /* ドラッグ中: 動かしているページは薄く、入る場所には線を出す */
  .thumb-cell[data-pkc-dragging="true"] { opacity: .45 }
  .thumb-cell[data-pkc-drop="before"] { box-shadow: 0 -5px 0 -2px #8ab4ff }
  .thumb-cell[data-pkc-drop="after"] { box-shadow: 0 5px 0 -2px #8ab4ff }
  .thumb { all: unset; box-sizing: border-box; cursor: pointer; flex: none; width: 104px; padding: 4px 4px 3px;
    border: 2px solid transparent; border-radius: 4px; text-align: center; color: #aaa; font-size: 11px }
  .thumb:hover { background: #262626 }
  /* 選んだページ(#275 段②-1c)。いまの頁の青い枠とは別の色(橙)の枠と地で、重なっても両方読める */
  .thumb-cell[data-pkc-selected="true"] { outline: 2px solid #f0b44c; outline-offset: 0 }
  .thumb-cell[data-pkc-selected="true"] .thumb { background: #4a3a14; color: #fff }
  .thumb-cell[data-pkc-selected="true"] .thumb[aria-current="true"] { background: #4a3a14 }
  .thumb:focus-visible { outline: 2px solid #8ab4ff }
  .thumb[aria-current="true"] { border-color: #8ab4ff; background: #26354d; color: #fff }
  .thumb-img { display: block; width: 94px; margin: 0 auto 3px; background: #fff; box-shadow: 0 0 0 1px #0006 }
  .thumb-img img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none;
    pointer-events: none }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0 40px }
  .page { position: relative; background: #fff; box-shadow: 0 0 0 1px #0006; flex: none }
  .page img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none;
    pointer-events: none }
  #msg { position: fixed; inset: var(--bar-h, 38px) 0 0 0; display: grid; place-content: center; text-align: center;
    padding: 24px; line-height: 1.8; opacity: .85 }
  #msg[hidden] { display: none }
  object { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #1b1b1b }

  /* pdf.js の textLayer(`web/pdf_viewer.css` から必要な分)。字は透明で、選べるだけにする */
  .textLayer { color-scheme: only light; position: absolute; text-align: initial; inset: 0;
    overflow: clip; opacity: 1; line-height: 1; letter-spacing: normal; word-spacing: normal;
    forced-color-adjust: none; transform-origin: 0 0; caret-color: CanvasText; z-index: 0;
    --min-font-size: 1; --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
    --min-font-size-inv: calc(1 / var(--min-font-size)); --scale-round-x: 1px; --scale-round-y: 1px }
  .textLayer :is(span, br) { color: transparent; position: absolute; white-space: pre; cursor: text;
    transform-origin: 0% 0%; user-select: text; -webkit-user-select: text }
  .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) {
    z-index: 1; --font-height: 0; font-size: calc(var(--text-scale-factor) * var(--font-height));
    --scale-x: 1; --rotate: 0deg;
    transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv)) }
  .textLayer .markedContent { display: contents }
  .textLayer ::selection { background: rgba(80, 140, 255, .4) }
  /* 検索の一致。span の中の一致した範囲だけ(またがる一致は span ごとに 1 つずつ。`text-hits.js`)。
     ⚠ `<mark>` にするのは、`.textLayer :is(span, br)` の規則(絶対配置)に巻き込まれないため */
  .textLayer mark.hit { color: transparent; background: rgba(255, 210, 0, .45) }
  /* いま見ている一致(#1663)。ほかの一致の黄色より濃い橙 */
  .textLayer mark.hit.cur { background: rgba(255, 120, 0, .75) }
</style>
</head>
<body>
<div id="bar">
  <button id="toggle-list" type="button" aria-pressed="true" disabled title="ページの一覧を出したり隠したりします">ページの一覧</button>
  <button id="zoom-out" type="button" title="小さくする">−</button>
  <button id="zoom-in" type="button" title="大きくする">＋</button>
  <button id="zoom-fit" type="button" title="ウィンドウの幅に合わせる">幅に合わせる</button>
  <button id="prev" type="button" title="前のページへ">前のページ</button>
  <input id="pageno" type="text" inputmode="numeric" aria-label="ページ">
  <span id="pagecount"></span>
  <button id="next" type="button" title="次のページへ">次のページ</button>
  <input id="query" type="search" placeholder="文書内を検索" aria-label="文書内を検索">
  <button id="hit-prev" type="button" title="前の一致へ">前の一致</button>
  <button id="hit-next" type="button" title="次の一致へ">次の一致</button>
  <span id="hits"></span>
  <span class="sp"></span>
  <button id="append-pdf" type="button" disabled aria-haspopup="true" aria-expanded="false" title="別の PDF を選んで、そのページをこの PDF の後ろに足します(添付から、またはパソコンのファイルから選べます)。「別の PDF として保存」で新しい添付になります(元の PDF は変わりません)">PDF を足す</button>
  <input id="append-file" type="file" accept="application/pdf,.pdf" hidden>
  <button id="edit-save" type="button" hidden title="並べ替え・回転・外したページを反映した、新しい PDF を添付に加えます(元の PDF は変わりません)">別の PDF として保存</button>
  <button id="extract" type="button" disabled title="一覧で選んだページ(Ctrl(Mac は ⌘)+クリック・Shift+クリックで複数)だけを、新しい PDF として添付に加えます(元の PDF は変わりません)">選んだページを別の PDF にする</button>
  <button id="note-tool" type="button" disabled aria-pressed="false" title="ページのどこかを押して、そこに付箋を付けます(字の無いページにも付けられます)。もう一度押すと付箋をやめます">付箋</button>
  <button id="pen-tool" type="button" disabled aria-pressed="false" title="ページの上をなぞって線を書きます(色は右の丸いボタンで選びます)。もう一度押すとペンをやめます">ペン</button>
  <button id="hl-apply" type="button" disabled title="選んだ字にハイライトを付けます(色は右の丸いボタンで選びます)。付いたハイライトを押すと「ハイライトを外す」が出ます">ハイライト</button>
  <button id="quote" type="button" disabled title="選んだ字を、ページ番号つきで引用します(この PDF につながっているノートがあればそちらの末尾、無ければ添付のノートの末尾)">ノートへ引用する</button>
</div>
<div id="edit-bar" hidden><span id="edit-note"></span><button id="edit-reset" type="button" title="まだ保存していない変更(並べ替え・回転・外したページ・ハイライト・付箋・ペンの線)を、すべて元に戻します">変更を元に戻す</button><button id="edit-unpick" type="button" title="一覧で選んだページの選びを、すべて外します(一覧の項目で Esc でも外せます)">選びを外す</button><span id="edit-warn" hidden></span></div>
<div id="plist-hint">ドラッグか ↑↓ で並べ替え・↻ で回す・× で外す・Ctrl(Mac は ⌘)+クリックで選ぶ</div>
<nav id="plist" aria-label="ページの一覧"></nav>
<div id="scroller"><div id="pages"></div></div>
<div id="append-menu" hidden><button id="append-from-note" type="button" title="このコレクションの添付にある PDF から選びます">添付から選ぶ…</button><button id="append-from-file" type="button" title="パソコンにある PDF のファイルを選びます">パソコンのファイルを選ぶ…</button><div id="append-pick" hidden></div></div>
<div id="hl-pop" hidden><button id="hl-remove" type="button">ハイライトを外す</button></div>
<div id="note-pop" hidden><button id="note-edit" type="button">直す</button><button id="note-remove" type="button">外す</button></div>
<div id="note-input-wrap" hidden><input id="note-input" type="text" maxlength="1000" autocomplete="off" aria-label="付箋の字" placeholder="付箋の字(Enter で付ける・Esc でやめる)"></div>
<div id="note-tip" hidden></div>
<div id="status" role="status"></div>
<div id="msg">読み込んでいます…</div>

<script src="./doc-lease.js"></script>
<script src="./text-hits.js"></script>
<script src="./page-list.js"></script>
<script src="./page-edit.js"></script>
<script src="./highlight.js"></script>
<script src="./notes.js"></script>

<script type="module" src="./reader.js"></script>
