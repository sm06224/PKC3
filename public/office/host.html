<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office — PKC3</title>
<link rel="icon" href="data:,">
<!--
  Office(LibreOffice wasm)を動かす**別窓**(#88 / 統合設計 O2)。

  🔴 user 裁定 2026-08-10「別タブでも構いません / 見やすければいいのだ /
     同じ窓にこだわると、PKC の編集をしながら資料を読むとかできませんし」。

  ## なぜ別窓なのか(要点だけ。詳細は設計 doc §3)
  - LO は **worker へ出せない**(Qt6 の wasm plugin が DOM を直に触る)
  - 常駐 **780MB**。開いている間だけの費用にするには、**realm ごと捨てられる境界**が要る
  - iframe は同じ process を共有しうるので、LO が重い間は本体の描画も詰まる

  ## この file は bundle しない
  `public/` に置いた**素の HTML**である。理由は 2 つ:
  - 一式(soffice.js / qtloader.js / wasm / data)は **IndexedDB から**読む。
    ビルド時に解決するものが何も無い
  - 窓の URL を固定したい(本体の hash 付き chunk 名に引きずられない)
  ⚠ したがってここに書く JS は**素の DOM API だけ**で書く(TypeScript も import も無し)。
-->
<style>
  :root { color-scheme: light dark; }
  html,body { margin:0; padding:0; height:100%; overflow:hidden;
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif; background:#fff; }
  @media (prefers-color-scheme: dark) { html,body { background:#141414; color:#e8e8e8 } }
  #bar { position:fixed; inset:0 0 auto 0; height:34px; display:flex; gap:10px; align-items:center;
    padding:0 10px; font-size:12px; border-bottom:1px solid #8884; z-index:10 }
  #bar b { font-weight:600 } .sp { flex:1 }
  #status { opacity:.75; font-variant-numeric: tabular-nums }
  #screen { position:fixed; inset:34px 0 0 0 }
  #msg { position:fixed; inset:34px 0 0 0; display:grid; place-content:center; text-align:center;
    padding:24px; gap:10px; opacity:.85; line-height:1.8; z-index:20 }
  /* 🔴 **これが無いと `msgEl.hidden = true` が効かない。** id セレクタ(1,0,0)の
     `display:grid` が UA の `[hidden]{display:none}`(0,1,0)に勝つので、
     属性は付くのに**消えない** ── LO の窓の外側は透明なので、
     「読み込んでいます…」が版面の脇に透けて出続けていた(実機で確認)。 */
  #msg[hidden] { display:none }
  /* 版面の上でドラッグすると、LO の選択ではなく**このページの文字**が選ばれる。
     ⚠ ただし停止時の理由は写したいので、`#msg` の中だけは選べるままにする。 */
  body { user-select:none; -webkit-user-select:none }
  #msg { user-select:text; -webkit-user-select:text }
  #msg .why { opacity:.7; font-size:12px; max-width:60ch; word-break:break-word }
  #msg button, #warn button { font:inherit; padding:6px 14px; border-radius:6px;
    border:1px solid #8886; background:transparent; color:inherit; cursor:pointer }
  /* 「止まってはいないが、命令が通らない」ことを知らせる帯(#124)。
     ⚠ 版面は触れるままにする ── 本文を読んで写せる状態は残す。
     地は無彩色、注意の色は**この帯だけ**に使う(業務画面の方針)。

     🔴 **下に出す。** 上に出すと LO のメニューバーを覆う(実測: 帯 `[0,34,1200,38]` と
     版面 `[0,34,…]` が同じ y から始まり、File / Edit の文字が半分欠けた)。
     ⚠ **`#screen` を下げて避けるのは駄目** ── 器の高さが変わると Qt に resize が飛び、
     **既に壊れている LO がそれを処理できる保証が無い**。覆う場所を変えるほうが安い。
     🔑 下端は LO のステータスバーだが、この状態ではもう読む価値が無い。 */
  #warn { position:fixed; inset:auto 0 0 0; z-index:15; display:flex; gap:12px;
    align-items:center; justify-content:center; padding:6px 12px; font-size:13px;
    background:#7a4b00; color:#fff }
  #warn[hidden] { display:none }
  #warn button { border-color:#fff8; color:#fff; padding:2px 10px }
</style>
</head>
<body>
<div id="bar"><b>Office</b><span id="name"></span><span class="sp"></span><span id="status">準備中…</span></div>
<div id="msg">読み込んでいます…</div>
<div id="warn" hidden></div>
<div id="screen" hidden></div>
<script>
(function () {
  'use strict';
  var DB_NAME = 'pkc3-office-pack';
  var statusEl = document.getElementById('status');
  var msgEl = document.getElementById('msg');
  var nameEl = document.getElementById('name');
  var screenEl = document.getElementById('screen');
  function setStatus(s) { statusEl.textContent = s; }
  function fail(s) {
    msgEl.textContent = s;
    msgEl.hidden = false;
    // ⚠ **版面を退ける。** `#screen` は `#msg` と同じ矩形なので、出したままだと
    //    理由が読めない(起動を諦めた後に版面は要らない)
    screenEl.hidden = true;
    setStatus('失敗');
  }

  // ── 本体との往復は **BroadcastChannel**(同一 origin の放送)──────────────
  //
  // 🔴 この窓は **noopener** で開かれる。理由は実測(2026-08-11):
  //    opener 付きだと本体と**同じ renderer process**に入り、閉じても常駐が
  //    **21% しか還らない**。noopener なら別 process になり **99% 還る**。
  //    ⚠ 代償として `window.opener` が無い ── だから放送で話す。
  var ch = new BroadcastChannel('pkc3-office');
  function say(type, payload) {
    try { ch.postMessage({ pkc3Office: type, payload: payload || {} }); } catch (e) { /* 閉じた */ }
  }
  // 生存通知。本体はこれを見て「もう開いている」を判断する(2 つ立てない)
  var beat = setInterval(function () { say('alive'); }, 1500);
  say('alive');

  ch.onmessage = function (ev) {
    var d = ev && ev.data;
    if (!d || !d.pkc3Office) return;
    if (d.pkc3Office === 'close-request') { window.close(); return; }
    if (d.pkc3Office === 'focus-request') {
      // ⚠ 背面タブの self-focus は**ブラウザ判断で無視されうる**。
      //    黙って何も起きないことがあるのは仕様 ── 本体側もそう伝える
      try { window.focus(); } catch (e) { /* 無視される */ }
      return;
    }
    if (d.pkc3Office === 'reload-request') {
      var q = d.payload && d.payload.name
        ? '?name=' + encodeURIComponent(d.payload.name) + '&await-doc=1' : '?await-doc=1';
      location.replace('host.html' + q);
    }
  };

  // ── 異常終了を**見える形にする**(#117)──────────────────────────────
  //
  // 🔴 これが無いと、user には「固まった」としか分からない。実測(調査 2026-08-12):
  //    LO が abort しても**最後に描かれたフレームがそのまま残り**、上部バーは
  //    「表示中 (1.8 秒)」のまま。クリックもタイプも効かないのに**見た目は正常**。
  //    ⚠ 「バグだらけ」という印象の相当部分がこれである。
  //
  // ⚠ 生存通知(`beat`)は**止めない** ── 止めると本体が「閉じた」と判断して
  //    2 つ目の窓を開く(1 窓 約 750MB)。停止したことは `crashed` で別に言う。
  var tick = null;
  var dead = false;
  function died(reason) {
    if (dead) return;
    dead = true;
    if (tick) { clearInterval(tick); tick = null; }
    // 死んでいることを**見せる**(生きている版面と区別が付かないのが問題だった)
    screenEl.style.filter = 'grayscale(1) brightness(.45)';
    screenEl.style.pointerEvents = 'none';
    setStatus('停止');
    msgEl.textContent = '';
    var head = document.createElement('div');
    head.textContent = 'Office が停止しました';
    var why = document.createElement('div');
    why.className = 'why';
    why.textContent = String(reason).slice(0, 300);
    var again = document.createElement('button');
    again.textContent = '読み込み直す';
    again.addEventListener('click', function () { location.reload(); });
    msgEl.appendChild(head);
    msgEl.appendChild(why);
    msgEl.appendChild(again);
    msgEl.hidden = false;
    say('crashed', { reason: String(reason).slice(0, 300) });
  }
  /**
   * 🔴 **「死んだ」より先に「効かなくなった」が来る**(検証レポート #3、2026-08-12)。
   *
   * LO のスレッドが 1 本落ちると、**版面は生きたまま命令だけが通らなくなる**:
   *
   * | 効かなくなる | 動き続ける |
   * |---|---|
   * | 保存 / 文字数 / 書式ダイアログ / 全選択 / 太字 | 文字入力 / キャレット / 選択 |
   * | ── つまり **保存が黙って失敗する** | **メニューの展開**(項目のハイライトも正常) |
   *
   * ⚠ **メニューが開くので、user は壊れたことに気づけない。** 実測で 8 分待っても
   * 回復しなかった。abort ではないので `died()` は出ない ── **別の状態**が要る。
   *
   * ## ⚠ 本文は `e.message` に**入っていない**
   *
   * emscripten の `worker.onerror` は `err(...)` で印字したあと **`throw e`** で
   * ErrorEvent をそのまま投げ直す。すると window の error event は
   * `message = "Uncaught #<ErrorEvent>"` になり、**中身は `e.error.message` 側**に入る。
   * 片方だけ見ると 1 件も拾えない。
   */
  var degraded = false;
  var warnEl = document.getElementById('warn');
  function degrade(reason) {
    if (dead || degraded) return;
    degraded = true;
    setStatus('不安定');
    warnEl.textContent = '';
    var what = document.createElement('span');
    // ⚠ **保存できないことを先に言う。** user がいちばん失うのはそれである
    what.textContent = 'Office が不安定になりました。保存やメニューの操作が効きません。';
    var again = document.createElement('button');
    again.textContent = '読み込み直す';
    again.addEventListener('click', function () { location.reload(); });
    warnEl.appendChild(what);
    warnEl.appendChild(again);
    warnEl.hidden = false;
    say('degraded', { reason: String(reason).slice(0, 300) });
  }

  // ⚠ **何でも停止扱いにしない。** 拡張機能や無関係な例外まで拾うと、
  //    動いている版面に「停止しました」を被せることになる。
  //    wasm 由来だけを見る(`Aborted(...)` / `RuntimeError` / `memory access out of bounds`)。
  var FATAL = /Aborted\(|RuntimeError|memory access out of bounds|unreachable|table index is out of bounds/;
  // 🔴 スレッドが 1 本落ちた印。⚠ `func is not a constructor` は embind の
  //    `val::new_()` が worker に無い global を掴んだ形(#124)
  var DEGRADED = /func is not a constructor|sent an error!/;
  /** ⚠ window の error は**外側と中身の 2 つ**を見る(上の注記)。 */
  function errorText(e) {
    var inner = e && e.error;
    return String((e && e.message) || '') + ' | ' + String((inner && inner.message) || '');
  }
  window.addEventListener('error', function (e) {
    var text = errorText(e);
    // ⚠ 順番を守る ── abort のほうが重い。両方当たったら停止として扱う
    if (FATAL.test(text)) { died(text); return; }
    if (DEGRADED.test(text)) degrade(text);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    var text = String((r && r.message) || r);
    if (FATAL.test(text)) { died(text); return; }
    if (DEGRADED.test(text)) degrade(text);
  });

  // ── Ctrl + 英字が本文に混入するのを止める(#117)────────────────────
  //
  // 🔴 実測: `Ctrl+S` を押すと本文に **`s`** が入る(`test` → `tests`)。
  //    `Ctrl+A` で `a`、`Ctrl+Z` で `z`。**静かに文書が汚れる。**
  //
  // ⚠ 原因は 2 段ある。分けて扱わないと、直したつもりで動線を削る:
  //    ① **ブラウザが横取りする** ── `Ctrl+S`(ページを保存)/ `Ctrl+P`(印刷)/
  //       `Ctrl+O`(ファイルを開く)/ `Ctrl+F`(ページ内検索)。LO まで届かない。
  //       → `preventDefault()` で止める。**Qt のハンドラは走る**ので LO は受け取る
  //    ② **mac では Ctrl が LO の修飾キーではない** ── Qt は macOS で Cmd を
  //       Control へ読み替えるので、`Ctrl+英字` は LO のどの割り当てにも当たらず
  //       **ただの文字**として入る。ところが LO のメニューは `Ctrl+C` と表示するので
  //       user は Ctrl を押す。→ mac でだけ **握り潰す**(失う動線が無い)
  //
  // ⚠ **`altKey` は必ず除外する。** Windows の AltGr は `ctrl+alt` として届くので、
  //    ドイツ語配列の `@` などを潰してしまう。
  // 🔑 逃げ道は残す ── `F5` は 1 文字キーではないので、ここを通らない(必ず再読込できる)。
  //
  // 🔴 **止めるキーは「除外リスト」ではなく「名指しの一覧」で持つ**(検証レポート #3)。
  //
  // 初稿は「クリップボード(`c`/`x`/`v`)以外は全部 `preventDefault`」と書いた。
  // ⚠ それで **`Cmd+A`(全選択)を壊した** ── 直す前は動いていた機能である。
  // 「余計なものまで止めていた」のが原因なので、**ブラウザが実際に横取りするキーだけ**に絞る。
  // 🔑 `a` / `z` / `y` / `b` / `i` はブラウザが盗らないので、こちらが触る理由が無い。
  var STOLEN = {
    s: 1, // ページを保存
    p: 1, // 印刷
    o: 1, // ファイルを開く
    f: 1, // ページ内検索
    g: 1, // 次を検索
    d: 1, // ブックマーク
    h: 1, // 履歴
    j: 1, // ダウンロード
    u: 1, // ソースを表示
    e: 1, // 検索
    k: 1, // 検索
    l: 1, // アドレスバー
  };
  // ⚠ `r`(再読込)は**入れない** ── LO が固まったときの逃げ道である。
  // ⚠ `c` / `x` / `v` も**入れない** ── keydown を止めると `copy` / `paste` event が
  //    発火せず、クリップボードが死ぬ。
  var MAC = (navigator.userAgentData && navigator.userAgentData.platform === 'macOS')
    || /Mac|iPhone|iPad/.test(navigator.platform || '');
  window.addEventListener('keydown', function (e) {
    if (e.altKey || !e.key || e.key.length !== 1) return;
    if (MAC && e.ctrlKey && !e.metaKey) {
      // mac の Ctrl は LO に届いても何もしない。文字だけが残るので Qt にも渡さない
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    var cmd = MAC ? e.metaKey : (e.ctrlKey && !e.metaKey);
    if (cmd && STOLEN[e.key.toLowerCase()] === 1) e.preventDefault();
  }, true);

  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      // ⚠ **器だけ作る。中身は作らない。** 以前ここには「store を作らない」と
      //    書いてあったが、実装は作っていた ── コメントと実装が食い違っていた。
      //    どちらが正しいか: **作る**が正しい。open は version 1 を要求するので、
      //    未インストールの環境では `onupgradeneeded` が必ず走る。ここで
      //    store を作らずに抜けると、下の `transaction('meta')` が
      //    `NotFoundError` で throw し、「入っていません」ではなく
      //    **「保管庫を開けません」**という無関係な理由が出る(実装の都合が
      //    user の画面に漏れる)。
      // 🔑 「入っているか」の判定は **`meta.pack` の中身**で行う(下の
      //    `Array.isArray(meta.files)`)ので、空の store が在っても誤読しない。
      req.onupgradeneeded = function () {
        if (!req.result.objectStoreNames.contains('files')) req.result.createObjectStore('files');
        if (!req.result.objectStoreNames.contains('meta')) req.result.createObjectStore('meta');
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('idb open failed')); };
    });
  }
  function idbGet(db, store, key) {
    return new Promise(function (resolve, reject) {
      var r = db.transaction(store, 'readonly').objectStore(store).get(key);
      r.onsuccess = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error || new Error('idb get failed')); };
    });
  }

  /** gz の Blob を、解きながら Response にする(148MB を heap に載せない)。 */
  function gunzipResponse(blob, type) {
    var stream = blob.stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream, { headers: { 'Content-Type': type } });
  }

  /**
   * ObjectURL は**必ず**返す dispose で revoke する(不可侵: 寿命終端で revoke)。
   *
   * 🔴 ⚠ **`soffice.js` の URL を「読み込んだら revoke」してはいけない**
   * (2026-08-12 に調査レポートの助言を検算して分かった)。emscripten は
   * pthread を **その URL から**起こす:
   *
   *     pthreadMainJs = Module["mainScriptUrlOrBlob"]  // 未設定
   *     pthreadMainJs = _scriptName                    // = document.currentScript.src = この blob
   *     worker = new Worker(pthreadMainJs, …)
   *
   * つまり**寿命の終端は「読み込み終わった時」ではなく「窓を閉じる時」**である。
   * 早く返すと、LO が後からスレッドを作った瞬間に落ちる ── しかも
   * **プールを 16 に増やした**ので、作る回数はむしろ増える。
   */
  var urls = [];
  function lend(blob) { var u = URL.createObjectURL(blob); urls.push(u); return u; }
  window.addEventListener('pagehide', function () {
    for (var i = 0; i < urls.length; i += 1) URL.revokeObjectURL(urls[i]);
    urls.length = 0;
  });

  /**
   * 🔴 **worker に足りない global を先に生やす**(#124。2026-08-13 に実物で確定)。
   *
   * LO のコピーは **pthread(Web Worker)の中**で走り、そこで
   * `emscripten::val::global("ClipboardItem")` を掴んで `val::new_()` する。
   * ⚠ ところが **worker に `ClipboardItem` は無い** ── `val::global` は例外ではなく
   * `undefined` を返すので、生成コードの `new func(...)` が
   * `TypeError: func is not a constructor` になり、**その pthread が死ぬ**。
   *
   * ## それが「保存が黙って効かなくなる」の正体である
   *
   * 死ぬのは 1 本だけなので**版面は生き続ける**。入力もメニューの展開も動くのに、
   * 保存 / 全選択 / 書式ダイアログ / 太字が全部無反応になる ── user は気づけない。
   *
   * ## どうやって名前を突き止めたか(推測ではない)
   *
   * 報告される位置(`7:23486`)は emscripten の
   * `self.onunhandledrejection = e => { throw e.reason || e }` で、**再スロー地点**
   * だった(だから stack が空)。そこで手元の実物に対し、`val::global` が
   * undefined を返したときだけ**名前を持った投げる関数**を返すように 1 か所だけ
   * 書き換えて再現したところ、`PKC3-EMVAL-MISS:ClipboardItem` が出た。
   *
   * ## ⚠ これは「死なせない」だけで、コピペは直らない
   *
   * 実測(同じ手元の LO):
   *
   * | | 直す前 | shim を入れた後 |
   * |---|---|---|
   * | `Ctrl+C` / `Ctrl+X` | pthread が死ぬ | **エラー 0 件** |
   * | 以後の保存・メニュー | 全部無反応 | **効く** |
   * | 貼り付け | 無反応 | 無反応(文字数が変わらない) |
   *
   * 🔑 system clipboard へ**本当に橋を架ける**のは次段(#129)。ここでやるのは
   * **アプリを殺さないこと**である。⚠ 逆に言えば、ここで満足しないこと。
   *
   * ⚠ **錨に当てない。** 先頭へ足すだけなので、上流 glue の形が変わっても壊れない
   * (置換の空振りという失敗の形を、そもそも作らない)。
   * ⚠ メインスレッドには `ClipboardItem` が在るので、この IIFE は**何もしない**。
   */
  var WORKER_SHIMS = "(function(){if(typeof ClipboardItem!=='undefined')return;"
    + "self.ClipboardItem=function ClipboardItem(items,opts){this.items=items||{};"
    + "this.presentationStyle=(opts&&opts.presentationStyle)||'unspecified';"
    + "this.types=Object.keys(this.items);};"
    + "self.ClipboardItem.prototype.getType=function(t){return Promise.resolve(this.items[t]);};"
    + "if(self.navigator&&!self.navigator.clipboard){"
    + "Object.defineProperty(self.navigator,'clipboard',{configurable:true,value:{"
    + "write:function(){return Promise.resolve()},"
    + "writeText:function(){return Promise.resolve()},"
    + "read:function(){return Promise.resolve([])},"
    + "readText:function(){return Promise.resolve('')}}});}"
    + "})();\n";

  async function withWorkerShims(blob) {
    return new Blob([WORKER_SHIMS, await blob.text()], { type: 'text/javascript' });
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('script load failed')); };
      document.head.appendChild(s);
    });
  }

  /** Qt 6 の canvas は **shadow root の中**に在る(#88 §3.11 で 1 日溶かした罠)。 */
  function deepCanvases(root) {
    var out = [];
    (function walk(n) {
      var els = n.querySelectorAll('*');
      for (var i = 0; i < els.length; i += 1) {
        if (els[i].tagName === 'CANVAS') out.push(els[i]);
        if (els[i].shadowRoot) walk(els[i].shadowRoot);
      }
    })(root);
    return out;
  }

  /**
   * 🔴 **LO の窓を、器いっぱいで開かせる**(#117。2026-08-12 に実物で確かめた)。
   *
   * 既定では窓が器より小さく出る。⚠ これは見た目だけの話ではない ──
   * 窓が狭いと**項目の多いメニューが多段カラムに折り返して画面全体を塗りつぶし**、
   * user からは「クリックしたら画面が壊れた」に見える(調査レポート #2)。
   * さらに縦が足りないと窓の下端が切れ、**スクロールもできない**。
   *
   * ## 何を書くのか
   *
   * LO は窓の状態を `registrymodifications.xcu` の
   * `ooSetupFactoryWindowAttributes` に持つ。書式は
   * `左,上,幅,高;状態;最大化時の矩形;`(状態は VCL の bitmask、4 = Maximized)。
   *
   * ⚠ **上流の既定は既に `,,,;4;`(= 最大化)である。** つまり
   * 「最大化を頼んでいないから小さい」のではなく、**幾何が空だと Qt 側の既定の
   * 大きさに落ちる**。だから**明示の幾何を書く**のがこの直しの本体で、
   * 状態ビットを変えても何も起きない(1 / 4 / 24 を実測して同じだった)。
   *
   * ## ⚠ 単位は **device px**(CSS px ではない)
   *
   * 実測(同じ器 1400x800 CSS):
   *
   * | DPR | 書いた値 | 出た窓(CSS) |
   * |---|---|---|
   * | 2 | `1400,800`(CSS) | 700x624 ── **半分**になる |
   * | 2 | `2800,1600`(device) | **1400x800** ぴったり |
   * | 1 | `1400,800` | 1400x800 ぴったり |
   *
   * VCL は物理ピクセルで考えるので、**必ず `devicePixelRatio` を掛ける**。
   *
   * ## 🔴 ここに書くのは **客域**であって、窓の外寸ではない
   *
   * ⚠ 初稿は器の寸法をそのまま渡した。客域は確かに器と同じになったが、Qt は
   * その**外側に**枠と疑似タイトルバーを描くので、**窓全体が器からはみ出した**:
   *
   * ```
   * 器            [0, 34, 1200, 765]
   * 窓(装飾込み) [-5, 34, 1208, 795]   ← 幅 +8 / 高さ +30
   * → 客域の下端 y=825、ビューポート下端 y=799
   * → LibreOffice のステータスバーが 26px ぶん画面外に落ちる
   * ```
   *
   * 🔑 **測ったものと、user が見るものが違っていた。** 客域だけ測って「ぴったり」と
   * 報告し、はみ出しを見落とした ── 検証レポート #3 が実測で拾ってくれた。
   *
   * だから渡すのは **器 − 装飾**。最大化ボタンを押した窓の実測
   * (客域 `[4, 60, 1192, 735]`)と一致する。
   *
   * ⚠ 装飾の寸法は Qt の CSS 由来なので、上流が変えればずれる。⚠ ずれても
   * **小さくなる方向**(はみ出さない)なので、実害は「わずかな余白」で止まる。
   *
   * ### 実物で測った結果(器 1200x765 CSS)
   *
   * | | 窓の外寸 | 器と一致 |
   * |---|---|---|
   * | 仕込まない | `[324, 79, 551, 654]` ── 真ん中に小さく浮く | ✗ |
   * | 器をそのまま渡す(初稿) | 高さ +30 / 幅 +8 はみ出す | ✗ |
   * | **器 − 装飾(これ)** | `[-4, 34, 1200, 765]` | **✓** |
   *
   * ⚠ **例外が 1 つある。** LO には**客域の最小の高さ(約 744 device px)**が在り、
   * それを下回る要求は切り上げられる。DPR 1 で器が 774 CSS px より低いときだけ
   * 数 px はみ出す(実測: 器 765 → 窓 774 = 9px 超過。器 865 / 965 では**ぴったり**)。
   * こちらでは詰められないので、そういう窓だとだけ知っておく。
   *
   * ## 🔴 これで直らないもの(先に知っておく)
   *
   * **起動後にブラウザを縮めても窓は追従しない**(状態ビットを変えても同じ、実測)。
   * Qt の最大化ボタンを押した窓は追従するが、設定から「最大化」を頼んでも
   * そうはならない ── **そこは LO / Qt 側の仕事**である。ここで直すのは
   * **開いた瞬間の大きさ**だけ。
   */
  // Qt の窓装飾(CSS px)。⚠ 実測: `.title-bar` 22 + 枠 8 = 高さ 30 / 幅 8
  var FRAME_W = 8;
  var FRAME_H = 30;
  function seedWindowSize(FS) {
    try {
      var r = screenEl.getBoundingClientRect();
      // ⚠ 器が測れていないなら書かない(0x0 の窓を頼むほうが悪い)
      if (r.width < 1 || r.height < 1) return;
      var k = window.devicePixelRatio || 1;
      // ⚠ 装飾を引く。⚠ 引きすぎて 0 以下にしない(極端に小さい窓で潰れる)
      var w = Math.max(320, Math.round(r.width) - FRAME_W);
      var h = Math.max(240, Math.round(r.height) - FRAME_H);
      // ⚠ 原点にも**左枠ぶん**を足す。0 のままだと窓が 4px 左へずれ、
      //    左がはみ出して右に隙間ができる(実測: 窓 x = -4)
      var geom = Math.round((FRAME_W / 2) * k) + ',0,'
        + Math.round(w * k) + ',' + Math.round(h * k) + ';4;0,0,0,0;';
      var mods = [
        'com.sun.star.frame.StartModule',
        'com.sun.star.text.TextDocument',
        'com.sun.star.sheet.SpreadsheetDocument',
        'com.sun.star.presentation.PresentationDocument',
        'com.sun.star.drawing.DrawingDocument',
        'com.sun.star.text.WebDocument',
        'com.sun.star.text.GlobalDocument',
        'com.sun.star.chart2.ChartDocument',
        'com.sun.star.formula.FormulaProperties',
      ];
      var items = '';
      for (var i = 0; i < mods.length; i += 1) {
        items += '<item oor:path="/org.openoffice.Setup/Office/Factories/'
          + 'org.openoffice.Setup:Factory[&apos;' + mods[i] + '&apos;]">'
          + '<prop oor:name="ooSetupFactoryWindowAttributes" oor:op="fuse">'
          + '<value>' + geom + '</value></prop></item>';
      }
      var xcu = '<?xml version="1.0" encoding="UTF-8"?>\n'
        + '<oor:items xmlns:oor="http://openoffice.org/2001/registry"'
        + ' xmlns:xs="http://www.w3.org/2001/XMLSchema"'
        + ' xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' + items + '</oor:items>';
      // 保管先は `UserInstallation=$ORIGIN/..`(bootstraprc)= `/instdir/user`
      FS.mkdirTree('/instdir/user');
      FS.writeFile('/instdir/user/registrymodifications.xcu', xcu);
    } catch (e) {
      // ⚠ **大きさのために起動を落とさない。** 小さい窓のほうが、開かないよりましである
      console.warn('窓の大きさを仕込めませんでした', e);
    }
  }

  function missing() {
    var lack = [];
    if (!window.crossOriginIsolated) lack.push('cross-origin isolation');
    if (typeof SharedArrayBuffer !== 'function') lack.push('SharedArrayBuffer');
    if (typeof WebAssembly.Suspending !== 'function') lack.push('JSPI');
    if (typeof DecompressionStream !== 'function') lack.push('DecompressionStream');
    return lack;
  }

  async function main() {
    var lack = missing();
    if (lack.length) {
      fail('この環境では Office を動かせません(足りないもの: ' + lack.join(' / ') + ')');
      /**
       * 🔑 **分離が足りないだけなら、たいてい「もう一度」で直る。**
       *
       * COOP/COEP は Pages がヘッダを返せないので **service worker が被せている**。
       * その SW がまだこの文書を制御していない初回訪問 / 更新直後は
       * `crossOriginIsolated` が false になる ── **環境が悪いのではない**。
       *
       * ⚠ **勝手に読み直さない。** 自動 reload は「SW が永久に来ない環境」で輪になる。
       *    ここは user が押す 1 手に留める(押せば必ず 1 回で済む)。
       */
      if (lack.every(function (x) { return /isolation|SharedArrayBuffer/.test(x); })) {
        var hint = document.createElement('div');
        hint.className = 'why';
        hint.textContent = '準備が終わっていないだけかもしれません。読み直すと有効になることがあります。';
        var retry = document.createElement('button');
        retry.textContent = '読み込み直す';
        retry.addEventListener('click', function () { location.reload(); });
        msgEl.appendChild(hint);
        msgEl.appendChild(retry);
      }
      say('unsupported', { missing: lack });
      return;
    }
    var db;
    try { db = await openDb(); } catch (e) { fail('保管庫を開けません'); return; }
    var meta = await idbGet(db, 'meta', 'pack');
    if (!meta || !Array.isArray(meta.files)) {
      fail('Office 一式がまだ入っていません(PKC3 の設定から入れてください)');
      say('not-installed');
      return;
    }

    setStatus('読み込み中…');
    var need = ['soffice.js', 'qtloader.js', 'soffice.data.js.metadata',
      'soffice.wasm.gz', 'soffice.data.gz'];
    var blobs = {};
    for (var i = 0; i < need.length; i += 1) {
      blobs[need[i]] = await idbGet(db, 'files', need[i]);
      if (!blobs[need[i]]) { fail('一式が壊れています: ' + need[i] + ' がありません'); return; }
    }
    var fontNames = meta.files.map(function (f) { return f.name; })
      .filter(function (n) { return n.indexOf('fonts/') === 0; });
    var fonts = [];
    for (var j = 0; j < fontNames.length; j += 1) {
      var fb = await idbGet(db, 'files', fontNames[j]);
      if (fb) fonts.push([fontNames[j].slice('fonts/'.length), new Uint8Array(await fb.arrayBuffer())]);
    }

    // emscripten は `soffice.data.js.metadata` を **自分で fetch する**。
    // ObjectURL では相対解決できないので、`locateFile` で差し替える。
    var metaUrl = lend(blobs['soffice.data.js.metadata']);
    setStatus('展開中…');
    var dataBuf = await gunzipResponse(blobs['soffice.data.gz'], 'application/octet-stream')
      .arrayBuffer();

    await loadScript(lend(await withWorkerShims(blobs['soffice.js'])));
    await loadScript(lend(blobs['qtloader.js']));
    if (typeof window.qtLoad !== 'function' || typeof window.soffice_entry !== 'function') {
      fail('一式を読み込めませんでした'); return;
    }

    var params = new URLSearchParams(location.search);
    var docName = params.get('name') || '';
    if (docName) nameEl.textContent = docName;

    // 親から文書のバイト列を貰う(無ければ Start Center)。
    var docBytes = await new Promise(function (resolve) {
      if (!params.has('await-doc')) { resolve(null); return; }
      // ⚠ 待ちっぱなしにしない ── 来なければ Start Center で開く
      var timer = setTimeout(function () { resolve(null); }, 15000);
      var prev = ch.onmessage;
      ch.onmessage = function (ev) {
        var d = ev && ev.data;
        if (d && d.pkc3Office === 'document') {
          clearTimeout(timer);
          ch.onmessage = prev;
          resolve(new Uint8Array(d.payload.bytes));
          return;
        }
        if (prev) prev(ev);
      };
      say('ready-for-document');
    });

    setStatus('起動中…');
    msgEl.hidden = true;
    screenEl.hidden = false;
    var t0 = Date.now();
    try {
      var inst = window.__lo = await window.qtLoad({
        noInitialRun: true,
        locateFile: function (path) {
          return path === 'soffice.data.js.metadata' ? metaUrl : path;
        },
        getPreloadedPackage: function () { return dataBuf; },
        instantiateWasm: function (imports, ok) {
          WebAssembly.instantiateStreaming(
            gunzipResponse(blobs['soffice.wasm.gz'], 'application/wasm'), imports,
          ).then(function (r) { ok(r.instance, r.module); }, function (e) {
            // ⚠ **ここから先へは進めない。** `ok()` を呼ばないので emscripten は
            //    初期化待ちのまま宙吊りになり、`await qtLoad(...)` は解決も棄却も
            //    しない ── **下の catch には入らない**。だから理由はここで出し切る。
            console.error(e);
            died('本体を読み込めません: ' + String((e && e.message) || e).slice(0, 160));
          });
          return {};
        },
        qt: {
          onLoaded: function () { setStatus('起動中…'); },
          // 🔴 **異常終了はここに来る**(実測: `{"text":"'HEAPU8' was not exported…",
          //    "crashed":true}`)。以前は生 JSON を上部バーへ流すだけで、版面は
          //    生きているように見えたままだった
          onExit: function (d) {
            if (d && d.crashed) { died((d && d.text) || 'crashed'); return; }
            setStatus('終了しました');
          },
          entryFunction: window.soffice_entry,
          containerElements: [screenEl],
        },
      });
      var FS = inst.FS;
      // 🔴 **展開に使った 148MB を返す**(不可侵: 生成物はライフサイクル終端で破棄)。
      //    `getPreloadedPackage` は初期化中に 1 度だけ呼ばれ、中身は既に MEMFS へ
      //    写されている ── ここから先は**閉じるまで誰も読まないのに持ち続ける**。
      dataBuf = null;
      /**
       * フォントを入れる。⚠ **1 本のしくじりで起動ごと落とさない。**
       *
       * 以前は素の `FS.writeFile` を並べていたので、親ディレクトリが無いだけで
       * throw し、外側の catch が「起動に失敗しました: …」という**原因の分からない
       * 文言**にして終わっていた ── LO 自体は正常に立ち上がっているのに、である。
       */
      try { FS.mkdirTree('/instdir/share/fonts/truetype'); } catch (e) { /* 既に在る */ }
      var badFonts = 0;
      for (var k = 0; k < fonts.length; k += 1) {
        try {
          FS.writeFile('/instdir/share/fonts/truetype/' + fonts[k][0], fonts[k][1]);
        } catch (e) {
          badFonts += 1;
          console.warn('font skipped: ' + fonts[k][0], e);
        }
      }
      if (badFonts) console.warn('入らなかったフォント: ' + badFonts + ' 本');
      // ⚠ 書き終わったら手放す(MEMFS が持っている ── こちらの配列は二重持ち)
      fonts.length = 0;
      seedWindowSize(FS);
      var args = [];
      if (docBytes) {
        try { FS.mkdir('/work'); } catch (e) { /* 既に在る */ }
        var path = '/work/' + (docName || 'document').replace(/[/\\]/g, '_');
        FS.writeFile(path, docBytes);
        args.push(path);
        window.__loDocPath = path;
      }
      // 版面が出たら確定させる。⚠ callMain は event loop に入ったまま戻らないことがある
      //
      // ⚠ **上限を置く。** 版面が出なければ `clearInterval` に到達せず、
      //    300ms ごとの全走査(`querySelectorAll` を shadow root まで)が**永久に回る**。
      // 🔑 上限に達しても `died()` にはしない ── **遅いだけかもしれない**。
      //    分かっているのは「まだ出ていない」ことだけなので、そう言う。
      var ticks = 0;
      tick = setInterval(function () {
        var cs = deepCanvases(screenEl);
        for (var m = 0; m < cs.length; m += 1) {
          if (cs[m].width > 0) {
            clearInterval(tick);
            tick = null;
            setStatus('表示中 (' + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒)');
            say('painted', { ms: Date.now() - t0 });
            return;
          }
        }
        ticks += 1;
        if (ticks >= 120) {          // 300ms × 120 = 36 秒
          clearInterval(tick);
          tick = null;
          setStatus('起動に時間がかかっています');
        }
      }, 300);
      inst.callMain(args);
    } catch (e) {
      console.error(e);
      fail('起動に失敗しました: ' + String((e && e.message) || e).slice(0, 160));
    }
  }

  // 本体へ「閉じた」を知らせる ── 使い回し判定を本体が持てるように
  window.addEventListener('pagehide', function () { clearInterval(beat); say('closed'); });
  main();
})();
</script>
</body>
</html>
